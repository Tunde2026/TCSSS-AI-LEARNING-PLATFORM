<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — AI Learning Platform</title>
<link rel="stylesheet" href="assets/shell.css">
<style>
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--blush); height: 100vh; overflow: hidden; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 32px 24px; min-height: 0; }
  .chat-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .chat-empty { max-width: 640px; margin: 40px auto 0; text-align: center; }
  .chat-empty__icon { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(155deg, var(--navy), var(--soft-navy)); color: var(--white); display: grid; place-items: center; margin: 0 auto 22px; font-size: 1.7rem; box-shadow: 0 8px 24px rgba(17,16,74,0.18); }
  .chat-empty__title { font-family: var(--font-head); font-size: 2rem; font-weight: 600; color: var(--navy); margin-bottom: 8px; letter-spacing: -0.02em; }
  .chat-empty__sub { color: var(--slate); font-size: 1rem; margin-bottom: 34px; }
  .chat-empty__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .suggestion-card { padding: 18px; background: var(--white); border: 1.5px solid var(--border); border-radius: 14px; text-align: left; cursor: pointer; transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition); font-family: var(--font-body); }
  .suggestion-card:hover { border-color: var(--gold); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .suggestion-card__title { font-weight: 600; font-size: 0.9rem; color: var(--navy); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .suggestion-card__title i { color: var(--red); font-size: 0.88rem; }
  .suggestion-card__desc { font-size: 0.82rem; color: var(--slate); line-height: 1.5; }

  .msg-row { display: flex; gap: 12px; align-items: flex-start; }
  .msg-row--user { flex-direction: row-reverse; }
  .msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; font-size: 0.8rem; }
  .msg-row--ai .msg-avatar { background: linear-gradient(135deg, var(--red), var(--deep-red)); color: var(--white); box-shadow: 0 2px 8px rgba(230,17,30,0.25); }
  .msg-row--user .msg-avatar { background: linear-gradient(135deg, var(--navy), var(--soft-navy)); color: var(--white); }

  .msg-body { min-width: 0; max-width: 82%; }
  .msg-content { padding: 13px 17px; border-radius: 18px; line-height: 1.65; word-wrap: break-word; font-size: 0.95rem; }
  .msg-row--user .msg-content { white-space: pre-wrap; background: linear-gradient(135deg, var(--navy), var(--soft-navy)); color: var(--white); border-top-right-radius: 6px; box-shadow: 0 2px 8px rgba(17,16,74,0.15); }
  .msg-row--ai .msg-content { background: var(--white); color: var(--ink); box-shadow: var(--shadow-sm); border: 1px solid var(--border); border-top-left-radius: 6px; }

  .md-content { white-space: normal; }
  .md-content > *:first-child { margin-top: 0 !important; }
  .md-content > *:last-child { margin-bottom: 0 !important; }
  .md-content p { margin: 0 0 0.85em; line-height: 1.7; }
  .md-content p:last-child { margin-bottom: 0; }
  .md-content h1, .md-content h2, .md-content h3, .md-content h4 { font-family: var(--font-head); color: var(--navy); margin: 1.15em 0 0.5em; line-height: 1.3; letter-spacing: -0.01em; }
  .md-content h1 { font-size: 1.3rem; }
  .md-content h2 { font-size: 1.12rem; }
  .md-content h3 { font-size: 1rem; }
  .md-content h4 { font-size: 0.94rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--slate); font-family: var(--font-ui); }
  .md-content ul, .md-content ol { margin: 0 0 0.85em; padding-left: 1.5em; }
  .md-content li { margin: 0.28em 0; line-height: 1.65; }
  .md-content li::marker { color: var(--red); font-weight: 600; }
  .md-content strong { font-weight: 700; color: var(--ink); }
  .md-content em { font-style: italic; }
  .md-content code { font-family: var(--font-ui); font-size: 0.86em; background: var(--blush); color: var(--deep-red); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border-soft); word-break: break-word; }
  .md-content pre { background: #1A1956; color: #E4E3F3; padding: 14px 18px; border-radius: 12px; overflow-x: auto; font-size: 0.85rem; line-height: 1.6; margin: 0.9em 0; border: 1px solid #2A2978; box-shadow: 0 2px 8px rgba(17,16,74,0.15); }
  .md-content pre code { background: transparent; color: inherit; padding: 0; border: none; font-size: inherit; white-space: pre; }
  .md-content blockquote { border-left: 3px solid var(--gold); background: var(--gold-50); padding: 10px 16px; margin: 0.9em 0; border-radius: 0 10px 10px 0; color: #6A4F13; font-style: italic; }
  .md-content a { color: var(--red); text-decoration: none; border-bottom: 1px solid rgba(230,17,30,0.3); }
  .md-content a:hover { border-bottom-color: var(--red); text-decoration: none; }
  .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
  .md-content table { width: 100%; border-collapse: collapse; margin: 0.9em 0; font-size: 0.88rem; background: var(--white); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .md-content th, .md-content td { padding: 8px 12px; border-bottom: 1px solid var(--border-soft); text-align: left; }
  .md-content th { background: var(--blush); font-weight: 600; color: var(--navy); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .md-content tr:last-child td { border-bottom: none; }

  .md-content .katex { font-size: 1.05em; }
  .md-content .katex-display { margin: 1.1em 0; overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
  .md-content .katex-display > .katex { font-size: 1.12em; }
  .md-content .katex-error { color: var(--deep-red); font-family: var(--font-ui); font-size: 0.85rem; background: #FDECEC; padding: 2px 6px; border-radius: 4px; }

  /* Images */
  .msg-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
  .msg-image { position: relative; border-radius: 14px; overflow: hidden; background: var(--blush); border: 1px solid var(--border); box-shadow: var(--shadow-xs); }
  .msg-image a.img-link { display: block; }
  .msg-image img { width: 100%; height: 200px; object-fit: cover; display: block; transition: transform 300ms var(--ease-out); }
  .msg-image:hover img { transform: scale(1.05); }
  .msg-image__download { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 9px; background: rgba(17,16,74,0.7); color: var(--white); border: none; cursor: pointer; display: grid; place-items: center; font-size: 0.85rem; opacity: 0; transition: opacity var(--transition), background var(--transition), transform 120ms var(--ease); z-index: 3; backdrop-filter: blur(6px); }
  .msg-image:hover .msg-image__download { opacity: 1; }
  .msg-image__download:hover { background: var(--red); transform: scale(1.08); }
  .msg-image__credit { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent); color: var(--white); font-family: var(--font-ui); font-size: 0.6rem; padding: 22px 10px 6px; letter-spacing: 0.04em; pointer-events: none; }
  .msg-image--broken { background: #FDECEC; padding: 20px; text-align: center; color: var(--deep-red); }
  .msg-image--broken i { font-size: 1.5rem; display: block; margin-bottom: 8px; }
  .msg-image--broken a { color: var(--deep-red); font-weight: 600; text-decoration: underline; word-break: break-all; font-size: 0.82rem; }

  /* Tool cards */
  .msg-tools { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .tool-card {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; background: var(--white);
    border: 1.5px solid var(--border); border-radius: 14px;
    text-decoration: none; color: inherit;
    transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    box-shadow: var(--shadow-xs);
  }
  .tool-card:hover { border-color: var(--gold); box-shadow: var(--shadow-md); transform: translateY(-2px); text-decoration: none; }
  .tool-card__icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.1rem; flex-shrink: 0; }
  .tool-card__icon--quiz       { background: #FBF3E1; color: var(--gold); }
  .tool-card__icon--flashcards { background: #FDECEC; color: var(--red); }
  .tool-card__icon--notes      { background: #ECEBF5; color: var(--navy); }
  .tool-card__icon--practice   { background: #ECEBF5; color: var(--navy); }
  .tool-card__icon--vis        { background: #FBF3E1; color: var(--gold); }
  .tool-card__icon--plan       { background: #FDECEC; color: var(--red); }
  .tool-card__icon--exam       { background: var(--blush); color: var(--slate); }
  .tool-card__icon--mistakes   { background: #ECEBF5; color: var(--navy); }
  .tool-card__icon--sketch     { background: #FBF3E1; color: var(--gold); }
  .tool-card__body { flex: 1; min-width: 0; }
  .tool-card__title { font-family: var(--font-head); font-weight: 600; font-size: 0.98rem; color: var(--navy); margin: 0 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-card__meta { font-family: var(--font-ui); font-size: 0.68rem; letter-spacing: 0.04em; color: var(--slate); margin: 0; text-transform: uppercase; }
  .tool-card__arrow { color: var(--slate); font-size: 0.85rem; flex-shrink: 0; transition: transform var(--transition), color var(--transition); }
  .tool-card:hover .tool-card__arrow { color: var(--red); transform: translateX(3px); }

  /* Shared widget helpers */
  .widget-loading, .widget-error { padding: 24px; text-align: center; color: var(--slate); font-size: 0.9rem; }
  .widget-error { color: var(--deep-red); }

  /* Quiz widget */
  .quiz-widget { margin-top: 14px; background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .quiz-widget__head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: linear-gradient(135deg, var(--navy), var(--soft-navy)); color: var(--white); }
  .quiz-widget__icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.15); color: var(--gold-300); display: grid; place-items: center; font-size: 1rem; flex-shrink: 0; }
  .quiz-widget__title { font-family: var(--font-head); font-weight: 600; font-size: 0.98rem; margin: 0 0 2px; }
  .quiz-widget__meta { font-family: var(--font-ui); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.75; }
  .quiz-widget__questions { max-height: 520px; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 18px; }
  .quiz-widget__questions::-webkit-scrollbar { width: 6px; }
  .quiz-widget__questions::-webkit-scrollbar-thumb { background: rgba(17,16,74,0.15); border-radius: 3px; }
  .quiz-q { padding-bottom: 14px; border-bottom: 1px solid var(--border-soft); }
  .quiz-q:last-child { border-bottom: none; padding-bottom: 0; }
  .quiz-q__num { font-family: var(--font-ui); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); font-weight: 600; margin-bottom: 6px; }
  .quiz-q__text { font-weight: 500; color: var(--ink); font-size: 0.94rem; line-height: 1.55; margin-bottom: 10px; }
  .quiz-q.is-correct .quiz-q__num { color: var(--green); }
  .quiz-q.is-wrong   .quiz-q__num { color: var(--deep-red); }
  .quiz-q__opts { display: flex; flex-direction: column; gap: 6px; }
  .quiz-opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--white); border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer; font-family: var(--font-body); font-size: 0.88rem; text-align: left; color: var(--ink); transition: border-color var(--transition), background var(--transition); width: 100%; }
  .quiz-opt:hover:not(:disabled) { border-color: var(--navy); background: var(--blush); }
  .quiz-opt:disabled { cursor: default; }
  .quiz-opt.is-selected { border-color: var(--red); background: #FDECEC; }
  .quiz-opt.is-selected .quiz-opt__label { background: var(--red); color: var(--white); }
  .quiz-opt.is-correct-answer { border-color: var(--green); background: var(--green-bg); }
  .quiz-opt.is-correct-answer .quiz-opt__label { background: var(--green); color: var(--white); }
  .quiz-opt.is-wrong-answer { border-color: var(--red); background: #FDECEC; opacity: 0.85; }
  .quiz-opt__label { width: 24px; height: 24px; border-radius: 50%; background: var(--blush-deep); color: var(--navy); display: grid; place-items: center; font-family: var(--font-ui); font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
  .quiz-opt__text { line-height: 1.45; padding-top: 3px; }
  .quiz-explanation { margin-top: 10px; padding: 10px 12px; background: #EEF3FB; border-radius: 10px; font-size: 0.82rem; line-height: 1.55; color: var(--navy); }
  .quiz-explanation strong { display: block; font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); margin-bottom: 4px; }
  .quiz-widget__actions { padding: 14px 18px; background: var(--blush); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .quiz-submit { padding: 10px 20px; border: none; border-radius: 999px; background: linear-gradient(135deg, var(--red), var(--deep-red)); color: var(--white); font-family: var(--font-body); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: opacity var(--transition), transform 120ms var(--ease); }
  .quiz-submit:hover:not(:disabled) { transform: translateY(-1px); }
  .quiz-submit:disabled { background: var(--slate-300); cursor: not-allowed; opacity: 0.7; }
  .quiz-widget__progress { font-family: var(--font-ui); font-size: 0.72rem; color: var(--slate); letter-spacing: 0.04em; }
  .quiz-widget__score { display: flex; align-items: baseline; gap: 10px; }
  .quiz-widget__score-num { font-family: var(--font-head); font-size: 1.6rem; font-weight: 700; color: var(--navy); line-height: 1; }
  .quiz-ask-ai, .flashcard-ask-ai { padding: 10px 18px; border: none; border-radius: 999px; background: var(--navy); color: var(--white); font-family: var(--font-body); font-size: 0.86rem; font-weight: 600; cursor: pointer; transition: background var(--transition), transform 120ms var(--ease); }
  .quiz-ask-ai:hover, .flashcard-ask-ai:hover { background: var(--soft-navy); transform: translateY(-1px); }

  /* Flashcard widget */
  .flashcard-widget { margin-top: 14px; background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .flashcard-widget__head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: linear-gradient(135deg, var(--red), var(--deep-red)); color: var(--white); }
  .flashcard-widget__icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.15); color: var(--white); display: grid; place-items: center; font-size: 1rem; flex-shrink: 0; }
  .flashcard-widget__title { font-family: var(--font-head); font-weight: 600; font-size: 0.98rem; margin: 0 0 2px; }
  .flashcard-widget__meta { font-family: var(--font-ui); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8; }

  .flashcard-widget__stage { padding: 20px; display: flex; flex-direction: column; align-items: center; background: var(--blush); }
  .flashcard-widget__card { width: 100%; max-width: 480px; height: 220px; perspective: 1200px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .flashcard-widget__inner { position: relative; width: 100%; height: 100%; transition: transform 600ms cubic-bezier(0.5, 0.05, 0.2, 1); transform-style: preserve-3d; }
  .flashcard-widget__card.is-flipped .flashcard-widget__inner { transform: rotateY(180deg); }
  .flashcard-widget__face { position: absolute; inset: 0; border-radius: 16px; padding: 26px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: var(--shadow-md); overflow: hidden; }
  .flashcard-widget__face--front { background: linear-gradient(155deg, var(--navy), var(--soft-navy)); color: var(--white); }
  .flashcard-widget__face--back { background: var(--white); color: var(--ink); border: 2px solid var(--gold); transform: rotateY(180deg); }
  .flashcard-widget__corner { position: absolute; top: 12px; left: 14px; font-family: var(--font-ui); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .flashcard-widget__face--front .flashcard-widget__corner { background: rgba(255,255,255,0.14); color: var(--gold-300); }
  .flashcard-widget__face--back .flashcard-widget__corner { background: var(--gold-50); color: var(--warn); }
  .flashcard-widget__text { font-family: var(--font-head); font-size: 1.05rem; font-weight: 600; line-height: 1.4; margin: 0; max-height: 100%; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; }
  .flashcard-widget__face--front .flashcard-widget__text { font-size: 1.15rem; color: var(--white); }
  .flashcard-widget__face--back .flashcard-widget__text { font-size: 1rem; color: var(--navy); line-height: 1.5; }
  .flashcard-widget__hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; opacity: 0.7; white-space: nowrap; }
  .flashcard-widget__face--front .flashcard-widget__hint { color: rgba(255,255,255,0.7); }
  .flashcard-widget__face--back .flashcard-widget__hint { color: var(--slate); }

  .flashcard-widget__rate { margin-top: 18px; width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity 280ms var(--ease-out), transform 280ms var(--ease-out); }
  .flashcard-widget__rate.is-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .flashcard-rate-btn { padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; font-family: var(--font-body); font-size: 0.82rem; font-weight: 600; display: flex; flex-direction: column; gap: 2px; align-items: center; transition: border-color var(--transition), background var(--transition), transform 120ms var(--ease); }
  .flashcard-rate-btn:hover { transform: translateY(-1px); }
  .flashcard-rate-btn:active { transform: translateY(0); }
  .flashcard-rate-btn small { font-family: var(--font-ui); font-size: 0.58rem; color: var(--slate); font-weight: 400; letter-spacing: 0.04em; }
  .flashcard-rate-btn--again { color: var(--deep-red); border-color: #F3C5C5; }
  .flashcard-rate-btn--again:hover { background: #FDECEC; border-color: var(--red); }
  .flashcard-rate-btn--hard  { color: var(--warn); border-color: #EFD9A6; }
  .flashcard-rate-btn--hard:hover { background: var(--gold-50); border-color: var(--gold); }
  .flashcard-rate-btn--good  { color: var(--navy); border-color: #C7C6E0; }
  .flashcard-rate-btn--good:hover { background: var(--blush); border-color: var(--navy); }
  .flashcard-rate-btn--easy  { color: var(--green); border-color: #B9DDC3; }
  .flashcard-rate-btn--easy:hover { background: var(--green-bg); border-color: var(--green); }

  .flashcard-widget__hint-line { margin-top: 18px; font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.06em; color: var(--slate); opacity: 0.75; transition: opacity var(--transition); }
  .flashcard-widget__hint-line.is-hidden { opacity: 0; }

  .flashcard-widget__progress { padding: 12px 20px; background: var(--white); border-top: 1px solid var(--border-soft); display: flex; align-items: center; gap: 12px; }
  .flashcard-widget__progress-bar { flex: 1; height: 4px; background: var(--blush-deep); border-radius: 3px; overflow: hidden; }
  .flashcard-widget__progress-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--deep-red)); border-radius: 3px; transition: width 320ms var(--ease-out); }
  .flashcard-widget__progress-label { font-family: var(--font-ui); font-size: 0.68rem; color: var(--slate); letter-spacing: 0.04em; flex-shrink: 0; }

  .flashcard-widget__done { padding: 36px 24px; text-align: center; }
  .flashcard-widget__done-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--green-bg); color: var(--green); display: grid; place-items: center; font-size: 1.4rem; margin: 0 auto 16px; }
  .flashcard-widget__done-title { font-family: var(--font-head); font-size: 1.15rem; color: var(--navy); margin: 0 0 6px; }
  .flashcard-widget__done-desc { font-size: 0.88rem; color: var(--slate); margin: 0 0 20px; }
  .flashcard-widget__done-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  /* Meta */
  .msg-meta { font-family: var(--font-ui); font-size: 0.65rem; color: var(--slate); margin-top: 8px; opacity: 0.75; padding: 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msg-row--user .msg-meta { text-align: right; justify-content: flex-end; }
  .meta-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.04em; font-weight: 500; }
  .meta-badge--search { background: var(--gold-50); color: var(--warn); }
  .meta-badge--library { background: var(--green-bg); color: var(--green); }
  .meta-badge--attachment { background: #EEF3FB; color: var(--navy); }
  .sources-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--blush); color: var(--navy); font-family: var(--font-ui); font-size: 0.62rem; letter-spacing: 0.04em; font-weight: 500; cursor: pointer; border: none; transition: background var(--transition); }
  .sources-toggle:hover { background: var(--blush-deep); }

  .attach-strip { max-width: 780px; margin: 0 auto 8px; display: none; gap: 8px; flex-wrap: wrap; }

  .attach-chip__icon { width: 26px; height: 26px; border-radius: 8px; background: var(--blush); color: var(--navy); display: grid; place-items: center; font-size: 0.72rem; flex-shrink: 0; }

  .composer-btn { width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; font-size: 0.88rem; transition: background var(--transition), transform var(--transition), color var(--transition); }
  .composer-attach, .composer-mic { background: transparent; color: var(--slate); }
  .composer-attach:hover:not(:disabled), .composer-mic:hover:not(:disabled) { background: var(--blush); color: var(--navy); }

  .composer-mic.is-recording { background: var(--red); color: var(--white); animation: mic-pulse 1.4s infinite; }
  @keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(230,17,30,0.5); } 50% { box-shadow: 0 0 0 8px rgba(230,17,30,0); } }

  .drag-overlay { position: fixed; inset: 0; background: rgba(17,16,74,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 400; pointer-events: none; }
  .drag-overlay.is-visible { display: flex; }
  .drag-overlay__box { background: var(--white); border-radius: 24px; padding: 60px 80px; text-align: center; box-shadow: var(--shadow-xl); border: 3px dashed var(--gold); }
  .drag-overlay__box i { font-size: 3rem; color: var(--gold); margin-bottom: 16px; display: block; }
  .drag-overlay__box p { font-family: var(--font-head); font-size: 1.2rem; color: var(--navy); margin: 0; font-weight: 600; }

  .new-chat-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 13px; margin-bottom: 14px; border-radius: 11px; background: linear-gradient(135deg, var(--red), var(--red-600)); color: var(--white); border: none; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background var(--transition), transform var(--transition); box-shadow: 0 2px 8px rgba(230,17,30,0.25); }
  .new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(230,17,30,0.35); }
  .conv-item { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; padding: 9px 9px 9px 12px; border-radius: 9px; background: transparent; border: none; color: rgba(255,255,255,0.72); font-family: var(--font-body); font-size: 0.85rem; text-align: left; cursor: pointer; transition: background var(--transition), color var(--transition); }
  .conv-item:hover { background: rgba(255,255,255,0.07); color: var(--white); }
  .conv-item.is-active { background: rgba(255,255,255,0.12); color: var(--white); }
  .conv-item__title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .conv-item__pin { color: var(--gold); font-size: 0.65rem; flex-shrink: 0; }
  .conv-item__menu-btn { flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px; border: none; background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; display: grid; place-items: center; opacity: 0; transition: opacity var(--transition), background var(--transition); }
  .conv-item:hover .conv-item__menu-btn { opacity: 1; }
  .conv-item__menu-btn:hover { background: rgba(255,255,255,0.1); color: var(--white); }
  .conv-item__menu-btn.is-open { opacity: 1; background: rgba(255,255,255,0.1); }
  .conv-item__rename-input { flex: 1; background: rgba(0,0,0,0.25); border: 1px solid var(--gold); border-radius: 6px; color: var(--white); font-family: var(--font-body); font-size: 0.85rem; padding: 4px 8px; min-width: 0; outline: none; }
  .conv-menu { position: fixed; z-index: 100; min-width: 160px; background: var(--white); border-radius: 12px; box-shadow: var(--shadow-xl); padding: 6px; display: flex; flex-direction: column; }
  .conv-menu__item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 7px; background: transparent; border: none; color: var(--ink); font-family: var(--font-body); font-size: 0.86rem; text-align: left; cursor: pointer; }
  .conv-menu__item:hover { background: var(--blush); }
  .conv-menu__item i { width: 14px; text-align: center; font-size: 0.8rem; }

  #mention-popup { position: absolute; background: var(--white); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-xl); padding: 6px; max-height: 240px; overflow-y: auto; z-index: 250; min-width: 240px; display: none; }
  .mention-item { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: 9px; cursor: pointer; font-size: 0.9rem; }
  .mention-item:hover { background: var(--blush); }
  .mention-item__avatar { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--navy), var(--soft-navy)); color: var(--white); display: grid; place-items: center; font-weight: 600; font-size: 0.8rem; flex-shrink: 0; }

  @media (max-width: 860px) {

    .composer-wrap { padding: 12px 14px 16px; }

<body>
  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="chat-main">
      <div class="chat-scroll" id="scroll">
        <div class="chat-inner" id="inner"></div>
      </div>

      <div class="composer-wrap">
        <div class="attach-strip" id="attach-strip"></div>
        <form class="composer" id="composer">
          <button class="composer-btn composer-attach" id="attach-btn" type="button" aria-label="Attach file" title="Attach document">
            <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
          </button>
          <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
          <button class="composer-btn composer-mic" id="mic" type="button" aria-label="Voice input" title="Voice input">
            <i class="fa-solid fa-microphone" id="mic-icon" aria-hidden="true"></i>
          </button>
          <button class="composer-btn composer-send" type="submit" id="send" aria-label="Send">
            <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
          </button>
        </form>

        <div class="recording-banner" id="recording-banner">
          <span class="recording-banner__dot"></span>
          <span>Recording… <span id="recording-time">0:00</span></span>
          <span style="opacity:0.7">— tap the mic to stop</span>
        </div>

        <div class="composer-hint">AI can make mistakes. Verify important information.</div>
        <input type="file" id="file-input" accept=".pdf,.docx,.doc,.txt,.md,.epub" multiple style="display:none">
      </div>
    </main>
  </div>

  <div class="drag-overlay" id="drag-overlay">
    <div class="drag-overlay__box">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <p>Drop files to attach</p>
    </div>
  </div>

  <div class="modal-overlay" id="modal-delete">
    <div class="modal">
      <h3 class="modal__title">Delete conversation?</h3>
      <p class="modal__body" id="modal-delete-body">This cannot be undone.</p>
      <div class="modal__actions">
        <button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm" type="button">Delete</button>
      </div>
    </div>
  </div>

<script src="assets/shell.js"></script>
<script>
  (function () {
    'use strict';

    var scrollEl  = document.getElementById('scroll');
    var innerEl   = document.getElementById('inner');
    var form      = document.getElementById('composer');
    var input     = document.getElementById('input');
    var sendBtn   = document.getElementById('send');
    var micBtn    = document.getElementById('mic');
    var micIcon   = document.getElementById('mic-icon');
    var attachBtn = document.getElementById('attach-btn');
    var fileInput = document.getElementById('file-input');
    var attachStrip = document.getElementById('attach-strip');
    var recBanner = document.getElementById('recording-banner');
    var recTime   = document.getElementById('recording-time');
    var dragOverlay = document.getElementById('drag-overlay');

    var currentUser         = null;
    var currentConversation = null;
    var conversationList    = [];
    var agents              = [];
    var history             = [];
    var openMenu            = null;
    var pendingDeleteId     = null;
    var mentionState        = null;
    var stagedAttachments   = [];

    var mediaRecorder = null;
    var mediaStream   = null;
    var audioChunks   = [];
    var recordingStart = 0;
    var recordingTimer = null;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function downloadImage(url, baseName) {
      var name = (baseName || 'image').replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 50);
      var ext = url.split('.').pop().split('?')[0] || 'png';
      if (ext.length > 5 || !/^[a-z]+$/i.test(ext)) ext = 'png';
      var filename = name + '.' + ext;
      fetch(url, { credentials: 'same-origin' })
        .then(function (r) { if (!r.ok) throw new Error('fetch failed'); return r.blob(); })
        .then(function (blob) {
          var objectUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = objectUrl; a.download = filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 1000);
        })
        .catch(function () { window.open(url, '_blank', 'noopener'); });
    }

    async function ensureLoggedIn() {
      var res = await fetch('/api/auth/me', { credentials: 'include' });
      if (res.status === 401) { window.location.href = 'index.html'; return false; }
      var data = await res.json();
      currentUser = data.user;
      return true;
    }

    async function loadAgents() {
      try {
        var res = await fetch('/api/agents', { credentials: 'include' });
        if (!res.ok) return;
        var data = await res.json();
        agents = data.agents || [];
      } catch (_) {}
    }

    async function apiList() {
      var res = await fetch('/api/conversations', { credentials: 'include' });
      if (!res.ok) return [];
      var d = await res.json();
      return d.conversations || [];
    }
    async function apiLoad(id) {
      var res = await fetch('/api/conversations/' + id, { credentials: 'include' });
      if (!res.ok) return null;
      return res.json();
    }
    async function apiRename(id, title) {
      var res = await fetch('/api/conversations/' + id + '/rename', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', body: JSON.stringify({ title: title }),
      });
      return res.ok ? (await res.json()).conversation : null;
    }
    async function apiPin(id, pinned) {
      var res = await fetch('/api/conversations/' + id + '/pin', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', body: JSON.stringify({ pinned: pinned }),
      });
      return res.ok ? (await res.json()).conversation : null;
    }
    async function apiDelete(id) {
      var res = await fetch('/api/conversations/' + id, { method: 'DELETE', credentials: 'include' });
      return res.ok;
    }

    function groupConversations(list) {
      var now = new Date();
      var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var t1 = t0 - 86400000;
      var t7 = t0 - 7 * 86400000;
      var g = { pinned: [], today: [], yesterday: [], week: [], older: [] };
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (c.pinned) { g.pinned.push(c); continue; }
        var t = new Date(c.updated_at).getTime();
        if (t >= t0)      g.today.push(c);
        else if (t >= t1) g.yesterday.push(c);
        else if (t >= t7) g.week.push(c);
        else              g.older.push(c);
      }
      return g;
    }

    function convItemHTML(c) {
      var active = currentConversation && currentConversation.id === c.id ? ' is-active' : '';
      var pinIcon = c.pinned ? '<i class="fa-solid fa-thumbtack conv-item__pin" aria-hidden="true"></i>' : '';
      return (
        '<div class="conv-item' + active + '" data-id="' + c.id + '" role="button" tabindex="0">' +
          pinIcon +
          '<span class="conv-item__title">' + esc(c.title) + '</span>' +
          '<button class="conv-item__menu-btn" data-id="' + c.id + '" aria-label="More options" type="button">' +
            '<i class="fa-solid fa-ellipsis" aria-hidden="true"></i>' +
          '</button>' +
        '</div>'
      );
    }

    function groupHTML(label, items) {
      if (!items.length) return '';
      return '<div class="conv-group"><div class="sidebar__section-label">' + label + '</div>' + items.map(convItemHTML).join('') + '</div>';
    }

    function renderSidebarSlot() {
      var slot = document.getElementById('sidebar-slot');
      if (!slot) return;
      var g = groupConversations(conversationList);
      var html = '<button class="new-chat-btn" id="new-chat" type="button"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>New chat</span></button>';
      html += groupHTML('Pinned', g.pinned);
      html += groupHTML('Today', g.today);
      html += groupHTML('Yesterday', g.yesterday);
      html += groupHTML('Previous 7 days', g.week);
      html += groupHTML('Older', g.older);
      slot.innerHTML = html;

      var newBtn = document.getElementById('new-chat');
      if (newBtn) newBtn.addEventListener('click', startNewConversation);

      slot.querySelectorAll('.conv-item').forEach(function (item) {
        var id = item.getAttribute('data-id');
        item.addEventListener('click', function (e) {
          if (e.target.closest('.conv-item__menu-btn')) return;
          var conv = conversationList.find(function (c) { return c.id === id; });
          if (conv) openConversation(conv);
        });
      });
      slot.querySelectorAll('.conv-item__menu-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var id = btn.getAttribute('data-id');
          var conv = conversationList.find(function (c) { return c.id === id; });
          if (conv) openConvMenu(btn, conv);
        });
      });
    }

    function closeConvMenu() {
      if (openMenu) { openMenu.remove(); openMenu = null; }
      document.querySelectorAll('.conv-item__menu-btn.is-open').forEach(function (b) { b.classList.remove('is-open'); });
    }
    function openConvMenu(anchorBtn, conv) {
      closeConvMenu();
      anchorBtn.classList.add('is-open');
      var menu = document.createElement('div');
      menu.className = 'conv-menu';
      menu.innerHTML =
        '<button class="conv-menu__item" data-action="rename" type="button"><i class="fa-solid fa-pen"></i>Rename</button>' +
        '<button class="conv-menu__item" data-action="pin" type="button"><i class="fa-solid fa-thumbtack"></i>' + (conv.pinned ? 'Unpin' : 'Pin') + '</button>' +
        '<button class="conv-menu__item conv-menu__item--danger" data-action="delete" type="button"><i class="fa-solid fa-trash"></i>Delete</button>';
      document.body.appendChild(menu);
      var rect = anchorBtn.getBoundingClientRect();
      menu.style.top  = (rect.bottom + 4) + 'px';
      menu.style.left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12) + 'px';
      menu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        closeConvMenu();
        if (action === 'rename') startRename(conv);
        if (action === 'pin')    togglePin(conv);
        if (action === 'delete') promptDelete(conv);
      });
      openMenu = menu;
      setTimeout(function () {
        document.addEventListener('click', onDocClick);
        document.addEventListener('keydown', onEsc);
      }, 0);
    }
    function onDocClick(e) {
      if (openMenu && !openMenu.contains(e.target)) {
        closeConvMenu();
        document.removeEventListener('click', onDocClick);
        document.removeEventListener('keydown', onEsc);
      }
    }
    function onEsc(e) {
      if (e.key === 'Escape') {
        closeConvMenu();
        document.removeEventListener('click', onDocClick);
        document.removeEventListener('keydown', onEsc);
      }
    }

    function startRename(conv) {
      var item = document.querySelector('.conv-item[data-id="' + conv.id + '"]');
      if (!item) return;
      var titleEl = item.querySelector('.conv-item__title');
      var menuBtn = item.querySelector('.conv-item__menu-btn');
      var inp = document.createElement('input');
      inp.className = 'conv-item__rename-input';
      inp.type = 'text'; inp.value = conv.title; inp.maxLength = 120;
      titleEl.replaceWith(inp);
      if (menuBtn) menuBtn.style.display = 'none';
      inp.focus(); inp.select();
      var done = false;
      function commit() {
        if (done) return; done = true;
        var v = inp.value.trim();
        if (!v || v === conv.title) { renderSidebarSlot(); return; }
        apiRename(conv.id, v).then(function (updated) {
          if (updated) {
            var i = conversationList.findIndex(function (c) { return c.id === conv.id; });
            if (i !== -1) conversationList[i] = updated;
            if (currentConversation && currentConversation.id === conv.id) currentConversation = updated;
          }
          renderSidebarSlot();
        });
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape') { done = true; renderSidebarSlot(); }
      });
      inp.addEventListener('blur', commit);
    }

    async function togglePin(conv) {
      var updated = await apiPin(conv.id, !conv.pinned);
      if (!updated) return;
      var i = conversationList.findIndex(function (c) { return c.id === conv.id; });
      if (i !== -1) conversationList[i] = updated;
      if (currentConversation && currentConversation.id === conv.id) currentConversation = updated;
      conversationList.sort(function (a, b) {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return new Date(b.updated_at) - new Date(a.updated_at);
      });
      renderSidebarSlot();
    }

    function buildImageCell(img) {
      var cell = document.createElement('div');
      cell.className = 'msg-image';
      var a = document.createElement('a');
      a.className = 'img-link';
      a.href = img.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      var i = document.createElement('img');
      i.src = img.thumb || img.url;
      i.alt = img.alt || img.prompt || 'Image';
      i.loading = 'lazy';
      i.onerror = function () {
        cell.classList.add('msg-image--broken');
        cell.innerHTML = '';
        var icon = document.createElement('i');
        icon.className = 'fa-solid fa-image';
        cell.appendChild(icon);
        var msg = document.createElement('div');
        msg.textContent = 'Image unavailable';
        msg.style.fontWeight = '600';
        msg.style.marginBottom = '6px';
        cell.appendChild(msg);
        var link = document.createElement('a');
        link.href = img.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
        link.textContent = 'Open original';
        cell.appendChild(link);
      };
      a.appendChild(i);
      cell.appendChild(a);
      var dl = document.createElement('button');
      dl.type = 'button';
      dl.className = 'msg-image__download';
      dl.title = 'Download image';
      dl.innerHTML = '<i class="fa-solid fa-download" aria-hidden="true"></i>';
      dl.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        downloadImage(img.url, img.prompt || img.alt || 'image');
      });
      cell.appendChild(dl);
      if (img.source === 'pexels' && img.author) {
        var credit = document.createElement('div');
        credit.className = 'msg-image__credit';
        credit.textContent = 'Photo by ' + img.author + ' · Pexels';
        cell.appendChild(credit);
      }
      return cell;
    }

    function buildToolCard(tool) {
      var card = document.createElement('a');
      card.className = 'tool-card';
      card.href = tool.url || '#';
      var iconMap = {
        quiz: { icon: 'fa-circle-question', mod: 'quiz' },
        flashcards: { icon: 'fa-clone', mod: 'flashcards' },
        notes: { icon: 'fa-note-sticky', mod: 'notes' },
        practice: { icon: 'fa-dumbbell', mod: 'practice' },
        visualization: { icon: 'fa-diagram-project', mod: 'vis' },
        studyplan: { icon: 'fa-calendar-days', mod: 'plan' },
        exam: { icon: 'fa-stopwatch', mod: 'exam' },
        mistakes: { icon: 'fa-clipboard-list', mod: 'mistakes' },
        sketch: { icon: 'fa-pen-ruler', mod: 'sketch' },
      };
      var meta = iconMap[tool.type] || iconMap.notes;
      var metaText = '';
      if (tool.count != null) {
        metaText = tool.count + ' item' + (tool.count === 1 ? '' : 's');
        if (tool.topic) metaText += ' · ' + tool.topic;
      } else if (tool.topic) {
        metaText = tool.topic;
      } else {
        metaText = 'Open tool';
      }
      card.innerHTML =
        '<div class="tool-card__icon tool-card__icon--' + meta.mod + '"><i class="fa-solid ' + meta.icon + '"></i></div>' +
        '<div class="tool-card__body">' +
          '<div class="tool-card__title">' + esc(tool.title) + '</div>' +
          '<div class="tool-card__meta">' + esc(metaText) + '</div>' +
        '</div>' +
        '<i class="fa-solid fa-arrow-right tool-card__arrow"></i>';
      return card;
    }

    function extractIdFromUrl(tool) {
      if (!tool || !tool.url) return null;
      var match = tool.url.match(/[?&]id=([^&]+)/);
      return match ? match[1] : null;
    }

    async function buildInteractiveQuiz(tool) {
      var quizId = extractIdFromUrl(tool);
      if (!quizId) return buildToolCard(tool);
      var container = document.createElement('div');
      container.className = 'quiz-widget';
      container.innerHTML = '<div class="widget-loading">Loading quiz…</div>';
      try {
        var res = await fetch('/api/tools/quiz/' + quizId, { credentials: 'include' });
        if (!res.ok) { container.innerHTML = '<div class="widget-error">Could not load quiz.</div>'; return container; }
        var data = await res.json();
        if (!data.quiz || !data.quiz.questions || !data.quiz.questions.length) {
          container.innerHTML = '<div class="widget-error">Quiz has no questions.</div>';
          return container;
        }
        renderQuizWidget(container, data.quiz);
      } catch (_) {
        container.innerHTML = '<div class="widget-error">Network error while loading quiz.</div>';
      }
      return container;
    }

    function renderQuizWidget(container, quiz) {
      var answers = {};
      var html =
        '<div class="quiz-widget__head">' +
          '<div class="quiz-widget__icon"><i class="fa-solid fa-circle-question"></i></div>' +
          '<div>' +
            '<div class="quiz-widget__title">' + esc(quiz.title || 'Quiz') + '</div>' +
            '<div class="quiz-widget__meta">' + quiz.questions.length + ' question' +
              (quiz.questions.length === 1 ? '' : 's') + ' · ' + esc(quiz.topic || 'general') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="quiz-widget__questions">';

      quiz.questions.forEach(function (q, idx) {
        html += '<div class="quiz-q" data-qid="' + q.id + '">' +
          '<div class="quiz-q__num">Question ' + (idx + 1) + '</div>' +
          '<div class="quiz-q__text">' + esc(q.question) + '</div>' +
          '<div class="quiz-q__opts">';
        (q.options || []).forEach(function (opt) {
          html += '<button type="button" class="quiz-opt" data-label="' + esc(opt.label) + '">' +
            '<span class="quiz-opt__label">' + esc(opt.label) + '</span>' +
            '<span class="quiz-opt__text">' + esc(opt.text) + '</span>' +
          '</button>';
        });
        html += '</div></div>';
      });
      html += '</div>' +
        '<div class="quiz-widget__actions">' +
          '<button type="button" class="quiz-submit" disabled>Answer all questions to submit</button>' +
          '<span class="quiz-widget__progress">0 / ' + quiz.questions.length + ' answered</span>' +
        '</div>';
      container.innerHTML = html;

      container.querySelectorAll('.quiz-q').forEach(function (qEl) {
        var qid = qEl.getAttribute('data-qid');
        qEl.querySelectorAll('.quiz-opt').forEach(function (optBtn) {
          optBtn.addEventListener('click', function () {
            qEl.querySelectorAll('.quiz-opt').forEach(function (o) { o.classList.remove('is-selected'); });
            optBtn.classList.add('is-selected');
            answers[qid] = optBtn.getAttribute('data-label');
            updateQuizProgress(container, answers, quiz);
          });
        });
      });

      container.querySelector('.quiz-submit').addEventListener('click', function () {
        submitQuiz(container, quiz, answers);
      });
    }

    function updateQuizProgress(container, answers, quiz) {
      var n = Object.keys(answers).length;
      var total = quiz.questions.length;
      container.querySelector('.quiz-widget__progress').textContent = n + ' / ' + total + ' answered';
      var submitBtn = container.querySelector('.quiz-submit');
      if (n >= total) { submitBtn.disabled = false; submitBtn.textContent = 'Submit answers'; }
      else { submitBtn.disabled = true; submitBtn.textContent = 'Answer all questions to submit'; }
    }

    async function submitQuiz(container, quiz, answers) {
      var submitBtn = container.querySelector('.quiz-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Scoring…';
      var answerArray = quiz.questions.map(function (q) {
        return { questionId: q.id, selected: answers[q.id] || null };
      });
      try {
        var res = await fetch('/api/tools/quiz/' + quiz.id + '/attempt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ answers: answerArray }),
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { submitBtn.textContent = 'Error. Try again.'; submitBtn.disabled = false; return; }
        showQuizResults(container, quiz, data);
      } catch (_) { submitBtn.textContent = 'Network error.'; submitBtn.disabled = false; }
    }

    function showQuizResults(container, quiz, data) {
      container.querySelectorAll('.quiz-q').forEach(function (qEl) {
        var qid = qEl.getAttribute('data-qid');
        var graded = (data.graded || []).find(function (g) { return g.questionId === qid; });
        if (!graded) return;
        qEl.classList.add(graded.isCorrect ? 'is-correct' : 'is-wrong');
        qEl.querySelectorAll('.quiz-opt').forEach(function (optBtn) {
          optBtn.disabled = true;
          var label = optBtn.getAttribute('data-label');
          if (label === graded.correct) optBtn.classList.add('is-correct-answer');
          if (label === graded.selected && !graded.isCorrect) optBtn.classList.add('is-wrong-answer');
        });
        var q = quiz.questions.find(function (x) { return x.id === qid; });
        if (q && q.explanation) {
          var ex = document.createElement('div');
          ex.className = 'quiz-explanation';
          ex.innerHTML = '<strong>Why</strong>' + esc(q.explanation);
          qEl.appendChild(ex);
        }
      });
      var actions = container.querySelector('.quiz-widget__actions');
      actions.innerHTML = '<div class="quiz-widget__score"><span class="quiz-widget__score-num">' +
        data.attempt.score + ' / ' + data.attempt.total + '</span></div>' +
        '<button type="button" class="quiz-ask-ai">Ask AI about my result</button>';
      actions.querySelector('.quiz-ask-ai').addEventListener('click', function () {
        sendQuizResultsToAI(quiz, data);
      });
    }

    function sendQuizResultsToAI(quiz, data) {
      var wrong = (data.graded || []).filter(function (g) { return !g.isCorrect; });
      var summary = 'I just submitted the quiz "' + (quiz.title || 'quiz') + '". I scored ' +
        data.attempt.score + ' / ' + data.attempt.total + '.';
      if (wrong.length === 0) {
        summary += '\n\nI got every question right. What should I study next?';
      } else {
        summary += '\n\nQuestions I missed:\n';
        wrong.forEach(function (w) {
          var q = quiz.questions.find(function (x) { return x.id === w.questionId; });
          if (q) summary += '• "' + q.question + '" — I chose ' + (w.selected || '(nothing)') + ', correct was ' + w.correct + '\n';
        });
        summary += '\nPlease help me understand what I got wrong.';
      }
      input.value = summary;
      autoGrow();
      form.requestSubmit();
    }
