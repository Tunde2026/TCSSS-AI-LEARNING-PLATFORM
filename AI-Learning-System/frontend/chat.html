    async function buildInteractiveFlashcards(tool) {
      var deckId = extractIdFromUrl(tool);
      if (!deckId) return buildToolCard(tool);
      var container = document.createElement('div');
      container.className = 'flashcard-widget';
      container.innerHTML = '<div class="widget-loading">Loading flashcards…</div>';
      try {
        var res = await fetch('/api/tools/flashcards/' + deckId, { credentials: 'include' });
        if (!res.ok) { container.innerHTML = '<div class="widget-error">Could not load flashcards.</div>'; return container; }
        var data = await res.json();
        if (!data.deck || !data.deck.cards || !data.deck.cards.length) {
          container.innerHTML = '<div class="widget-error">Deck has no cards.</div>';
          return container;
        }
        renderFlashcardWidget(container, data.deck);
      } catch (_) {
        container.innerHTML = '<div class="widget-error">Network error.</div>';
      }
      return container;
    }

    function renderFlashcardWidget(container, deck) {
      var index = 0;
      var reviewed = 0;
      var total = deck.cards.length;
      var ratings = {};

      var html =
        '<div class="flashcard-widget__head">' +
          '<div class="flashcard-widget__icon"><i class="fa-solid fa-clone"></i></div>' +
          '<div>' +
            '<div class="flashcard-widget__title">' + esc(deck.title || 'Flashcards') + '</div>' +
            '<div class="flashcard-widget__meta">' + total + ' card' + (total === 1 ? '' : 's') +
              ' · ' + esc(deck.topic || 'general') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="flashcard-widget__stage">' +
          '<div class="flashcard-widget__card" id="fc-card">' +
            '<div class="flashcard-widget__inner">' +
              '<div class="flashcard-widget__face flashcard-widget__face--front">' +
                '<span class="flashcard-widget__corner">Question</span>' +
                '<p class="flashcard-widget__text" id="fc-front">—</p>' +
                '<div class="flashcard-widget__hint">Click to flip</div>' +
              '</div>' +
              '<div class="flashcard-widget__face flashcard-widget__face--back">' +
                '<span class="flashcard-widget__corner">Answer</span>' +
                '<p class="flashcard-widget__text" id="fc-back">—</p>' +
                '<div class="flashcard-widget__hint">Click to flip back</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="flashcard-widget__rate" id="fc-rate">' +
            '<button type="button" class="flashcard-rate-btn flashcard-rate-btn--again" data-q="0">Again<small>&lt; 1 min</small></button>' +
            '<button type="button" class="flashcard-rate-btn flashcard-rate-btn--hard" data-q="1">Hard<small>~1 day</small></button>' +
            '<button type="button" class="flashcard-rate-btn flashcard-rate-btn--good" data-q="2">Good<small>days</small></button>' +
            '<button type="button" class="flashcard-rate-btn flashcard-rate-btn--easy" data-q="3">Easy<small>longer</small></button>' +
          '</div>' +
          '<div class="flashcard-widget__hint-line" id="fc-hint">Flip the card to see the answer, then rate yourself</div>' +
        '</div>' +
        '<div class="flashcard-widget__progress">' +
          '<div class="flashcard-widget__progress-bar"><div class="flashcard-widget__progress-fill" id="fc-progress-fill" style="width:0%"></div></div>' +
          '<span class="flashcard-widget__progress-label" id="fc-progress-label">0 / ' + total + '</span>' +
        '</div>';
      container.innerHTML = html;

      var card = container.querySelector('#fc-card');
      var front = container.querySelector('#fc-front');
      var back = container.querySelector('#fc-back');
      var rate = container.querySelector('#fc-rate');
      var hint = container.querySelector('#fc-hint');
      var progressFill = container.querySelector('#fc-progress-fill');
      var progressLabel = container.querySelector('#fc-progress-label');
      var flipped = false;

      function loadCard() {
        if (index >= total) { showDone(); return; }
        var c = deck.cards[index];
        front.textContent = c.front;
        back.textContent = c.back;
        card.classList.remove('is-flipped');
        rate.classList.remove('is-visible');
        hint.classList.remove('is-hidden');
        flipped = false;
        progressFill.style.width = (index / total * 100) + '%';
        progressLabel.textContent = index + ' / ' + total;
      }

      card.addEventListener('click', function () {
        flipped = !flipped;
        card.classList.toggle('is-flipped', flipped);
        if (flipped) { rate.classList.add('is-visible'); hint.classList.add('is-hidden'); }
        else { rate.classList.remove('is-visible'); hint.classList.remove('is-hidden'); }
      });

      rate.querySelectorAll('.flashcard-rate-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          if (!flipped) return;
          var q = parseInt(btn.getAttribute('data-q'), 10);
          var c = deck.cards[index];
          fetch('/api/tools/flashcards/card/' + c.id + '/review', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ quality: q }),
          }).catch(function () {});
          ratings[c.id] = q;
          reviewed++;
          index++;
          progressFill.style.width = (index / total * 100) + '%';
          progressLabel.textContent = index + ' / ' + total;
          loadCard();
        });
      });

      function showDone() {
        var stage = container.querySelector('.flashcard-widget__stage');
        stage.innerHTML =
          '<div class="flashcard-widget__done">' +
            '<div class="flashcard-widget__done-icon"><i class="fa-solid fa-check"></i></div>' +
            '<h3 class="flashcard-widget__done-title">Deck complete</h3>' +
            '<p class="flashcard-widget__done-desc">You reviewed ' + reviewed + ' card' + (reviewed === 1 ? '' : 's') + '.</p>' +
            '<div class="flashcard-widget__done-actions">' +
              '<button type="button" class="flashcard-ask-ai">Ask AI about these</button>' +
            '</div>' +
          '</div>';
        stage.querySelector('.flashcard-ask-ai').addEventListener('click', function () {
          var hard = deck.cards.filter(function (c) {
            return ratings[c.id] === 0 || ratings[c.id] === 1;
          });
          var summary;
          if (!hard.length) {
            summary = 'I just reviewed "' + (deck.title || 'a flashcard deck') + '" and found all cards easy. What should I study next?';
          } else {
            summary = 'I just reviewed the flashcard deck "' + (deck.title || '') + '". I found these cards hard:';
            hard.forEach(function (c) { summary += '\n• ' + c.front; });
            summary += '\n\nPlease explain these more clearly.';
          }
          input.value = summary;
          autoGrow();
          form.requestSubmit();
        });
      }

      loadCard();
    }

    /* ============================================================
       addMessage
       ============================================================ */

    function addMessage(role, content, options) {
      options = options || {};
      var provider  = options.provider  || null;
      var agentName = options.agentName || null;
      var webSearch = options.webSearch || null;
      var libraryUsed = !!options.libraryUsed;
      var attachments = options.attachments || null;
      var images      = options.images || null;
      var tools       = options.tools || null;

      var empty = innerEl.querySelector('.chat-empty');
      if (empty) empty.remove();

      var row = document.createElement('div');
      row.className = 'msg-row msg-row--' + (role === 'user' ? 'user' : 'ai');
      var avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = role === 'user'
        ? '<i class="fa-solid fa-user" aria-hidden="true"></i>'
        : '<i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>';

      var body = document.createElement('div');
      body.className = 'msg-body';

      var contentEl = document.createElement('div');
      contentEl.className = 'msg-content';
      if (role === 'user') {
        contentEl.textContent = content;
      } else {
        contentEl.classList.add('md-content');
        if (window.renderMarkdown) window.renderMarkdown(content, contentEl);
        else contentEl.textContent = content;
      }
      body.appendChild(contentEl);

      // Separate tools
      var imageTools = [];
      var cardTools = [];
      var quizTools = [];
      var flashcardTools = [];
      if (tools && tools.length) {
        tools.forEach(function (t) {
          if (t.type === 'image') imageTools.push(t);
          else if (t.type === 'quiz') quizTools.push(t);
          else if (t.type === 'flashcards') flashcardTools.push(t);
          else cardTools.push(t);
        });
      }
      if (images && images.length) imageTools = imageTools.concat(images);

      // Quiz widgets
      if (quizTools.length) {
        var quizWrap = document.createElement('div');
        quizWrap.className = 'msg-tools';
        body.appendChild(quizWrap);
        quizTools.forEach(function (t) {
          buildInteractiveQuiz(t).then(function (w) { quizWrap.appendChild(w); scrollToBottom(); });
        });
      }

      // Flashcard widgets
      if (flashcardTools.length) {
        var fcWrap = document.createElement('div');
        fcWrap.className = 'msg-tools';
        body.appendChild(fcWrap);
        flashcardTools.forEach(function (t) {
          buildInteractiveFlashcards(t).then(function (w) { fcWrap.appendChild(w); scrollToBottom(); });
        });
      }

      // Regular tool cards
      if (cardTools.length) {
        var toolsWrap = document.createElement('div');
        toolsWrap.className = 'msg-tools';
        cardTools.forEach(function (t) { toolsWrap.appendChild(buildToolCard(t)); });
        body.appendChild(toolsWrap);
      }

      // Images
      if (imageTools.length) {
        var imgWrap = document.createElement('div');
        imgWrap.className = 'msg-images';
        imageTools.forEach(function (img) { imgWrap.appendChild(buildImageCell(img)); });
        body.appendChild(imgWrap);
      }

      // Meta
      var meta = document.createElement('div');
      meta.className = 'msg-meta';
      if (attachments && attachments.length) {
        attachments.forEach(function (a) {
          var tag = document.createElement('span');
          tag.className = 'meta-badge meta-badge--attachment';
          tag.innerHTML = '<i class="fa-solid fa-paperclip" aria-hidden="true"></i> ' + esc(a.name);
          meta.appendChild(tag);
        });
      }
      if (agentName) { var aTag = document.createElement('span'); aTag.textContent = 'as @' + agentName; meta.appendChild(aTag); }
      if (provider)  { var pTag = document.createElement('span'); pTag.textContent = 'via ' + provider; meta.appendChild(pTag); }
      if (libraryUsed) {
        var lBadge = document.createElement('span');
        lBadge.className = 'meta-badge meta-badge--library';
        lBadge.innerHTML = '<i class="fa-solid fa-book-open" aria-hidden="true"></i> used library';
        meta.appendChild(lBadge);
      }

      var panel = null;
      if (webSearch && webSearch.sources && webSearch.sources.length) {
        var sBadge = document.createElement('span');
        sBadge.className = 'meta-badge meta-badge--search';
        sBadge.innerHTML = '<i class="fa-solid fa-globe" aria-hidden="true"></i> searched the web';
        meta.appendChild(sBadge);
        var toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'sources-toggle';
        toggleBtn.innerHTML = webSearch.sources.length + ' source' + (webSearch.sources.length === 1 ? '' : 's') + ' <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>';
        meta.appendChild(toggleBtn);
        panel = document.createElement('div');
        panel.className = 'sources-panel';
        var label = document.createElement('div');
        label.className = 'sources-panel__label';
        label.textContent = 'Sources used';
        panel.appendChild(label);
        webSearch.sources.forEach(function (src, i) {
          var item = document.createElement('div');
          item.className = 'source-item';
          var num = document.createElement('div');
          num.className = 'source-item__num';
          num.textContent = String(i + 1);
          var sBody = document.createElement('div');
          sBody.className = 'source-item__body';
          var t = document.createElement('div');
          t.className = 'source-item__title';
          var a = document.createElement('a');
          a.href = src.url || '#'; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = src.title || '(untitled)';
          t.appendChild(a);
          var u = document.createElement('p');
          u.className = 'source-item__url';
          u.textContent = src.url || '';
          sBody.appendChild(t); sBody.appendChild(u);
          item.appendChild(num); item.appendChild(sBody);
          panel.appendChild(item);
        });
        toggleBtn.addEventListener('click', function () {
          panel.classList.toggle('is-visible');
          toggleBtn.classList.toggle('is-open');
        });
      }
      if (meta.children.length) body.appendChild(meta);
      if (panel) body.appendChild(panel);

      row.appendChild(avatar);
      row.appendChild(body);
      innerEl.appendChild(row);
      scrollToBottom();
      return contentEl;
    }

    function addTyping() {
      var row = document.createElement('div');
      row.className = 'msg-row msg-row--ai';
      row.id = 'typing-row';
      row.innerHTML = '<div class="msg-avatar"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>' +
        '<div class="msg-body"><div class="msg-content"><span class="typing"><span></span><span></span><span></span></span></div></div>';
      innerEl.appendChild(row);
      scrollToBottom();
    }
    function removeTyping() {
      var el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    function scrollToBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }
    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }

    function buildMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) return pop;
      pop = document.createElement('div');
      pop.id = 'mention-popup';
      document.body.appendChild(pop);
      return pop;
    }
    function positionMentionPopup(pop, textarea) {
      var rect = textarea.getBoundingClientRect();
      pop.style.left = rect.left + 'px';
      pop.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      pop.style.top = 'auto';
    }
    function detectMention() {
      var value = input.value;
      var caret = input.selectionStart;
      var upToCaret = value.slice(0, caret);
      var match = upToCaret.match(/@([A-Za-z][A-Za-z0-9_]*)?$/);
      if (!match) return null;
      var query = (match[1] || '').toLowerCase();
      var start = caret - match[0].length;
      var matches = agents.filter(function (a) { return !query || a.name.toLowerCase().indexOf(query) === 0; });
      if (!matches.length) return null;
      return { start: start, query: query, matches: matches, index: 0 };
    }
    function showMentionPopup(state) {
      var pop = buildMentionPopup();
      positionMentionPopup(pop, input);
      pop.innerHTML = state.matches.map(function (a, i) {
        var active = i === state.index ? 'background:var(--blush);' : '';
        var initial = (a.name || '?').charAt(0).toUpperCase();
        return '<div class="mention-item" data-index="' + i + '" style="' + active + '">' +
          '<div class="mention-item__avatar">' + esc(initial) + '</div>' +
          '<div style="min-width:0">' +
            '<div style="font-weight:600;color:var(--navy)">@' + esc(a.name) + '</div>' +
            '<div style="font-size:0.75rem;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
              esc(a.description || a.subject || 'Custom AI') + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      pop.style.display = 'block';
      pop.querySelectorAll('.mention-item').forEach(function (el) {
        el.addEventListener('mousedown', function (e) { e.preventDefault(); selectMention(parseInt(el.getAttribute('data-index'), 10)); });
      });
    }
    function hideMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) pop.style.display = 'none';
      mentionState = null;
    }
    function selectMention(idx) {
      if (!mentionState) return;
      var agent = mentionState.matches[idx];
      if (!agent) return;
      var value = input.value;
      var before = value.slice(0, mentionState.start);
      var after = value.slice(input.selectionStart);
      var insert = '@' + agent.name + ' ';
      input.value = before + insert + after;
      var newCaret = before.length + insert.length;
      input.setSelectionRange(newCaret, newCaret);
      hideMentionPopup();
      autoGrow(); input.focus();
    }

    function renderAttachStrip() {
      if (!stagedAttachments.length) {
        attachStrip.classList.remove('is-visible');
        attachStrip.innerHTML = '';
        return;
      }
      attachStrip.classList.add('is-visible');
      attachStrip.innerHTML = stagedAttachments.map(function (a) {
        var statusCls = 'attach-chip__status';
        if (a.status === 'ready') statusCls += ' attach-chip__status--ready';
        if (a.status === 'failed') statusCls += ' attach-chip__status--failed';
        var statusLabel = a.status === 'ready' ? 'ready' : a.status === 'failed' ? 'failed' : 'reading…';
        return '<div class="attach-chip" data-id="' + a.id + '">' +
          '<div class="attach-chip__icon"><i class="fa-solid fa-file-lines"></i></div>' +
          '<span class="attach-chip__name">' + esc(a.name) + '</span>' +
          '<span class="' + statusCls + '">' + statusLabel + '</span>' +
          '<button class="attach-chip__remove" data-id="' + a.id + '" type="button" title="Remove">' +
            '<i class="fa-solid fa-xmark"></i>' +
          '</button>' +
        '</div>';
      }).join('');
      attachStrip.querySelectorAll('.attach-chip__remove').forEach(function (btn) {
        btn.addEventListener('click', function () { removeAttachment(btn.getAttribute('data-id')); });
      });
    }

    async function uploadFile(file) {
      var form = new FormData();
      form.append('file', file);
      try {
        var res = await fetch('/api/chat/attachments', { method: 'POST', credentials: 'include', body: form });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { alert(data.error || 'Upload failed.'); return null; }
        return data.attachment;
      } catch (_) { alert('Cannot reach the server.'); return null; }
    }

    async function addFiles(files) {
      for (var i = 0; i < files.length; i++) {
        var att = await uploadFile(files[i]);
        if (!att) continue;
        stagedAttachments.push({ id: att.id, name: att.original_name, status: att.extraction_status || 'pending' });
        renderAttachStrip();
        pollAttachment(att.id);
      }
    }

    async function pollAttachment(id) {
      for (var i = 0; i < 30; i++) {
        await new Promise(function (r) { setTimeout(r, 2000); });
        try {
          var res = await fetch('/api/chat/attachments/' + id, { credentials: 'include' });
          if (!res.ok) return;
          var data = await res.json();
          var staged = stagedAttachments.find(function (a) { return a.id === id; });
          if (!staged) return;
          staged.status = data.extraction_status;
          renderAttachStrip();
          if (data.extraction_status === 'ready' || data.extraction_status === 'failed') return;
        } catch (_) { return; }
      }
    }

    async function removeAttachment(id) {
      try { await fetch('/api/chat/attachments/' + id, { method: 'DELETE', credentials: 'include' }); } catch (_) {}
      stagedAttachments = stagedAttachments.filter(function (a) { return a.id !== id; });
      renderAttachStrip();
    }

    attachBtn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function (e) {
      if (e.target.files && e.target.files.length) addFiles(Array.from(e.target.files));
      fileInput.value = '';
    });

    var dragCounter = 0;
    document.addEventListener('dragenter', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.types) return;
      if (e.dataTransfer.types.indexOf('Files') === -1) return;
      e.preventDefault();
      dragCounter++;
      if (dragCounter === 1) dragOverlay.classList.add('is-visible');
    });
    document.addEventListener('dragover', function (e) {
      if (e.dataTransfer && e.dataTransfer.types.indexOf('Files') !== -1) e.preventDefault();
    });
    document.addEventListener('dragleave', function () {
      dragCounter--;
      if (dragCounter <= 0) { dragCounter = 0; dragOverlay.classList.remove('is-visible'); }
    });
    document.addEventListener('drop', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      dragCounter = 0;
      dragOverlay.classList.remove('is-visible');
      addFiles(Array.from(e.dataTransfer.files));
    });

    function setMicState(state) {
      if (state === 'recording') {
        micBtn.classList.add('is-recording');
        micIcon.className = 'fa-solid fa-stop';
        micBtn.title = 'Stop recording';
        micBtn.disabled = false;
        recBanner.classList.add('is-visible');
      } else if (state === 'transcribing') {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-spinner fa-spin';
        micBtn.title = 'Transcribing…';
        micBtn.disabled = true;
        recBanner.classList.remove('is-visible');
      } else {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-microphone';
        micBtn.title = 'Voice input';
        micBtn.disabled = false;
        recBanner.classList.remove('is-visible');
      }
    }
    function pickMimeType() {
      var opts = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
      if (!window.MediaRecorder) return null;
      for (var i = 0; i < opts.length; i++) if (MediaRecorder.isTypeSupported(opts[i])) return opts[i];
      return '';
    }
    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Your browser does not support microphone access.'); return; }
      try { mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (err) { alert('Could not access the microphone: ' + err.message); return; }
      var mimeType = pickMimeType();
      try {
        mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType: mimeType }) : new MediaRecorder(mediaStream);
      } catch (err) { stopStream(); alert('Could not start recording.'); return; }
      audioChunks = [];
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) audioChunks.push(e.data); };
      mediaRecorder.onstop = onRecordingStop;
      mediaRecorder.start();
      recordingStart = Date.now();
      updateRecordingTime();
      recordingTimer = setInterval(updateRecordingTime, 1000);
      setMicState('recording');
    }
    function updateRecordingTime() {
      var s = Math.floor((Date.now() - recordingStart) / 1000);
      var m = Math.floor(s / 60);
      var sec = s - m * 60;
      recTime.textContent = m + ':' + (sec < 10 ? '0' : '') + sec;
      if (s >= 120) stopRecording();
    }
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    }
    function stopStream() {
      if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; }
    }
    async function onRecordingStop() {
      stopStream();
      if (Date.now() - recordingStart < 500) { setMicState('idle'); return; }
      var mimeType = mediaRecorder.mimeType || 'audio/webm';
      var blob = new Blob(audioChunks, { type: mimeType });
      audioChunks = [];
      if (blob.size < 1000) { setMicState('idle'); alert('Recording was too short.'); return; }
      await sendAudio(blob);
    }
    async function sendAudio(blob) {
      setMicState('transcribing');
      var form = new FormData();
      form.append('audio', blob, 'recording.webm');
      try {
        var res = await fetch('/api/voice/transcribe', { method: 'POST', credentials: 'include', body: form });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { alert(data.error || 'Could not transcribe.'); setMicState('idle'); return; }
        var existing = input.value;
        var spacer = existing && !/\s$/.test(existing) ? ' ' : '';
        input.value = existing + spacer + data.text;
        autoGrow(); input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      } catch (_) { alert('Could not reach the server.'); }
      finally { setMicState('idle'); }
    }

    function clearChat() { innerEl.innerHTML = ''; history = []; }

    function startNewConversation() {
      currentConversation = null;
      clearChat();
      renderEmpty();
      renderSidebarSlot();
      input.focus();
    }

    async function openConversation(conv) {
      currentConversation = conv;
      clearChat();
      var data = await apiLoad(conv.id);
      if (!data) { startNewConversation(); return; }
      if (!data.messages || !data.messages.length) {
        renderEmpty();
      } else {
        for (var i = 0; i < data.messages.length; i++) {
          var m = data.messages[i];
          var media = m.media || null;
          addMessage(m.role, m.content, {
            provider: m.provider,
            images: (media && media.images) ? media.images : null,
            tools: (media && media.tools) ? media.tools : null,
            webSearch: (media && media.webSearch) ? media.webSearch : null,
          });
          history.push({ role: m.role, content: m.content });
        }
      }
      renderSidebarSlot();
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text && !stagedAttachments.length) return;

      var attachedNow = stagedAttachments.slice();
      addMessage('user', text || '(attached file)', {
        attachments: attachedNow.map(function (a) { return { name: a.name }; }),
      });
      history.push({ role: 'user', content: text || '(see attached file)' });

      var attachmentIds = stagedAttachments.map(function (a) { return a.id; });
      stagedAttachments = [];
      renderAttachStrip();

      input.value = '';
      autoGrow();
      sendBtn.disabled = true;
      input.disabled = true;
      addTyping();

      try {
        var res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            messages: history,
            conversationId: currentConversation ? currentConversation.id : null,
            attachmentIds: attachmentIds,
          }),
        });
        var data = await res.json().catch(function () { return {}; });
        removeTyping();
        if (!res.ok) { addMessage('ai', data.error || 'Something went wrong.'); return; }
        addMessage('ai', data.reply, {
          provider: data.provider,
          agentName: data.agent ? data.agent.name : null,
          webSearch: data.webSearch || null,
          libraryUsed: !!data.libraryUsed,
          images: data.images || null,
          tools: data.tools || null,
        });
        history.push({ role: 'assistant', content: data.reply });

        if (!currentConversation && data.conversationId) {
          conversationList = await apiList();
          var created = conversationList.find(function (c) { return c.id === data.conversationId; });
          if (created) currentConversation = created;
          renderSidebarSlot();
        } else if (currentConversation) {
          conversationList = await apiList();
          var still = conversationList.find(function (c) { return c.id === currentConversation.id; });
          if (still) currentConversation = still;
          renderSidebarSlot();
        }
      } catch (err) {
        removeTyping();
        addMessage('ai', 'Cannot reach the server.');
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('input', function () {
      autoGrow();
      var state = detectMention();
      if (state) { mentionState = state; showMentionPopup(state); }
      else { hideMentionPopup(); }
    });

    input.addEventListener('keydown', function (e) {
      if (mentionState && mentionState.matches.length > 0) {
        if (e.key === 'ArrowDown') { e.preventDefault(); mentionState.index = (mentionState.index + 1) % mentionState.matches.length; showMentionPopup(mentionState); return; }
        if (e.key === 'ArrowUp')   { e.preventDefault(); mentionState.index = (mentionState.index - 1 + mentionState.matches.length) % mentionState.matches.length; showMentionPopup(mentionState); return; }
        if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); selectMention(mentionState.index); return; }
        if (e.key === 'Escape') { hideMentionPopup(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    input.addEventListener('blur', function () { setTimeout(hideMentionPopup, 150); });

    micBtn.addEventListener('click', function () {
      if (micBtn.disabled) return;
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
      else startRecording();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeDeleteModal);
    document.getElementById('modal-delete').addEventListener('click', function (e) {
      if (e.target.id === 'modal-delete') closeDeleteModal();
    });
    document.getElementById('modal-confirm').addEventListener('click', async function () {
      if (!pendingDeleteId) return;
      var id = pendingDeleteId;
      closeDeleteModal();
      var ok = await apiDelete(id);
      if (!ok) return;
      conversationList = conversationList.filter(function (c) { return c.id !== id; });
      if (currentConversation && currentConversation.id === id) {
        if (conversationList.length > 0) await openConversation(conversationList[0]);
        else startNewConversation();
      } else renderSidebarSlot();
    });

    (async function init() {
      var ok = await ensureLoggedIn();
      if (!ok) return;
      await loadAgents();
      conversationList = await apiList();
      renderSidebarSlot();
      if (conversationList.length > 0) {
        await openConversation(conversationList[0]);
      } else {
        startNewConversation();
      }
    })();
  })();
</script>
</body>
</html>
