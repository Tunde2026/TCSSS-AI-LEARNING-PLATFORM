<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — TCSSS AI Learning</title>
<link rel="stylesheet" href="assets/shell.css">
<style>
  /* --- Existing chat styles (kept intact) --- */
  .chat-wrap {
    display: flex; flex-direction: column; height: 100vh;
    background: var(--blush);
  }
  .chat-scroll {
    flex: 1; overflow-y: auto; padding: 24px 0;
  }
  .chat-inner {
    max-width: 780px; margin: 0 auto; padding: 0 20px;
  }
  .chat-empty {
    text-align: center; padding: 60px 20px 40px;
  }
  .chat-empty__icon {
    font-size: 3rem; color: var(--gold); margin-bottom: 16px;
  }
  .chat-empty__title {
    font-family: var(--font-head); font-size: 1.6rem;
    color: var(--navy); margin-bottom: 8px;
  }
  .chat-empty__sub {
    color: var(--slate); font-size: 0.95rem; margin-bottom: 32px;
    max-width: 480px; margin-left: auto; margin-right: auto;
  }
  .chat-empty__grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; max-width: 700px; margin: 0 auto;
  }
  .suggestion-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: left;
    cursor: pointer; transition: all 0.2s;
    font-family: var(--font-body);
  }
  .suggestion-card:hover {
    border-color: var(--gold); transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(17,16,74,0.08);
  }
  .suggestion-card__title {
    font-weight: 600; color: var(--navy); font-size: 0.9rem;
    margin-bottom: 4px;
  }
  .suggestion-card__title i {
    color: var(--red); margin-right: 6px;
  }
  .suggestion-card__desc {
    font-size: 0.8rem; color: var(--slate); line-height: 1.4;
  }

  .msg-row {
    display: flex; gap: 14px; margin-bottom: 24px;
  }
  .msg-row--user {
    flex-direction: row-reverse;
  }
  .msg-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; flex-shrink: 0;
    font-size: 0.9rem;
  }
  .msg-row--user .msg-avatar {
    background: var(--navy); color: var(--white);
  }
  .msg-row--ai .msg-avatar {
    background: var(--gold); color: var(--white);
  }
  .msg-body {
    max-width: 75%; min-width: 0;
  }
  .msg-row--user .msg-body {
    display: flex; flex-direction: column; align-items: flex-end;
  }
  .msg-content {
    padding: 12px 16px; border-radius: 16px;
    font-size: 0.92rem; line-height: 1.6;
    word-wrap: break-word;
  }
  .msg-row--user .msg-content {
    background: var(--navy); color: var(--white);
    border-bottom-right-radius: 4px;
  }
  .msg-row--ai .msg-content {
    background: var(--white); color: var(--ink);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-images {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  .msg-image {
    position: relative; border-radius: 10px; overflow: hidden;
    background: var(--blush); aspect-ratio: 1;
  }
  .msg-image .img-link {
    display: block; width: 100%; height: 100%;
  }
  .msg-image img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.3s;
  }
  .msg-image:hover img { transform: scale(1.05); }
  .msg-image__download {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(17,16,74,0.7); color: var(--white);
    border: none; cursor: pointer;
    display: grid; place-items: center;
    opacity: 0; transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .msg-image:hover .msg-image__download { opacity: 1; }
  .msg-image__download:hover { background: var(--red); }
  .msg-image__credit {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    color: white; font-size: 0.7rem; padding: 16px 8px 6px;
  }
  .msg-image--broken {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; color: var(--slate); font-size: 0.8rem;
  }
  .msg-image--broken i { font-size: 2rem; margin-bottom: 8px; }
  .msg-image--broken a { color: var(--red); }

  .msg-meta {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 6px; font-size: 0.75rem; color: var(--slate);
  }
  .meta-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--blush); font-size: 0.72rem;
  }
  .meta-badge--library { background: #EAF7EE; color: #2F8F4A; }
  .meta-badge--search { background: #E3F2FD; color: #1565C0; }
  .meta-badge--attachment { background: #FFF3E0; color: #E65100; }
  .sources-toggle {
    background: none; border: none; cursor: pointer;
    color: var(--red); font-size: 0.75rem; padding: 0;
    font-family: var(--font-body);
  }
  .sources-toggle:hover { text-decoration: underline; }
  .sources-panel {
    display: none; margin-top: 10px; padding: 12px;
    background: var(--blush); border-radius: 10px;
    border: 1px solid var(--border);
  }
  .sources-panel.is-visible { display: block; }
  .sources-panel__label {
    font-weight: 600; color: var(--navy); font-size: 0.8rem;
    margin-bottom: 8px;
  }
  .source-item {
    display: flex; gap: 10px; margin-bottom: 10px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border-soft);
  }
  .source-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .source-item__num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--navy); color: var(--white);
    display: grid; place-items: center;
    font-size: 0.7rem; font-weight: 600; flex-shrink: 0;
  }
  .source-item__body { min-width: 0; }
  .source-item__title {
    font-weight: 600; font-size: 0.85rem; margin-bottom: 2px;
  }
  .source-item__title a { color: var(--navy); text-decoration: none; }
  .source-item__title a:hover { text-decoration: underline; }
  .source-item__url {
    font-size: 0.72rem; color: var(--slate);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin: 0;
  }

  .typing {
    display: inline-flex; gap: 4px; padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--slate);
    animation: typing-bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .composer-wrap {
    border-top: 1px solid var(--border);
    background: var(--white);
    padding: 16px 20px;
  }
  .composer-inner {
    max-width: 780px; margin: 0 auto;
  }
  .attach-strip {
    display: none; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  .attach-strip.is-visible { display: flex; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--blush); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px 4px 8px;
    font-size: 0.8rem;
  }
  .attach-chip__icon { color: var(--slate); }
  .attach-chip__name { font-weight: 500; }
  .attach-chip__status {
    font-family: var(--font-ui); font-size: 0.68rem;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 1px 6px; border-radius: 4px;
  }
  .attach-chip__status--ready { background: #EAF7EE; color: #2F8F4A; }
  .attach-chip__status--failed { background: #FDECEC; color: var(--deep-red); }
  .attach-chip__remove {
    background: none; border: none; cursor: pointer;
    color: var(--slate); padding: 0 2px;
  }
  .attach-chip__remove:hover { color: var(--red); }

  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--blush); border: 1px solid var(--border);
    border-radius: 16px; padding: 8px 12px;
    transition: border-color 0.2s;
  }
  .composer:focus-within { border-color: var(--gold); }
  .composer textarea {
    flex: 1; border: none; background: transparent;
    font-family: var(--font-body); font-size: 0.95rem;
    resize: none; outline: none; line-height: 1.5;
    max-height: 200px; min-height: 24px;
    color: var(--ink);
  }
  .composer-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: none; cursor: pointer;
    display: grid; place-items: center;
    background: transparent; color: var(--slate);
    transition: all 0.2s; flex-shrink: 0;
  }
  .composer-btn:hover { background: var(--white); color: var(--navy); }
  .composer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .composer-btn--send {
    background: var(--navy); color: var(--white);
  }
  .composer-btn--send:hover { background: var(--red); }
  .composer-btn--recording {
    background: var(--red); color: var(--white);
    animation: pulse-rec 1.5s infinite;
  }
  @keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,17,30,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(230,17,30,0); }
  }

  .recording-banner {
    display: none; align-items: center; gap: 10px;
    margin-top: 10px; padding: 10px 14px;
    background: #FDECEC; border-radius: 10px;
    font-size: 0.85rem; color: var(--deep-red);
  }
  .recording-banner.is-visible { display: flex; }
  .recording-banner i { animation: pulse-rec 1.5s infinite; }

  .drag-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(17,16,74,0.8); z-index: 100;
    align-items: center; justify-content: center;
    color: var(--white); font-size: 1.4rem;
    font-family: var(--font-head);
  }
  .drag-overlay.is-visible { display: flex; }
  .drag-overlay i { font-size: 3rem; margin-bottom: 16px; display: block; }

  /* --- Conv list --- */
  .conv-group { margin-bottom: 16px; }
  .conv-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 8px;
    cursor: pointer; font-size: 0.85rem;
    color: var(--ink); transition: background 0.15s;
    position: relative;
  }
  .conv-item:hover { background: var(--blush); }
  .conv-item.is-active { background: var(--blush); font-weight: 600; }
  .conv-item__title {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conv-item__pin {
    color: var(--gold); font-size: 0.7rem;
  }
  .conv-item__menu-btn {
    opacity: 0; background: none; border: none;
    cursor: pointer; color: var(--slate); padding: 2px 4px;
    transition: opacity 0.15s;
  }
  .conv-item:hover .conv-item__menu-btn,
  .conv-item__menu-btn.is-open { opacity: 1; }
  .conv-item__rename-input {
    flex: 1; border: 1px solid var(--gold); border-radius: 4px;
    padding: 2px 6px; font-size: 0.85rem; outline: none;
    font-family: var(--font-body);
  }
  .conv-menu {
    position: fixed; z-index: 150;
    background: var(--white); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-lg);
    padding: 4px; min-width: 140px;
  }
  .conv-menu__item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 8px 12px; border: none;
    background: none; cursor: pointer; font-size: 0.85rem;
    border-radius: 6px; color: var(--ink); text-align: left;
    font-family: var(--font-body);
  }
  .conv-menu__item:hover { background: var(--blush); }
  .conv-menu__item--danger { color: var(--deep-red); }
  .conv-menu__item--danger:hover { background: #FDECEC; }

  .new-chat-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 10px 12px; border-radius: 8px;
    background: var(--blush); border: 1px solid var(--border);
    cursor: pointer; font-size: 0.85rem; font-weight: 500;
    color: var(--navy); margin-bottom: 16px;
    font-family: var(--font-body);
    transition: all 0.15s;
  }
  .new-chat-btn:hover { border-color: var(--gold); }

  /* --- Mention popup --- */
  #mention-popup {
    display: none; position: fixed; z-index: 200;
    background: var(--white); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-lg);
    max-height: 240px; overflow-y: auto;
    min-width: 240px;
  }
  .mention-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; cursor: pointer;
  }
  .mention-item:hover { background: var(--blush); }
  .mention-item__avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--gold); color: var(--white);
    display: grid; place-items: center;
    font-weight: 600; font-size: 0.8rem; flex-shrink: 0;
  }

  /* --- Modals --- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(17,16,74,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 300; padding: 20px;
  }
  .modal-overlay.is-open { display: flex; }
  .modal {
    background: var(--white); border-radius: 14px;
    padding: 24px; max-width: 400px; width: 100%;
    box-shadow: var(--shadow-lg);
  }
  .modal__title {
    font-family: var(--font-head); font-size: 1.1rem;
    color: var(--navy); margin: 0 0 8px;
  }
  .modal__body { color: var(--slate); font-size: 0.9rem; margin-bottom: 20px; }
  .modal__actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* --- NEW: AI Tool Cards (Quiz/Flashcards) --- */
  .msg-tools {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tool-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--blush);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .tool-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(17,16,74,0.08);
  }
  .tool-card__icon {
    width: 42px; height: 42px;
    background: var(--white);
    border-radius: 10px;
    display: grid; place-items: center;
    color: var(--red);
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .tool-card__body { flex: 1; min-width: 0; }
  .tool-card__title {
    font-weight: 600; color: var(--navy); font-size: 0.95rem;
    margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool-card__sub {
    font-size: 0.78rem; color: var(--slate);
    text-transform: capitalize;
  }
  .tool-card__action {
    padding: 8px 16px;
    background: var(--navy);
    color: var(--white);
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 500;
    text-decoration: none;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .tool-card__action:hover { background: var(--red); }

  @media (max-width: 700px) {
    .chat-empty__grid { grid-template-columns: 1fr; }
    .msg-body { max-width: 85%; }
    .msg-images { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div class="app">
    <div id="sidebar-mount"></div>
    <main class="page" style="padding:0">
      <div class="chat-wrap">
        <div class="chat-scroll" id="scroll">
          <div class="chat-inner" id="inner"></div>
        </div>
        <div class="composer-wrap">
          <div class="composer-inner">
            <div class="attach-strip" id="attach-strip"></div>
            <form class="composer" id="composer">
              <button type="button" class="composer-btn" id="attach-btn" title="Attach file">
                <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
              </button>
              <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md,.epub" style="display:none">
              <textarea id="input" rows="1" placeholder="Ask anything about your studies…"></textarea>
              <button type="button" class="composer-btn" id="mic" title="Voice input">
                <i class="fa-solid fa-microphone" id="mic-icon" aria-hidden="true"></i>
              </button>
              <button type="submit" class="composer-btn composer-btn--send" id="send" title="Send">
                <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
              </button>
            </form>
            <div class="recording-banner" id="recording-banner">
              <i class="fa-solid fa-circle" aria-hidden="true"></i>
              <span>Recording… <span id="recording-time">0:00</span></span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="drag-overlay" id="drag-overlay">
    <div style="text-align:center">
      <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
      <div>Drop files to attach</div>
    </div>
  </div>

  <!-- Delete modal -->
  <div class="modal-overlay" id="modal-delete">
    <div class="modal">
      <h3 class="modal__title">Delete conversation?</h3>
      <div class="modal__body" id="modal-delete-body"></div>
      <div class="modal__actions">
        <button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm" type="button">Delete</button>
      </div>
    </div>
  </div>

<script src="assets/shell.js"></script>
<script>
  (function () {
    'use strict';

    var scrollEl  = document.getElementById('scroll');
    var innerEl   = document.getElementById('inner');
    var form      = document.getElementById('composer');
    var input     = document.getElementById('input');
    var sendBtn   = document.getElementById('send');
    var micBtn    = document.getElementById('mic');
    var micIcon   = document.getElementById('mic-icon');
    var attachBtn = document.getElementById('attach-btn');
    var fileInput = document.getElementById('file-input');
    var attachStrip = document.getElementById('attach-strip');
    var recBanner = document.getElementById('recording-banner');
    var recTime   = document.getElementById('recording-time');
    var dragOverlay = document.getElementById('drag-overlay');

    var currentUser         = null;
    var currentConversation = null;
    var conversationList    = [];
    var agents              = [];
    var history             = [];
    var openMenu            = null;
    var pendingDeleteId     = null;
    var mentionState        = null;
    var stagedAttachments   = [];

    var mediaRecorder = null;
    var mediaStream   = null;
    var audioChunks   = [];
    var recordingStart = 0;
    var recordingTimer = null;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function downloadImage(url, baseName) {
      var name = (baseName || 'image').replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 50);
      var ext = url.split('.').pop().split('?')[0] || 'png';
      if (ext.length > 5 || !/^[a-z]+$/i.test(ext)) ext = 'png';
      var filename = name + '.' + ext;

      fetch(url, { credentials: 'same-origin' })
        .then(function (r) {
          if (!r.ok) throw new Error('fetch failed');
          return r.blob();
        })
        .then(function (blob) {
          var objectUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = objectUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 1000);
        })
        .catch(function () {
          window.open(url, '_blank', 'noopener');
        });
    }

    async function ensureLoggedIn() {
      var res = await fetch('/api/auth/me', { credentials: 'include' });
      if (res.status === 401) { window.location.href = 'index.html'; return false; }
      var data = await res.json();
      currentUser = data.user;
      return true;
    }

    async function loadAgents() {
      try {
        var res = await fetch('/api/agents', { credentials: 'include' });
        if (!res.ok) return;
        var data = await res.json();
        agents = data.agents || [];
      } catch (_) {}
    }

    async function apiList() {
      var res = await fetch('/api/conversations', { credentials: 'include' });
      if (!res.ok) return [];
      var d = await res.json();
      return d.conversations || [];
    }
    async function apiLoad(id) {
      var res = await fetch('/api/conversations/' + id, { credentials: 'include' });
      if (!res.ok) return null;
      return res.json();
    }
    async function apiRename(id, title) {
      var res = await fetch('/api/conversations/' + id + '/rename', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', body: JSON.stringify({ title: title }),
      });
      return res.ok ? (await res.json()).conversation : null;
    }
    async function apiPin(id, pinned) {
      var res = await fetch('/api/conversations/' + id + '/pin', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', body: JSON.stringify({ pinned: pinned }),
      });
      return res.ok ? (await res.json()).conversation : null;
    }
    async function apiDelete(id) {
      var res = await fetch('/api/conversations/' + id, {
        method: 'DELETE', credentials: 'include',
      });
      return res.ok;
    }

    function groupConversations(list) {
      var now = new Date();
      var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var t1 = t0 - 86400000;
      var t7 = t0 - 7 * 86400000;
      var g = { pinned: [], today: [], yesterday: [], week: [], older: [] };
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (c.pinned) { g.pinned.push(c); continue; }
        var t = new Date(c.updated_at).getTime();
        if (t >= t0)      g.today.push(c);
        else if (t >= t1) g.yesterday.push(c);
        else if (t >= t7) g.week.push(c);
        else              g.older.push(c);
      }
      return g;
    }

    function closeConvMenu() {

    function openConvMenu(anchorBtn, conv) {
      closeConvMenu();
      anchorBtn.classList.add('is-open');
      var menu = document.createElement('div');
      menu.className = 'conv-menu';
      menu.innerHTML =
        '<button class="conv-menu__item" data-action="rename" type="button"><i class="fa-solid fa-pen"></i>Rename</button>' +
        '<button class="conv-menu__item" data-action="pin" type="button"><i class="fa-solid fa-thumbtack"></i>' + (conv.pinned ? 'Unpin' : 'Pin') + '</button>' +
        '<button class="conv-menu__item conv-menu__item--danger" data-action="delete" type="button"><i class="fa-solid fa-trash"></i>Delete</button>';
      document.body.appendChild(menu);
      var rect = anchorBtn.getBoundingClientRect();
      menu.style.top  = (rect.bottom + 4) + 'px';
      menu.style.left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12) + 'px';
      menu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        closeConvMenu();
        if (action === 'rename') startRename(conv);
        if (action === 'pin')    togglePin(conv);
        if (action === 'delete') promptDelete(conv);
      });
      openMenu = menu;
      setTimeout(function () {
        document.addEventListener('click', onDocClick);
        document.addEventListener('keydown', onEsc);
      }, 0);
    }
    function onDocClick(e) {
      if (openMenu && !openMenu.contains(e.target)) {
        closeConvMenu();
        document.removeEventListener('click', onDocClick);
        document.removeEventListener('keydown', onEsc);
      }
    }
    function onEsc(e) {
      if (e.key === 'Escape') {
        closeConvMenu();

    function startRename(conv) {
      var item = document.querySelector('.conv-item[data-id="' + conv.id + '"]');
      if (!item) return;
      var titleEl = item.querySelector('.conv-item__title');
      var menuBtn = item.querySelector('.conv-item__menu-btn');
      var inp = document.createElement('input');
      inp.className = 'conv-item__rename-input';
      inp.type = 'text'; inp.value = conv.title; inp.maxLength = 120;
      titleEl.replaceWith(inp);
      if (menuBtn) menuBtn.style.display = 'none';
      inp.focus(); inp.select();
      var done = false;
      function commit() {
        if (done) return; done = true;
        var v = inp.value.trim();
        if (!v || v === conv.title) { renderSidebarSlot(); return; }
        apiRename(conv.id, v).then(function (updated) {
          if (updated) {
            var i = conversationList.findIndex(function (c) { return c.id === conv.id; });
            if (i !== -1) conversationList[i] = updated;
            if (currentConversation && currentConversation.id === conv.id) currentConversation = updated;
          }
          renderSidebarSlot();
        });
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape') { done = true; renderSidebarSlot(); }
      });
      inp.addEventListener('blur', commit);
    }

    async function togglePin(conv) {
      var updated = await apiPin(conv.id, !conv.pinned);
      if (!updated) return;
      var i = conversationList.findIndex(function (c) { return c.id === conv.id; });
      if (i !== -1) conversationList[i] = updated;
      if (currentConversation && currentConversation.id === conv.id) currentConversation = updated;
      conversationList.sort(function (a, b) {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return new Date(b.updated_at) - new Date(a.updated_at);
      });
      renderSidebarSlot();
    }

    function buildMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) return pop;
      pop = document.createElement('div');
      pop.id = 'mention-popup';
      document.body.appendChild(pop);
      return pop;
    }
    function positionMentionPopup(pop, textarea) {
      var rect = textarea.getBoundingClientRect();
      pop.style.left = rect.left + 'px';
      pop.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      pop.style.top = 'auto';
    }
    function detectMention() {
      var value = input.value;
      var caret = input.selectionStart;
      var upToCaret = value.slice(0, caret);
      var match = upToCaret.match(/@([A-Za-z][A-Za-z0-9_]*)?$/);
      if (!match) return null;
      var query = (match[1] || '').toLowerCase();
      var start = caret - match[0].length;
      var matches = agents.filter(function (a) {
        return !query || a.name.toLowerCase().indexOf(query) === 0;
      });
      if (!matches.length) return null;
      return { start: start, query: query, matches: matches, index: 0 };
    }
    function showMentionPopup(state) {
      var pop = buildMentionPopup();
      positionMentionPopup(pop, input);
      pop.innerHTML = state.matches.map(function (a, i) {
        var active = i === state.index ? 'background:var(--blush);' : '';
        var initial = (a.name || '?').charAt(0).toUpperCase();
        return (
          '<div class="mention-item" data-index="' + i + '" style="' + active + '">' +
            '<div class="mention-item__avatar">' + esc(initial) + '</div>' +
            '<div style="min-width:0">' +
              '<div style="font-weight:600;color:var(--navy)">@' + esc(a.name) + '</div>' +
              '<div style="font-size:0.75rem;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
                esc(a.description || a.subject || 'Custom AI') + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');
      pop.style.display = 'block';
      pop.querySelectorAll('.mention-item').forEach(function (el) {
        el.addEventListener('mousedown', function (e) {
          e.preventDefault();
          selectMention(parseInt(el.getAttribute('data-index'), 10));
        });
      });
    }
    function hideMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) pop.style.display = 'none';
      mentionState = null;
    }
    function selectMention(idx) {
      if (!mentionState) return;
      var agent = mentionState.matches[idx];
      if (!agent) return;
      var value = input.value;
      var before = value.slice(0, mentionState.start);
      var after = value.slice(input.selectionStart);
      var insert = '@' + agent.name + ' ';
      input.value = before + insert + after;
      var newCaret = before.length + insert.length;
      input.setSelectionRange(newCaret, newCaret);
      hideMentionPopup();
      autoGrow(); input.focus();
    }

    function renderAttachStrip() {
      if (!stagedAttachments.length) {
        attachStrip.classList.remove('is-visible');
        attachStrip.innerHTML = '';
        return;
      }
      attachStrip.classList.add('is-visible');
      attachStrip.innerHTML = stagedAttachments.map(function (a) {
        var statusCls = 'attach-chip__status';
        if (a.status === 'ready') statusCls += ' attach-chip__status--ready';
        if (a.status === 'failed') statusCls += ' attach-chip__status--failed';
        var statusLabel = a.status === 'ready' ? 'ready' : a.status === 'failed' ? 'failed' : 'reading…';
        return (
          '<div class="attach-chip" data-id="' + a.id + '">' +
            '<div class="attach-chip__icon"><i class="fa-solid fa-file-lines"></i></div>' +
            '<span class="attach-chip__name">' + esc(a.name) + '</span>' +
            '<span class="' + statusCls + '">' + statusLabel + '</span>' +
            '<button class="attach-chip__remove" data-id="' + a.id + '" type="button" title="Remove">' +
              '<i class="fa-solid fa-xmark"></i>' +
            '</button>' +
          '</div>'
        );
      }).join('');
      attachStrip.querySelectorAll('.attach-chip__remove').forEach(function (btn) {
        btn.addEventListener('click', function () {
          removeAttachment(btn.getAttribute('data-id'));
        });
      });
    }

    async function uploadFile(file) {
      var form = new FormData();
      form.append('file', file);
      try {
        var res = await fetch('/api/chat/attachments', { method: 'POST', credentials: 'include', body: form });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { alert(data.error || 'Upload failed.'); return null; }
        return data.attachment;
      } catch (_) { alert('Cannot reach the server.'); return null; }
    }

    async function addFiles(files) {
      for (var i = 0; i < files.length; i++) {
        var att = await uploadFile(files[i]);
        if (!att) continue;
        stagedAttachments.push({
          id: att.id, name: att.original_name,
          status: att.extraction_status || 'pending',
        });
        renderAttachStrip();
        pollAttachment(att.id);
      }
    }

    async function pollAttachment(id) {
      for (var i = 0; i < 30; i++) {
        await new Promise(function (r) { setTimeout(r, 2000); });
        try {
          var res = await fetch('/api/chat/attachments/' + id, { credentials: 'include' });
          if (!res.ok) return;
          var data = await res.json();
          var staged = stagedAttachments.find(function (a) { return a.id === id; });
          if (!staged) return;
          staged.status = data.extraction_status;
          renderAttachStrip();
          if (data.extraction_status === 'ready' || data.extraction_status === 'failed') return;
        } catch (_) { return; }
      }
    }

    async function removeAttachment(id) {
      try {
        await fetch('/api/chat/attachments/' + id, { method: 'DELETE', credentials: 'include' });
      } catch (_) {}
      stagedAttachments = stagedAttachments.filter(function (a) { return a.id !== id; });
      renderAttachStrip();
    }

    attachBtn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function (e) {
      if (e.target.files && e.target.files.length) addFiles(Array.from(e.target.files));
      fileInput.value = '';
    });

    var dragCounter = 0;
    document.addEventListener('dragenter', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.types) return;
      if (e.dataTransfer.types.indexOf('Files') === -1) return;
      e.preventDefault();
      dragCounter++;
      if (dragCounter === 1) dragOverlay.classList.add('is-visible');
    });
    document.addEventListener('dragover', function (e) {
      if (e.dataTransfer && e.dataTransfer.types.indexOf('Files') !== -1) e.preventDefault();
    });
    document.addEventListener('dragleave', function () {
      dragCounter--;
      if (dragCounter <= 0) { dragCounter = 0; dragOverlay.classList.remove('is-visible'); }
    });
    document.addEventListener('drop', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      dragCounter = 0;
      dragOverlay.classList.remove('is-visible');
      addFiles(Array.from(e.dataTransfer.files));
    });

    function setMicState(state) {
      if (state === 'recording') {
        micBtn.classList.add('is-recording');
        micIcon.className = 'fa-solid fa-stop';
        micBtn.title = 'Stop recording';
        micBtn.disabled = false;
        recBanner.classList.add('is-visible');
      } else if (state === 'transcribing') {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-spinner fa-spin';
        micBtn.title = 'Transcribing…';
        micBtn.disabled = true;
        recBanner.classList.remove('is-visible');
      } else {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-microphone';
        micBtn.title = 'Voice input';
        micBtn.disabled = false;
        recBanner.classList.remove('is-visible');
      }
    }
    function pickMimeType() {
      var opts = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
      if (!window.MediaRecorder) return null;
      for (var i = 0; i < opts.length; i++) if (MediaRecorder.isTypeSupported(opts[i])) return opts[i];
      return '';
    }
    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Your browser does not support microphone access.'); return;
      }
      try { mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (err) { alert('Could not access the microphone: ' + err.message); return; }
      var mimeType = pickMimeType();
      try {
        mediaRecorder = mimeType
          ? new MediaRecorder(mediaStream, { mimeType: mimeType })
          : new MediaRecorder(mediaStream);
      } catch (err) { stopStream(); alert('Could not start recording.'); return; }

      audioChunks = [];
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) audioChunks.push(e.data); };
      mediaRecorder.onstop = onRecordingStop;
      mediaRecorder.start();
      recordingStart = Date.now();
      updateRecordingTime();
      recordingTimer = setInterval(updateRecordingTime, 1000);
      setMicState('recording');
    }
    function updateRecordingTime() {
      var s = Math.floor((Date.now() - recordingStart) / 1000);
      var m = Math.floor(s / 60);
      var sec = s - m * 60;
      recTime.textContent = m + ':' + (sec < 10 ? '0' : '') + sec;
      if (s >= 120) stopRecording();
    }
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    }
    function stopStream() {
      if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; }
    }
    async function onRecordingStop() {
      stopStream();
      if (Date.now() - recordingStart < 500) { setMicState('idle'); return; }
      var mimeType = mediaRecorder.mimeType || 'audio/webm';
      var blob = new Blob(audioChunks, { type: mimeType });
      audioChunks = [];
      if (blob.size < 1000) { setMicState('idle'); alert('Recording was too short.'); return; }
      await sendAudio(blob);
    }
    async function sendAudio(blob) {
      setMicState('transcribing');
      var form = new FormData();
      form.append('audio', blob, 'recording.webm');
      try {
        var res = await fetch('/api/voice/transcribe', { method: 'POST', credentials: 'include', body: form });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { alert(data.error || 'Could not transcribe.'); setMicState('idle'); return; }
        var existing = input.value;
        var spacer = existing && !/\s$/.test(existing) ? ' ' : '';
        input.value = existing + spacer + data.text;
        autoGrow(); input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      } catch (_) { alert('Could not reach the server.'); }
      finally { setMicState('idle'); }
    }

    function clearChat() { innerEl.innerHTML = ''; history = []; }

    function startNewConversation() {
      currentConversation = null;
      clearChat();
      renderEmpty();
      renderSidebarSlot();
      input.focus();
    }

    async function openConversation(conv) {
      currentConversation = conv;
      clearChat();
      var data = await apiLoad(conv.id);
      if (!data) { startNewConversation(); return; }
      if (!data.messages || !data.messages.length) {
        renderEmpty();
      } else {
        for (var i = 0; i < data.messages.length; i++) {
          var m = data.messages[i];
          var media = m.media || null;
          addMessage(m.role, m.content, {
            provider: m.provider,
            images: (media && media.images) ? media.images : null,
            webSearch: (media && media.webSearch) ? media.webSearch : null,
          });
          history.push({ role: m.role, content: m.content });
        }
      }
      renderSidebarSlot();
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text && !stagedAttachments.length) return;

      var attachedNow = stagedAttachments.slice();
      addMessage('user', text || '(attached file)', {
        attachments: attachedNow.map(function (a) { return { name: a.name }; }),
      });
      history.push({ role: 'user', content: text || '(see attached file)' });

      var attachmentIds = stagedAttachments.map(function (a) { return a.id; });
      stagedAttachments = [];
      renderAttachStrip();

      input.value = '';
      autoGrow();
      sendBtn.disabled = true;
      input.disabled = true;
      addTyping();

      try {
        var res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            messages: history,
            conversationId: currentConversation ? currentConversation.id : null,
            attachmentIds: attachmentIds,
          }),
        });
        var data = await res.json().catch(function () { return {}; });
        removeTyping();
        if (!res.ok) {
          addMessage('ai', data.error || 'Something went wrong.');
          return;
        }
        addMessage('ai', data.reply, {
          provider: data.provider,
          agentName: data.agent ? data.agent.name : null,
          webSearch: data.webSearch || null,
          libraryUsed: !!data.libraryUsed,
          images: data.images || null,
          tools: data.tools || null, // --- NEW: Pass tools to renderer ---
        });
        history.push({ role: 'assistant', content: data.reply });

        if (!currentConversation && data.conversationId) {
          conversationList = await apiList();
          var created = conversationList.find(function (c) { return c.id === data.conversationId; });
          if (created) currentConversation = created;
          renderSidebarSlot();
        } else if (currentConversation) {
          conversationList = await apiList();
          var still = conversationList.find(function (c) { return c.id === currentConversation.id; });
          if (still) currentConversation = still;
          renderSidebarSlot();
        }
      } catch (err) {
        removeTyping();
        addMessage('ai', 'Cannot reach the server.');
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('input', function () {
      autoGrow();
      var state = detectMention();
      if (state) { mentionState = state; showMentionPopup(state); }
      else { hideMentionPopup(); }
    });

    input.addEventListener('keydown', function (e) {
      if (mentionState && mentionState.matches.length > 0) {
        if (e.key === 'ArrowDown') { e.preventDefault(); mentionState.index = (mentionState.index + 1) % mentionState.matches.length; showMentionPopup(mentionState); return; }
        if (e.key === 'ArrowUp')   { e.preventDefault(); mentionState.index = (mentionState.index - 1 + mentionState.matches.length) % mentionState.matches.length; showMentionPopup(mentionState); return; }
        if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); selectMention(mentionState.index); return; }
        if (e.key === 'Escape') { hideMentionPopup(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    input.addEventListener('blur', function () { setTimeout(hideMentionPopup, 150); });

    micBtn.addEventListener('click', function () {
      if (micBtn.disabled) return;
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
      else startRecording();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeDeleteModal);
    document.getElementById('modal-delete').addEventListener('click', function (e) {
      if (e.target.id === 'modal-delete') closeDeleteModal();
    });
    document.getElementById('modal-confirm').addEventListener('click', async function () {
      if (!pendingDeleteId) return;
      var id = pendingDeleteId;
      closeDeleteModal();
      var ok = await apiDelete(id);
      if (!ok) return;
      conversationList = conversationList.filter(function (c) { return c.id !== id; });
      if (currentConversation && currentConversation.id === id) {
        if (conversationList.length > 0) await openConversation(conversationList[0]);
        else startNewConversation();
      } else renderSidebarSlot();
    });

    (async function init() {
      var ok = await ensureLoggedIn();
      if (!ok) return;
      await loadAgents();
      conversationList = await apiList();
      renderSidebarSlot();
      if (conversationList.length > 0) {
        await openConversation(conversationList[0]);
      } else {
        startNewConversation();
      }
    })();
  })();
</script>
</body>
</html>
