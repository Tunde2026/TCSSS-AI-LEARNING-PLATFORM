<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — AI Learning Platform</title>
<link rel="stylesheet" href="assets/shell.css">
<style>
  .chat-main {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; background: var(--blush);
    height: 100vh; overflow: hidden;
  }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 32px 24px; min-height: 0; }
  .chat-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 20px;
  }

  /* Empty state */
  .chat-empty { max-width: 640px; margin: 40px auto 0; text-align: center; }
  .chat-empty__icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: var(--navy); color: var(--white);
    display: grid; place-items: center;
    margin: 0 auto 20px; font-size: 1.5rem;
  }
  .chat-empty__title {
    font-family: var(--font-head); font-size: 1.9rem;
    font-weight: 600; color: var(--navy); margin-bottom: 8px;
  }
  .chat-empty__sub { color: var(--slate); font-size: 0.98rem; margin-bottom: 32px; }
  .chat-empty__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .suggestion-card {
    padding: 16px; background: var(--white);
    border: 1px solid var(--border); border-radius: 12px;
    text-align: left; cursor: pointer;
    transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    font-family: var(--font-body);
  }
  .suggestion-card:hover {
    border-color: var(--gold); box-shadow: var(--shadow-sm); transform: translateY(-1px);
  }
  .suggestion-card__title {
    font-weight: 600; font-size: 0.88rem; color: var(--navy);
    margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
  }
  .suggestion-card__title i { color: var(--red); font-size: 0.85rem; }
  .suggestion-card__desc { font-size: 0.8rem; color: var(--slate); line-height: 1.45; }

  /* Messages */
  .msg-row { display: flex; gap: 12px; align-items: flex-start; }
  .msg-row--user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; flex-shrink: 0; font-size: 0.8rem;
  }
  .msg-row--ai .msg-avatar   { background: var(--red);  color: var(--white); }
  .msg-row--user .msg-avatar { background: var(--navy); color: var(--white); }

  .msg-body { min-width: 0; max-width: 82%; }
  .msg-content {
    padding: 12px 16px; border-radius: 16px;
    line-height: 1.6; white-space: pre-wrap;
    word-wrap: break-word; font-size: 0.95rem;
  }
  .msg-row--ai .msg-content {
    background: var(--white); color: var(--ink);
    box-shadow: var(--shadow-xs); border-top-left-radius: 6px;
  }
  .msg-row--user .msg-content {
    background: var(--navy); color: var(--white); border-top-right-radius: 6px;
  }
  .msg-meta {
    font-family: var(--font-ui); font-size: 0.65rem; color: var(--slate);
    margin-top: 6px; opacity: 0.75; padding: 0 4px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .msg-row--user .msg-meta { text-align: right; justify-content: flex-end; }

  /* Badges under AI messages */
  .meta-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    font-family: var(--font-ui); font-size: 0.62rem;
    letter-spacing: 0.04em; font-weight: 500;
  }
  .meta-badge--search {
    background: #FBF3E1; color: #8A5A00;
  }
  .meta-badge--search i { font-size: 0.7rem; }
  .meta-badge--library {
    background: #EAF7EE; color: #2F8F4A;
  }
  .meta-badge--library i { font-size: 0.7rem; }

  /* Sources panel */
  .sources-toggle {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--blush); color: var(--navy);
    font-family: var(--font-ui); font-size: 0.62rem;
    letter-spacing: 0.04em; font-weight: 500;
    cursor: pointer; border: none;
    transition: background var(--transition);
  }
  .sources-toggle:hover { background: var(--blush-deep); }
  .sources-toggle i { font-size: 0.6rem; transition: transform var(--transition); }
  .sources-toggle.is-open i { transform: rotate(180deg); }

  .sources-panel {
    margin-top: 10px;
    background: var(--blush);
    border-radius: 12px;
    padding: 12px 14px;
    display: none;
    border: 1px solid var(--border-soft);
  }
  .sources-panel.is-visible { display: block; }
  .sources-panel__label {
    font-family: var(--font-ui); font-size: 0.6rem;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--slate); margin-bottom: 8px; font-weight: 600;
  }
  .source-item {
    display: flex; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .source-item:last-child { border-bottom: none; padding-bottom: 0; }
  .source-item__num {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--white); color: var(--navy);
    display: grid; place-items: center;
    font-family: var(--font-ui); font-size: 0.65rem; font-weight: 700;
    flex-shrink: 0; margin-top: 2px;
  }
  .source-item__body { min-width: 0; flex: 1; }
  .source-item__title {
    font-size: 0.85rem; font-weight: 600; color: var(--navy);
    margin: 0 0 2px; line-height: 1.3;
  }
  .source-item__title a { color: inherit; text-decoration: none; }
  .source-item__title a:hover { color: var(--red); text-decoration: underline; }
  .source-item__url {
    font-family: var(--font-ui); font-size: 0.68rem; color: var(--slate);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin: 0;
  }

  /* Typing */
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--slate);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* Composer */
  .composer-wrap {
    flex-shrink: 0; padding: 16px 24px 20px;
    background: linear-gradient(to top, var(--blush) 60%, rgba(251,239,239,0));
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 8px 8px 8px 18px;
    box-shadow: var(--shadow-sm);
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .composer:focus-within {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,149,46,0.12);
  }
  .composer textarea {
    flex: 1; border: none; outline: none; background: transparent;
    resize: none; font-family: var(--font-body);
    font-size: 0.97rem; line-height: 1.55;
    max-height: 200px; padding: 8px 0; color: var(--ink); min-height: 22px;
  }
  .composer textarea::placeholder { color: var(--slate); opacity: 0.65; }

  .composer-mic, .composer-send {
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    display: grid; place-items: center; flex-shrink: 0; font-size: 0.85rem;
    transition: background var(--transition), transform var(--transition), color var(--transition);
  }
  .composer-mic { background: transparent; color: var(--slate); }
  .composer-mic:hover:not(:disabled) { background: var(--blush); color: var(--navy); }
  .composer-mic:disabled { opacity: 0.4; cursor: not-allowed; }
  .composer-mic.is-recording {
    background: var(--red); color: var(--white); animation: mic-pulse 1.4s infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,17,30,0.5); }
    50%      { box-shadow: 0 0 0 8px rgba(230,17,30,0); }
  }
  .composer-send { background: var(--red); color: var(--white); }
  .composer-send:hover:not(:disabled) { background: var(--deep-red); }
  .composer-send:disabled { background: var(--slate); cursor: not-allowed; opacity: 0.55; }
  .composer-send:active:not(:disabled) { transform: scale(0.94); }

  .recording-banner {
    display: none; max-width: 760px; margin: 8px auto 0;
    padding: 8px 16px; background: #FDECEC; color: var(--deep-red);
    border-radius: 999px; font-family: var(--font-ui);
    font-size: 0.75rem; letter-spacing: 0.05em;
    align-items: center; gap: 10px; justify-content: center;
  }
  .recording-banner.is-visible { display: flex; }
  .recording-banner__dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--red);
    animation: mic-pulse 1.2s infinite;
  }
  .composer-hint {
    max-width: 760px; margin: 8px auto 0;
    font-size: 0.7rem; color: var(--slate);
    text-align: center; opacity: 0.75;
  }

  /* Conversations sidebar */
  .sidebar__section-label {
    font-family: var(--font-ui); font-size: 0.66rem;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: rgba(255,255,255,0.38);
    padding: 6px 12px; font-weight: 500;
  }
  .new-chat-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px; margin-bottom: 14px; border-radius: 10px;
    background: var(--red); color: var(--white); border: none;
    font-family: var(--font-body); font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: background var(--transition);
  }
  .new-chat-btn:hover { background: var(--deep-red); }
  .conv-item {
    position: relative; display: flex; align-items: center; gap: 6px;
    width: 100%; padding: 8px 8px 8px 12px; border-radius: 8px;
    background: transparent; border: none;
    color: rgba(255,255,255,0.72);
    font-family: var(--font-body); font-size: 0.85rem;
    text-align: left; cursor: pointer;
    transition: background var(--transition), color var(--transition);
  }
  .conv-item:hover { background: rgba(255,255,255,0.06); color: var(--white); }
  .conv-item.is-active { background: rgba(255,255,255,0.12); color: var(--white); }
  .conv-item__title {
    flex: 1; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; min-width: 0;
  }
  .conv-item__pin { color: var(--gold); font-size: 0.65rem; flex-shrink: 0; }
  .conv-item__menu-btn {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px;
    border: none; background: transparent; color: rgba(255,255,255,0.7);
    cursor: pointer; display: grid; place-items: center; opacity: 0;
    transition: opacity var(--transition), background var(--transition);
  }
  .conv-item:hover .conv-item__menu-btn { opacity: 1; }
  .conv-item__menu-btn:hover { background: rgba(255,255,255,0.1); color: var(--white); }
  .conv-item__menu-btn.is-open { opacity: 1; background: rgba(255,255,255,0.1); }
  .conv-item__rename-input {
    flex: 1; background: rgba(0,0,0,0.25);
    border: 1px solid var(--gold); border-radius: 6px;
    color: var(--white); font-family: var(--font-body);
    font-size: 0.85rem; padding: 4px 8px; min-width: 0; outline: none;
  }
  .conv-menu {
    position: fixed; z-index: 100; min-width: 160px;
    background: var(--white); border-radius: 10px;
    box-shadow: var(--shadow-lg); padding: 4px;
    display: flex; flex-direction: column;
  }
  .conv-menu__item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    background: transparent; border: none; color: var(--ink);
    font-family: var(--font-body); font-size: 0.85rem;
    text-align: left; cursor: pointer;
    transition: background var(--transition);
  }
  .conv-menu__item:hover { background: var(--blush); }
  .conv-menu__item i { width: 14px; text-align: center; font-size: 0.8rem; }
  .conv-menu__item--danger { color: var(--deep-red); }
  .conv-menu__item--danger:hover { background: #FCECEC; }

  /* Delete modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(17,16,74,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 200; padding: 24px;
  }
  .modal-overlay.is-open { display: flex; }
  .modal {
    width: 100%; max-width: 400px; background: var(--white);
    border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-lg);
  }
  .modal__title {
    font-family: var(--font-head); font-size: 1.15rem;
    color: var(--navy); margin: 0 0 8px;
  }
  .modal__body { color: var(--slate); font-size: 0.92rem; margin: 0 0 20px; line-height: 1.5; }
  .modal__actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* Mention popup */
  #mention-popup {
    position: absolute; background: var(--white);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 6px;
    max-height: 220px; overflow-y: auto; z-index: 250;
    min-width: 220px; display: none;
  }
  .mention-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
  }
  .mention-item:hover { background: var(--blush); }
  .mention-item__avatar {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--navy); color: var(--white);
    display: grid; place-items: center;
    font-weight: 600; font-size: 0.8rem; flex-shrink: 0;
  }

  @media (max-width: 860px) {
    .chat-scroll { padding: 20px 16px; }
    .composer-wrap { padding: 12px 16px 16px; }
    .msg-body { max-width: 88%; }
    .chat-empty { margin-top: 20px; }
    .chat-empty__title { font-size: 1.4rem; }
    .chat-empty__grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="chat-main">
      <div class="chat-scroll" id="scroll">
        <div class="chat-inner" id="inner"></div>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
          <button class="composer-mic" id="mic" type="button" aria-label="Voice input" title="Voice input">
            <i class="fa-solid fa-microphone" id="mic-icon" aria-hidden="true"></i>
          </button>
          <button class="composer-send" type="submit" id="send" aria-label="Send">
            <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
          </button>
        </form>

        <div class="recording-banner" id="recording-banner">
          <span class="recording-banner__dot"></span>
          <span>Recording… <span id="recording-time">0:00</span></span>
          <span style="opacity:0.7">— tap the mic to stop</span>
        </div>

        <div class="composer-hint">AI can make mistakes. Verify important information.</div>
      </div>
    </main>
  </div>

  <!-- Delete conversation modal -->
  <div class="modal-overlay" id="modal-delete">
    <div class="modal">
      <h3 class="modal__title">Delete conversation?</h3>
      <p class="modal__body" id="modal-delete-body">This cannot be undone.</p>
      <div class="modal__actions">
        <button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm" type="button">Delete</button>
      </div>
    </div>
  </div>

<script src="assets/shell.js"></script>
<script>
  (function () {
    'use strict';

    var scrollEl  = document.getElementById('scroll');
    var innerEl   = document.getElementById('inner');
    var form      = document.getElementById('composer');
    var input     = document.getElementById('input');
    var sendBtn   = document.getElementById('send');
    var micBtn    = document.getElementById('mic');
    var micIcon   = document.getElementById('mic-icon');
    var recBanner = document.getElementById('recording-banner');
    var recTime   = document.getElementById('recording-time');

    var currentUser         = null;
    var currentConversation = null;
    var conversationList    = [];
    var agents              = [];
    var history             = [];
    var openMenu            = null;
    var pendingDeleteId     = null;
    var mentionState        = null;

    var mediaRecorder = null;
    var mediaStream   = null;
    var audioChunks   = [];
    var recordingStart = 0;
    var recordingTimer = null;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function ensureLoggedIn() {
      var res = await fetch('/api/auth/me', { credentials: 'include' });
      if (res.status === 401) { window.location.href = 'index.html'; return false; }
      var data = await res.json();
      currentUser = data.user;
      return true;
    }

    async function loadAgents() {
      try {
        var res = await fetch('/api/agents', { credentials: 'include' });
        if (!res.ok) return;
        var data = await res.json();
        agents = data.agents || [];
      } catch (_) {}
    }

    async function apiList() {
      var res = await fetch('/api/conversations', { credentials: 'include' });
      if (!res.ok) return [];
      var d = await res.json();
      return d.conversations || [];
    }
    async function apiLoad(id) {
      var res = await fetch('/api/conversations/' + id, { credentials: 'include' });
      if (!res.ok) return null;
      return res.json();
    }
    async function apiRename(id, title) {
      var res = await fetch('/api/conversations/' + id + '/rename', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', body: JSON.stringify({ title: title }),
      });
      return res.ok ? (await res.json()).conversation : null;
    }
    async function apiPin(id, pinned) {
      var res = await fetch('/api/conversations/' + id + '/pin', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', body: JSON.stringify({ pinned: pinned }),
      });
      return res.ok ? (await res.json()).conversation : null;
    }
    async function apiDelete(id) {
      var res = await fetch('/api/conversations/' + id, {
        method: 'DELETE', credentials: 'include',
      });
      return res.ok;
    }

    function groupConversations(list) {
      var now = new Date();
      var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var t1 = t0 - 86400000;
      var t7 = t0 - 7 * 86400000;
      var g = { pinned: [], today: [], yesterday: [], week: [], older: [] };
      for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (c.pinned) { g.pinned.push(c); continue; }
        var t = new Date(c.updated_at).getTime();
        if (t >= t0)      g.today.push(c);
        else if (t >= t1) g.yesterday.push(c);
        else if (t >= t7) g.week.push(c);
        else              g.older.push(c);
      }
      return g;
    }

    function convItemHTML(c) {
      var active = currentConversation && currentConversation.id === c.id ? ' is-active' : '';
      var pinIcon = c.pinned
        ? '<i class="fa-solid fa-thumbtack conv-item__pin" aria-hidden="true"></i>' : '';
      return (
        '<div class="conv-item' + active + '" data-id="' + c.id + '" role="button" tabindex="0">' +
          pinIcon +
          '<span class="conv-item__title">' + esc(c.title) + '</span>' +
          '<button class="conv-item__menu-btn" data-id="' + c.id + '" aria-label="More options" type="button">' +
            '<i class="fa-solid fa-ellipsis" aria-hidden="true"></i>' +
          '</button>' +
        '</div>'
      );
    }

    function groupHTML(label, items) {
      if (!items.length) return '';
      return (
        '<div class="conv-group">' +
          '<div class="sidebar__section-label">' + label + '</div>' +
          items.map(convItemHTML).join('') +
        '</div>'
      );
    }

    function renderSidebarSlot() {
      var slot = document.getElementById('sidebar-slot');
      if (!slot) return;

      var g = groupConversations(conversationList);
      var html =
        '<button class="new-chat-btn" id="new-chat" type="button">' +
          '<i class="fa-solid fa-plus" aria-hidden="true"></i>' +
          '<span>New chat</span>' +
        '</button>';

      html += groupHTML('Pinned', g.pinned);
      html += groupHTML('Today', g.today);
      html += groupHTML('Yesterday', g.yesterday);
      html += groupHTML('Previous 7 days', g.week);
      html += groupHTML('Older', g.older);

      slot.innerHTML = html;

      var newBtn = document.getElementById('new-chat');
      if (newBtn) newBtn.addEventListener('click', startNewConversation);

      slot.querySelectorAll('.conv-item').forEach(function (item) {
        var id = item.getAttribute('data-id');
        item.addEventListener('click', function (e) {
          if (e.target.closest('.conv-item__menu-btn')) return;
          var conv = conversationList.find(function (c) { return c.id === id; });
          if (conv) openConversation(conv);
        });
      });
      slot.querySelectorAll('.conv-item__menu-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var id = btn.getAttribute('data-id');
          var conv = conversationList.find(function (c) { return c.id === id; });
          if (conv) openConvMenu(btn, conv);
        });
      });
    }

    function closeConvMenu() {
      if (openMenu) { openMenu.remove(); openMenu = null; }
      document.querySelectorAll('.conv-item__menu-btn.is-open').forEach(function (b) {
        b.classList.remove('is-open');
      });
    }
    function openConvMenu(anchorBtn, conv) {
      closeConvMenu();
      anchorBtn.classList.add('is-open');
      var menu = document.createElement('div');
      menu.className = 'conv-menu';
      menu.innerHTML =
        '<button class="conv-menu__item" data-action="rename" type="button">' +
          '<i class="fa-solid fa-pen" aria-hidden="true"></i>Rename</button>' +
        '<button class="conv-menu__item" data-action="pin" type="button">' +
          '<i class="fa-solid fa-thumbtack" aria-hidden="true"></i>' +
          (conv.pinned ? 'Unpin' : 'Pin') + '</button>' +
        '<button class="conv-menu__item conv-menu__item--danger" data-action="delete" type="button">' +
          '<i class="fa-solid fa-trash" aria-hidden="true"></i>Delete</button>';
      document.body.appendChild(menu);
      var rect = anchorBtn.getBoundingClientRect();
      menu.style.top  = (rect.bottom + 4) + 'px';
      menu.style.left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12) + 'px';
      menu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        closeConvMenu();
        if (action === 'rename') startRename(conv);
        if (action === 'pin')    togglePin(conv);
        if (action === 'delete') promptDelete(conv);
      });
      openMenu = menu;
      setTimeout(function () {
        document.addEventListener('click', onDocClick);
        document.addEventListener('keydown', onEsc);
      }, 0);
    }
    function onDocClick(e) {
      if (openMenu && !openMenu.contains(e.target)) {
        closeConvMenu();
        document.removeEventListener('click', onDocClick);
        document.removeEventListener('keydown', onEsc);
      }
    }
    function onEsc(e) {
      if (e.key === 'Escape') {
        closeConvMenu();
        document.removeEventListener('click', onDocClick);
        document.removeEventListener('keydown', onEsc);
      }
    }

    function startRename(conv) {
      var item = document.querySelector('.conv-item[data-id="' + conv.id + '"]');
      if (!item) return;
      var titleEl = item.querySelector('.conv-item__title');
      var menuBtn = item.querySelector('.conv-item__menu-btn');
      var inp = document.createElement('input');
      inp.className = 'conv-item__rename-input';
      inp.type = 'text';
      inp.value = conv.title;
      inp.maxLength = 120;
      titleEl.replaceWith(inp);
      if (menuBtn) menuBtn.style.display = 'none';
      inp.focus();
      inp.select();
      var done = false;
      function commit() {
        if (done) return;
        done = true;
        var v = inp.value.trim();
        if (!v || v === conv.title) { renderSidebarSlot(); return; }
        apiRename(conv.id, v).then(function (updated) {
          if (updated) {
            var i = conversationList.findIndex(function (c) { return c.id === conv.id; });
            if (i !== -1) conversationList[i] = updated;
            if (currentConversation && currentConversation.id === conv.id) {
              currentConversation = updated;
            }
          }
          renderSidebarSlot();
        });
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
        if (e.key === 'Escape') { done = true; renderSidebarSlot(); }
      });
      inp.addEventListener('blur', commit);
    }

    async function togglePin(conv) {
      var updated = await apiPin(conv.id, !conv.pinned);
      if (!updated) return;
      var i = conversationList.findIndex(function (c) { return c.id === conv.id; });
      if (i !== -1) conversationList[i] = updated;
      if (currentConversation && currentConversation.id === conv.id) currentConversation = updated;
      conversationList.sort(function (a, b) {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return new Date(b.updated_at) - new Date(a.updated_at);
      });
      renderSidebarSlot();
    }

    function promptDelete(conv) {
      pendingDeleteId = conv.id;
      document.getElementById('modal-delete-body').textContent =
        '"' + conv.title + '" will be permanently deleted. This cannot be undone.';
      document.getElementById('modal-delete').classList.add('is-open');
    }
    function closeDeleteModal() {
      pendingDeleteId = null;
      document.getElementById('modal-delete').classList.remove('is-open');
    }

    function renderEmpty() {
      innerEl.innerHTML =
        '<div class="chat-empty">' +
          '<div class="chat-empty__icon"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>' +
          '<div class="chat-empty__title">How can I help you today?</div>' +
          '<div class="chat-empty__sub">Ask a question, or start with a suggestion.</div>' +
          '<div class="chat-empty__grid">' +
            sugHTML('fa-lightbulb', 'Explain a concept', 'Explain photosynthesis in simple terms.') +
            sugHTML('fa-calculator', 'Solve a problem', 'Show me how to solve 2x + 5 = 13 step by step.') +
            sugHTML('fa-circle-question', 'Practice quiz', 'Give me 5 practice questions on cell division.') +
            sugHTML('fa-globe', 'Current information', 'What is the latest WAEC syllabus for 2026?') +
          '</div>' +
        '</div>';
      innerEl.querySelectorAll('.suggestion-card').forEach(function (card) {
        card.addEventListener('click', function () {
          input.value = card.getAttribute('data-prompt');
          autoGrow();
          input.focus();
        });
      });
    }

    function sugHTML(icon, title, prompt) {
      return (
        '<button class="suggestion-card" type="button" data-prompt="' + esc(prompt) + '">' +
          '<div class="suggestion-card__title">' +
            '<i class="fa-solid ' + icon + '" aria-hidden="true"></i>' + esc(title) +
          '</div>' +
          '<div class="suggestion-card__desc">' + esc(prompt) + '</div>' +
        '</button>'
      );
    }

    // Render an AI or user message. Also renders badges + sources when supplied.
    function addMessage(role, content, options) {
      options = options || {};
      var provider  = options.provider  || null;
      var agentName = options.agentName || null;
      var webSearch = options.webSearch || null;
      var libraryUsed = !!options.libraryUsed;

      var empty = innerEl.querySelector('.chat-empty');
      if (empty) empty.remove();

      var row = document.createElement('div');
      row.className = 'msg-row msg-row--' + (role === 'user' ? 'user' : 'ai');

      var avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = role === 'user'
        ? '<i class="fa-solid fa-user" aria-hidden="true"></i>'
        : '<i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>';

      var body = document.createElement('div');
      body.className = 'msg-body';

      var contentEl = document.createElement('div');
      contentEl.className = 'msg-content';
      contentEl.textContent = content;
      body.appendChild(contentEl);

      if (role === 'ai') {
        var meta = document.createElement('div');
        meta.className = 'msg-meta';

        if (agentName) {
          var aTag = document.createElement('span');
          aTag.textContent = 'as @' + agentName;
          meta.appendChild(aTag);
        }
        if (provider) {
          var pTag = document.createElement('span');
          pTag.textContent = 'via ' + provider;
          meta.appendChild(pTag);
        }
        if (libraryUsed) {
          var lBadge = document.createElement('span');
          lBadge.className = 'meta-badge meta-badge--library';
          lBadge.innerHTML = '<i class="fa-solid fa-book-open" aria-hidden="true"></i> used library';
          meta.appendChild(lBadge);
        }
        if (webSearch && webSearch.sources && webSearch.sources.length) {
          var sBadge = document.createElement('span');
          sBadge.className = 'meta-badge meta-badge--search';
          sBadge.innerHTML = '<i class="fa-solid fa-globe" aria-hidden="true"></i> searched the web';
          meta.appendChild(sBadge);

          // Sources toggle button
          var toggleBtn = document.createElement('button');
          toggleBtn.type = 'button';
          toggleBtn.className = 'sources-toggle';
          toggleBtn.innerHTML = webSearch.sources.length + ' source' +
            (webSearch.sources.length === 1 ? '' : 's') +
            ' <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>';
          meta.appendChild(toggleBtn);

          // Sources panel (hidden by default)
          var panel = document.createElement('div');
          panel.className = 'sources-panel';
          var label = document.createElement('div');
          label.className = 'sources-panel__label';
          label.textContent = 'Sources used';
          panel.appendChild(label);

          webSearch.sources.forEach(function (src, i) {
            var item = document.createElement('div');
            item.className = 'source-item';
            var num = document.createElement('div');
            num.className = 'source-item__num';
            num.textContent = String(i + 1);
            var sBody = document.createElement('div');
            sBody.className = 'source-item__body';
            var t = document.createElement('div');
            t.className = 'source-item__title';
            var a = document.createElement('a');
            a.href = src.url || '#';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = src.title || '(untitled)';
            t.appendChild(a);
            var u = document.createElement('p');
            u.className = 'source-item__url';
            u.textContent = src.url || '';
            sBody.appendChild(t);
            sBody.appendChild(u);
            item.appendChild(num);
            item.appendChild(sBody);
            panel.appendChild(item);
          });

          body.appendChild(meta);
          body.appendChild(panel);

          toggleBtn.addEventListener('click', function () {
            panel.classList.toggle('is-visible');
            toggleBtn.classList.toggle('is-open');
          });
        } else {
          body.appendChild(meta);
        }
      }

      row.appendChild(avatar);
      row.appendChild(body);
      innerEl.appendChild(row);
      scrollToBottom();
      return contentEl;
    }

    function addTyping() {
      var row = document.createElement('div');
      row.className = 'msg-row msg-row--ai';
      row.id = 'typing-row';
      row.innerHTML =
        '<div class="msg-avatar"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>' +
        '<div class="msg-body"><div class="msg-content">' +
          '<span class="typing"><span></span><span></span><span></span></span>' +
        '</div></div>';
      innerEl.appendChild(row);
      scrollToBottom();
    }
    function removeTyping() {
      var el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    function scrollToBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }
    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }

    function buildMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) return pop;
      pop = document.createElement('div');
      pop.id = 'mention-popup';
      document.body.appendChild(pop);
      return pop;
    }
    function positionMentionPopup(pop, textarea) {
      var rect = textarea.getBoundingClientRect();
      pop.style.left = rect.left + 'px';
      pop.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      pop.style.top = 'auto';
    }
    function detectMention() {
      var value = input.value;
      var caret = input.selectionStart;
      var upToCaret = value.slice(0, caret);
      var match = upToCaret.match(/@([A-Za-z][A-Za-z0-9_]*)?$/);
      if (!match) return null;
      var query = (match[1] || '').toLowerCase();
      var start = caret - match[0].length;
      var matches = agents.filter(function (a) {
        return !query || a.name.toLowerCase().indexOf(query) === 0;
      });
      if (!matches.length) return null;
      return { start: start, query: query, matches: matches, index: 0 };
    }
    function showMentionPopup(state) {
      var pop = buildMentionPopup();
      positionMentionPopup(pop, input);
      pop.innerHTML = state.matches.map(function (a, i) {
        var active = i === state.index ? 'background:var(--blush);' : '';
        var initial = (a.name || '?').charAt(0).toUpperCase();
        return (
          '<div class="mention-item" data-index="' + i + '" style="' + active + '">' +
            '<div class="mention-item__avatar">' + esc(initial) + '</div>' +
            '<div style="min-width:0">' +
              '<div style="font-weight:600;color:var(--navy)">@' + esc(a.name) + '</div>' +
              '<div style="font-size:0.75rem;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
                esc(a.description || a.subject || 'Custom AI') + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');
      pop.style.display = 'block';
      pop.querySelectorAll('.mention-item').forEach(function (el) {
        el.addEventListener('mousedown', function (e) {
          e.preventDefault();
          selectMention(parseInt(el.getAttribute('data-index'), 10));
        });
      });
    }
    function hideMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) pop.style.display = 'none';
      mentionState = null;
    }
    function selectMention(idx) {
      if (!mentionState) return;
      var agent = mentionState.matches[idx];
      if (!agent) return;
      var value = input.value;
      var before = value.slice(0, mentionState.start);
      var after = value.slice(input.selectionStart);
      var insert = '@' + agent.name + ' ';
      input.value = before + insert + after;
      var newCaret = before.length + insert.length;
      input.setSelectionRange(newCaret, newCaret);
      hideMentionPopup();
      autoGrow();
      input.focus();
    }

    function setMicState(state) {
      if (state === 'recording') {
        micBtn.classList.add('is-recording');
        micIcon.className = 'fa-solid fa-stop';
        micBtn.title = 'Stop recording';
        micBtn.disabled = false;
        recBanner.classList.add('is-visible');
      } else if (state === 'transcribing') {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-spinner fa-spin';
        micBtn.title = 'Transcribing…';
        micBtn.disabled = true;
        recBanner.classList.remove('is-visible');
      } else {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-microphone';
        micBtn.title = 'Voice input';
        micBtn.disabled = false;
        recBanner.classList.remove('is-visible');
      }
    }
    function pickMimeType() {
      var options = [
        'audio/webm;codecs=opus', 'audio/webm',
        'audio/ogg;codecs=opus', 'audio/mp4',
      ];
      if (!window.MediaRecorder) return null;
      for (var i = 0; i < options.length; i++) {
        if (MediaRecorder.isTypeSupported(options[i])) return options[i];
      }
      return '';
    }
    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Your browser does not support microphone access.');
        return;
      }
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          alert('Microphone permission was denied. Please allow access and try again.');
        } else if (err.name === 'NotFoundError') {
          alert('No microphone was found on this device.');
        } else {
          alert('Could not access the microphone: ' + err.message);
        }
        return;
      }
      var mimeType = pickMimeType();
      try {
        mediaRecorder = mimeType
          ? new MediaRecorder(mediaStream, { mimeType: mimeType })
          : new MediaRecorder(mediaStream);
      } catch (err) {
        stopStream();
        alert('Could not start recording.');
        return;
      }
      audioChunks = [];
      mediaRecorder.ondataavailable = function (e) {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = onRecordingStop;
      mediaRecorder.start();
      recordingStart = Date.now();
      updateRecordingTime();
      recordingTimer = setInterval(updateRecordingTime, 1000);
      setMicState('recording');
    }
    function updateRecordingTime() {
      var elapsed = Math.floor((Date.now() - recordingStart) / 1000);
      var m = Math.floor(elapsed / 60);
      var s = elapsed - m * 60;
      recTime.textContent = m + ':' + (s < 10 ? '0' : '') + s;
      if (elapsed >= 120) stopRecording();
    }
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    }
    function stopStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(function (t) { t.stop(); });
        mediaStream = null;
      }
    }
    async function onRecordingStop() {
      stopStream();
      var elapsed = Date.now() - recordingStart;
      if (elapsed < 500) { setMicState('idle'); return; }
      var mimeType = mediaRecorder.mimeType || 'audio/webm';
      var blob = new Blob(audioChunks, { type: mimeType });
      audioChunks = [];
      if (blob.size < 1000) { setMicState('idle'); alert('Recording was too short.'); return; }
      await sendAudio(blob);
    }
    async function sendAudio(blob) {
      setMicState('transcribing');
      var form = new FormData();
      form.append('audio', blob, 'recording.webm');
      try {
        var res = await fetch('/api/voice/transcribe', {
          method: 'POST', credentials: 'include', body: form,
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          alert(data.error || 'Could not transcribe your voice.');
          setMicState('idle');
          return;
        }
        var existing = input.value;
        var spacer = existing && !/\s$/.test(existing) ? ' ' : '';
        input.value = existing + spacer + data.text;
        autoGrow();
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      } catch (err) {
        alert('Could not reach the server for transcription.');
      } finally {
        setMicState('idle');
      }
    }

    function clearChat() { innerEl.innerHTML = ''; history = []; }

    function startNewConversation() {
      currentConversation = null;
      clearChat();
      renderEmpty();
      renderSidebarSlot();
      input.focus();
    }

    async function openConversation(conv) {
      currentConversation = conv;
      clearChat();
      var data = await apiLoad(conv.id);
      if (!data) { startNewConversation(); return; }
      if (!data.messages || !data.messages.length) {
        renderEmpty();
      } else {
        for (var i = 0; i < data.messages.length; i++) {
          var m = data.messages[i];
          addMessage(m.role, m.content, { provider: m.provider });
          history.push({ role: m.role, content: m.content });
        }
      }
      renderSidebarSlot();
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      input.value = '';
      autoGrow();
      sendBtn.disabled = true;
      input.disabled = true;
      addTyping();

      try {
        var res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            messages: history,
            conversationId: currentConversation ? currentConversation.id : null,
          }),
        });
        var data = await res.json().catch(function () { return {}; });
        removeTyping();
        if (!res.ok) {
          addMessage('ai', data.error || 'Something went wrong.');
          return;
        }
        addMessage('ai', data.reply, {
          provider: data.provider,
          agentName: data.agent ? data.agent.name : null,
          webSearch: data.webSearch || null,
          libraryUsed: !!data.libraryUsed,
        });
        history.push({ role: 'assistant', content: data.reply });

        if (!currentConversation && data.conversationId) {
          conversationList = await apiList();
          var created = conversationList.find(function (c) { return c.id === data.conversationId; });
          if (created) currentConversation = created;
          renderSidebarSlot();
        } else if (currentConversation) {
          conversationList = await apiList();
          var still = conversationList.find(function (c) { return c.id === currentConversation.id; });
          if (still) currentConversation = still;
          renderSidebarSlot();
        }
      } catch (err) {
        removeTyping();
        addMessage('ai', 'Cannot reach the server.');
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('input', function () {
      autoGrow();
      var state = detectMention();
      if (state) { mentionState = state; showMentionPopup(state); }
      else { hideMentionPopup(); }
    });

    input.addEventListener('keydown', function (e) {
      if (mentionState && mentionState.matches.length > 0) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          mentionState.index = (mentionState.index + 1) % mentionState.matches.length;
          showMentionPopup(mentionState);
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          mentionState.index = (mentionState.index - 1 + mentionState.matches.length) % mentionState.matches.length;
          showMentionPopup(mentionState);
          return;
        }
        if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault();
          selectMention(mentionState.index);
          return;
        }
        if (e.key === 'Escape') { hideMentionPopup(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener('blur', function () {
      setTimeout(hideMentionPopup, 150);
    });

    micBtn.addEventListener('click', function () {
      if (micBtn.disabled) return;
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
      else startRecording();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeDeleteModal);
    document.getElementById('modal-delete').addEventListener('click', function (e) {
      if (e.target.id === 'modal-delete') closeDeleteModal();
    });
    document.getElementById('modal-confirm').addEventListener('click', async function () {
      if (!pendingDeleteId) return;
      var id = pendingDeleteId;
      closeDeleteModal();
      var ok = await apiDelete(id);
      if (!ok) return;
      conversationList = conversationList.filter(function (c) { return c.id !== id; });
      if (currentConversation && currentConversation.id === id) {
        if (conversationList.length > 0) await openConversation(conversationList[0]);
        else startNewConversation();
      } else {
        renderSidebarSlot();
      }
    });

    (async function init() {
      var ok = await ensureLoggedIn();
      if (!ok) return;
      await loadAgents();
      conversationList = await apiList();
      renderSidebarSlot();
      if (conversationList.length > 0) {
        await openConversation(conversationList[0]);
      } else {
        startNewConversation();
      }
    })();
  })();
</script>
</body>
</html>
