<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — AI Learning Platform</title>
<link rel="stylesheet" href="assets/shell.css">
<style>
  /* Page-specific styles for chat only */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-height: 100vh;
  }
  .chat-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--blush-deep);
    background: var(--white);
  }
  .chat-header h1 { margin: 0; font-size: 1.15rem; }

  .chat-stream {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg--user {
    align-self: flex-end;
    background: var(--navy);
    color: var(--white);
    border-bottom-right-radius: 4px;
  }
  .msg--ai {
    align-self: flex-start;
    background: var(--white);
    color: var(--ink);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow-sm);
  }
  .msg--meta {
    font-family: var(--font-ui);
    font-size: 0.7rem;
    color: var(--slate);
    margin-top: 6px;
  }
  .msg--empty {
    align-self: center;
    text-align: center;
    color: var(--slate);
    margin-top: 40px;
  }

  .chat-composer {
    border-top: 1px solid var(--blush-deep);
    background: var(--white);
    padding: 14px 20px 18px;
  }
  .composer-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 860px;
    margin: 0 auto;
  }
  .composer-row .textarea {
    resize: none;
    min-height: 44px;
    max-height: 180px;
    overflow-y: auto;
  }
  .composer-hint {
    max-width: 860px;
    margin: 8px auto 0;
    font-size: 0.75rem;
    color: var(--slate);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="mobile-bar">
    <button class="mobile-bar__toggle" id="sidebar-toggle" aria-label="Open menu">☰</button>
    <span>AI Learning Platform</span>
  </div>
  <div class="backdrop" id="sidebar-backdrop"></div>

  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="chat-main">
      <header class="chat-header">
        <h1>Chat</h1>
      </header>

      <div class="chat-stream" id="stream">
        <div class="msg--empty" id="empty">
          Ask a question to get started.
        </div>
      </div>

      <form class="chat-composer" id="composer">
        <div class="composer-row">
          <textarea class="textarea" id="input" rows="1"
                    placeholder="Ask anything…" aria-label="Message"></textarea>
          <button class="btn btn-primary" type="submit" id="send">Send</button>
        </div>
        <div class="composer-hint">
          The AI can make mistakes. Verify important information.
        </div>
      </form>
    </main>
  </div>

<script src="assets/shell.js"></script>
<script>
  // Page-specific chat logic.
  const stream  = document.getElementById('stream');
  const empty   = document.getElementById('empty');
  const form    = document.getElementById('composer');
  const input   = document.getElementById('input');
  const send    = document.getElementById('send');

  // In-memory conversation for now. Persistence comes with auth + db.
  const history = [];

  function addMessage(role, content, provider) {
    if (empty) empty.style.display = 'none';

    const el = document.createElement('div');
    el.className = 'msg msg--' + (role === 'user' ? 'user' : 'ai');
    el.textContent = content;

    if (provider) {
      const meta = document.createElement('div');
      meta.className = 'msg--meta';
      meta.textContent = 'via ' + provider;
      el.appendChild(meta);
    }

    stream.appendChild(el);
    stream.scrollTop = stream.scrollHeight;
    return el;
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }
  input.addEventListener('input', autoGrow);

  // Enter sends, Shift+Enter newline.
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    input.value = '';
    autoGrow();
    send.disabled = true;
    input.disabled  = true;

    const pending = addMessage('ai', 'Thinking…');

    try {
      const res = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ messages: history })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        pending.textContent = data.error || 'Something went wrong.';
        return;
      }

      pending.textContent = data.reply;
      if (data.provider) {
        const meta = document.createElement('div');
        meta.className = 'msg--meta';
        meta.textContent = 'via ' + data.provider;
        pending.appendChild(meta);
      }
      history.push({ role: 'assistant', content: data.reply });

    } catch (err) {
      pending.textContent = 'Cannot reach the server.';
    } finally {
      send.disabled = false;
      input.disabled  = false;
      input.focus();
    }
  });
</script>
</body>
</html>
