<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — AI Learning Platform</title>
<link rel="stylesheet" href="assets/shell.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="chat-main">
      <header class="chat-topbar">
        <div class="chat-topbar__title" id="topbar-title">New chat</div>
      </header>

      <div class="chat-scroll" id="scroll">
        <div class="chat-inner" id="inner"></div>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask anything…"
                    aria-label="Message"></textarea>
          <button class="composer-send" type="submit" id="send" aria-label="Send">
            <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
          </button>
        </form>
        <div class="composer-hint">AI can make mistakes. Verify important information.</div>
      </div>
    </main>
  </div>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="modal-delete">
    <div class="modal">
      <h3 class="modal__title">Delete conversation?</h3>
      <p class="modal__body" id="modal-delete-body">
        This action cannot be undone.
      </p>
      <div class="modal__actions">
        <button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm" type="button">Delete</button>
      </div>
    </div>
  </div>

<script src="assets/shell.js"></script>
<script src="assets/shell.js"></script>
<script>
  // ============================================================
  // Chat page — conversation management + @agent mentions
  // ============================================================

  const scrollEl     = document.getElementById('scroll');
  const innerEl      = document.getElementById('inner');
  const form         = document.getElementById('composer');
  const input        = document.getElementById('input');
  const sendBtn      = document.getElementById('send');
  const topbarTitle  = document.getElementById('topbar-title');

  let currentUser         = null;
  let currentConversation = null;
  let conversationList    = [];
  let agents              = [];
  let history             = [];
  let openMenu            = null;
  let pendingDeleteId     = null;
  let mentionState        = null;   // { start, query, index } | null

  // ---------------- Auth ----------------
  async function ensureLoggedIn() {
    const res = await fetch('/api/auth/me', { credentials: 'include' });
    if (res.status === 401) { window.location.href = 'index.html'; return false; }
    const data = await res.json();
    currentUser = data.user;
    return true;
  }

  async function loadAgents() {
    try {
      const res = await fetch('/api/agents', { credentials: 'include' });
      if (!res.ok) return;
      const data = await res.json();
      agents = data.agents || [];
    } catch (_) {}
  }

  // ---------------- API ----------------
  async function apiList() {
    const res = await fetch('/api/conversations', { credentials: 'include' });
    if (!res.ok) return [];
    const d = await res.json();
    return d.conversations || [];
  }
  async function apiLoad(id) {
    const res = await fetch('/api/conversations/' + id, { credentials: 'include' });
    if (!res.ok) return null;
    return res.json();
  }
  async function apiRename(id, title) {
    const res = await fetch('/api/conversations/' + id + '/rename', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      credentials: 'include', body: JSON.stringify({ title }),
    });
    return res.ok ? (await res.json()).conversation : null;
  }
  async function apiPin(id, pinned) {
    const res = await fetch('/api/conversations/' + id + '/pin', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      credentials: 'include', body: JSON.stringify({ pinned }),
    });
    return res.ok ? (await res.json()).conversation : null;
  }
  async function apiDelete(id) {
    const res = await fetch('/api/conversations/' + id, {
      method: 'DELETE', credentials: 'include',
    });
    return res.ok;
  }

  // ---------------- Sidebar rendering ----------------
  function groupConversations(list) {
    const now = new Date();
    const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const t1 = t0 - 86400000;
    const t7 = t0 - 7 * 86400000;
    const g = { pinned: [], today: [], yesterday: [], week: [], older: [] };
    for (const c of list) {
      if (c.pinned) { g.pinned.push(c); continue; }
      const t = new Date(c.updated_at).getTime();
      if (t >= t0)       g.today.push(c);
      else if (t >= t1)  g.yesterday.push(c);
      else if (t >= t7)  g.week.push(c);
      else               g.older.push(c);
    }
    return g;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function convItemHTML(c) {
    const active = currentConversation && currentConversation.id === c.id ? ' is-active' : '';
    const pinIcon = c.pinned
      ? '<i class="fa-solid fa-thumbtack conv-item__pin" aria-hidden="true"></i>' : '';
    return (
      '<div class="conv-item' + active + '" data-id="' + c.id + '" role="button" tabindex="0">' +
        pinIcon +
        '<span class="conv-item__title">' + esc(c.title) + '</span>' +
        '<button class="conv-item__menu-btn" data-id="' + c.id + '" ' +
                'aria-label="More options" type="button">' +
          '<i class="fa-solid fa-ellipsis" aria-hidden="true"></i>' +
        '</button>' +
      '</div>'
    );
  }

  function groupHTML(label, items) {
    if (!items.length) return '';
    return (
      '<div class="conv-group">' +
        '<div class="conv-group__label">' + label + '</div>' +
        items.map(convItemHTML).join('') +
      '</div>'
    );
  }

  function renderSidebarSlot() {
    const slot = document.getElementById('sidebar-slot');
    if (!slot) return;

    const g = groupConversations(conversationList);
    let html =
      '<button class="new-chat-btn" id="new-chat" type="button">' +
        '<i class="fa-solid fa-plus" aria-hidden="true"></i>' +
        '<span>New chat</span>' +
      '</button>';

    html += groupHTML('Pinned', g.pinned);
    html += groupHTML('Today', g.today);
    html += groupHTML('Yesterday', g.yesterday);
    html += groupHTML('Previous 7 days', g.week);
    html += groupHTML('Older', g.older);

    slot.innerHTML = html;

    document.getElementById('new-chat').addEventListener('click', startNewConversation);

    slot.querySelectorAll('.conv-item').forEach(item => {
      const id = item.getAttribute('data-id');
      item.addEventListener('click', (e) => {
        if (e.target.closest('.conv-item__menu-btn')) return;
        const conv = conversationList.find(c => c.id === id);
        if (conv) openConversation(conv);
      });
    });
    slot.querySelectorAll('.conv-item__menu-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.getAttribute('data-id');
        const conv = conversationList.find(c => c.id === id);
        if (conv) openConvMenu(btn, conv);
      });
    });
  }

  // ---------------- Conversation menu ----------------
  function closeConvMenu() {
    if (openMenu) { openMenu.remove(); openMenu = null; }
    document.querySelectorAll('.conv-item__menu-btn.is-open')
      .forEach(b => b.classList.remove('is-open'));
  }

  function openConvMenu(anchorBtn, conv) {
    closeConvMenu();
    anchorBtn.classList.add('is-open');

    const menu = document.createElement('div');
    menu.className = 'conv-menu';
    menu.innerHTML =
      '<button class="conv-menu__item" data-action="rename" type="button">' +
        '<i class="fa-solid fa-pen" aria-hidden="true"></i>Rename</button>' +
      '<button class="conv-menu__item" data-action="pin" type="button">' +
        '<i class="fa-solid fa-thumbtack" aria-hidden="true"></i>' +
        (conv.pinned ? 'Unpin' : 'Pin') + '</button>' +
      '<button class="conv-menu__item conv-menu__item--danger" data-action="delete" type="button">' +
        '<i class="fa-solid fa-trash" aria-hidden="true"></i>Delete</button>';

    document.body.appendChild(menu);
    const rect = anchorBtn.getBoundingClientRect();
    menu.style.top  = (rect.bottom + 4) + 'px';
    menu.style.left = Math.min(rect.left, window.innerWidth - menu.offsetWidth - 12) + 'px';

    menu.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-action');
      closeConvMenu();
      if (action === 'rename') startRename(conv);
      if (action === 'pin')    togglePin(conv);
      if (action === 'delete') promptDelete(conv);
    });

    openMenu = menu;
    setTimeout(() => {
      document.addEventListener('click', onDocClick);
      document.addEventListener('keydown', onEsc);
    }, 0);
  }
  function onDocClick(e) {
    if (openMenu && !openMenu.contains(e.target)) {
      closeConvMenu();
      document.removeEventListener('click', onDocClick);
      document.removeEventListener('keydown', onEsc);
    }
  }
  function onEsc(e) {
    if (e.key === 'Escape') {
      closeConvMenu();
      document.removeEventListener('click', onDocClick);
      document.removeEventListener('keydown', onEsc);
    }
  }

  function startRename(conv) {
    const item = document.querySelector('.conv-item[data-id="' + conv.id + '"]');
    if (!item) return;
    const titleEl = item.querySelector('.conv-item__title');
    const menuBtn = item.querySelector('.conv-item__menu-btn');

    const inp = document.createElement('input');
    inp.className = 'conv-item__rename-input';
    inp.type = 'text'; inp.value = conv.title; inp.maxLength = 120;
    titleEl.replaceWith(inp);
    if (menuBtn) menuBtn.style.display = 'none';
    inp.focus(); inp.select();

    let done = false;
    async function commit() {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (!v || v === conv.title) { renderSidebarSlot(); return; }
      const updated = await apiRename(conv.id, v);
      if (updated) {
        const i = conversationList.findIndex(c => c.id === conv.id);
        if (i !== -1) conversationList[i] = updated;
        if (currentConversation && currentConversation.id === conv.id) {
          currentConversation = updated;
          topbarTitle.textContent = updated.title;
        }
      }
      renderSidebarSlot();
    }
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      if (e.key === 'Escape') { done = true; renderSidebarSlot(); }
    });
    inp.addEventListener('blur', commit);
  }

  async function togglePin(conv) {
    const updated = await apiPin(conv.id, !conv.pinned);
    if (!updated) return;
    const i = conversationList.findIndex(c => c.id === conv.id);
    if (i !== -1) conversationList[i] = updated;
    if (currentConversation && currentConversation.id === conv.id) currentConversation = updated;
    conversationList.sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return new Date(b.updated_at) - new Date(a.updated_at);
    });
    renderSidebarSlot();
  }

  function promptDelete(conv) {
    pendingDeleteId = conv.id;
    document.getElementById('modal-delete-body').textContent =
      '"' + conv.title + '" will be permanently deleted. This cannot be undone.';
    document.getElementById('modal-delete').classList.add('is-open');
  }
  function closeDeleteModal() {
    pendingDeleteId = null;
    document.getElementById('modal-delete').classList.remove('is-open');
  }
  document.getElementById('modal-cancel').addEventListener('click', closeDeleteModal);
  document.getElementById('modal-delete').addEventListener('click', (e) => {
    if (e.target.id === 'modal-delete') closeDeleteModal();
  });
  document.getElementById('modal-confirm').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const id = pendingDeleteId;
    closeDeleteModal();
    const ok = await apiDelete(id);
    if (!ok) return;
    conversationList = conversationList.filter(c => c.id !== id);
    if (currentConversation && currentConversation.id === id) {
      if (conversationList.length > 0) await openConversation(conversationList[0]);
      else startNewConversation();
    } else renderSidebarSlot();
  });

  // ---------------- Chat rendering ----------------
  function renderEmpty() {
    innerEl.innerHTML =
      '<div class="chat-empty">' +
        '<div class="chat-empty__icon"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>' +
        '<div class="chat-empty__title">How can I help you today?</div>' +
        '<div class="chat-empty__sub">Ask a question, or start with a suggestion.</div>' +
        '<div class="chat-empty__grid">' +
          suggestionHTML('fa-lightbulb','Explain a concept','Explain photosynthesis in simple terms.') +
          suggestionHTML('fa-calculator','Solve a problem','Show me how to solve 2x + 5 = 13 step by step.') +
          suggestionHTML('fa-circle-question','Practice quiz','Give me 5 practice questions on cell division.') +
          suggestionHTML('fa-diagram-project','Visualize a process','Describe the stages of mitosis step by step.') +
        '</div>' +
      '</div>';

    innerEl.querySelectorAll('.suggestion-card').forEach(card => {
      card.addEventListener('click', () => {
        input.value = card.getAttribute('data-prompt');
        autoGrow(); input.focus();
      });
    });
  }

  function suggestionHTML(icon, title, prompt) {
    return (
      '<button class="suggestion-card" type="button" data-prompt="' + esc(prompt) + '">' +
        '<div class="suggestion-card__title">' +
          '<i class="fa-solid ' + icon + '" aria-hidden="true"></i>' + esc(title) + '</div>' +
        '<div class="suggestion-card__desc">' + esc(prompt) + '</div>' +
      '</button>'
    );
  }

  function addMessage(role, content, provider, agentName) {
    const empty = innerEl.querySelector('.chat-empty');
    if (empty) empty.remove();

    const row = document.createElement('div');
    row.className = 'msg-row msg-row--' + (role === 'user' ? 'user' : 'ai');

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = role === 'user'
      ? '<i class="fa-solid fa-user" aria-hidden="true"></i>'
      : '<i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const contentEl = document.createElement('div');
    contentEl.className = 'msg-content';
    contentEl.textContent = content;
    body.appendChild(contentEl);

    let metaText = '';
    if (agentName) metaText = 'as @' + agentName;
    if (provider)  metaText = (metaText ? metaText + ' · ' : '') + 'via ' + provider;

    if (metaText) {
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = metaText;
      body.appendChild(meta);
    }

    row.appendChild(avatar);
    row.appendChild(body);
    innerEl.appendChild(row);
    scrollToBottom();
    return contentEl;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row msg-row--ai';
    row.id = 'typing-row';
    row.innerHTML =
      '<div class="msg-avatar"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>' +
      '<div class="msg-body"><div class="msg-content">' +
        '<span class="typing"><span></span><span></span><span></span></span>' +
      '</div></div>';
    innerEl.appendChild(row);
    scrollToBottom();
  }
  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function scrollToBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  }

  // ---------------- @mention autocomplete ----------------
  function buildMentionPopup() {
    let pop = document.getElementById('mention-popup');
    if (pop) return pop;
    pop = document.createElement('div');
    pop.id = 'mention-popup';
    pop.style.cssText = [
      'position:absolute',
      'background:#fff',
      'border:1px solid var(--border)',
      'border-radius:12px',
      'box-shadow:0 12px 32px rgba(17,16,74,0.14)',
      'padding:6px',
      'max-height:220px',
      'overflow-y:auto',
      'z-index:250',
      'min-width:220px',
      'display:none',
    ].join(';');
    document.body.appendChild(pop);
    return pop;
  }

  function positionMentionPopup(pop, textarea) {
    const rect = textarea.getBoundingClientRect();
    pop.style.left = rect.left + 'px';
    pop.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    pop.style.top = 'auto';
  }

  function detectMention() {
    const value = input.value;
    const caret = input.selectionStart;
    const upToCaret = value.slice(0, caret);
    const match = upToCaret.match(/@([A-Za-z][A-Za-z0-9_]*)?$/);
    if (!match) return null;

    const query = (match[1] || '').toLowerCase();
    const start = caret - match[0].length;
    const matches = agents.filter(a =>
      !query || a.name.toLowerCase().startsWith(query)
    );
    if (matches.length === 0) return null;
    return { start, query, matches, index: 0 };
  }

  function showMentionPopup(state) {
    const pop = buildMentionPopup();
    positionMentionPopup(pop, input);

    pop.innerHTML = state.matches.map((a, i) => {
      const active = i === state.index ? 'background:var(--blush);' : '';
      const initial = (a.name || '?').charAt(0).toUpperCase();
      return (
        '<div class="mention-item" data-index="' + i + '" style="' +
          'display:flex;align-items:center;gap:10px;padding:8px 10px;' +
          'border-radius:8px;cursor:pointer;font-size:0.9rem;' + active + '">' +
          '<div style="width:26px;height:26px;border-radius:6px;background:var(--navy);' +
            'color:#fff;display:grid;place-items:center;font-weight:600;font-size:0.8rem">' +
            esc(initial) + '</div>' +
          '<div style="min-width:0">' +
            '<div style="font-weight:600;color:var(--navy)">@' + esc(a.name) + '</div>' +
            '<div style="font-size:0.75rem;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
              esc(a.description || a.subject || 'Custom AI') + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    pop.style.display = 'block';

    pop.querySelectorAll('.mention-item').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        selectMention(parseInt(el.getAttribute('data-index'), 10));
      });
    });
  }

  function hideMentionPopup() {
    const pop = document.getElementById('mention-popup');
    if (pop) pop.style.display = 'none';
    mentionState = null;
  }

  function selectMention(idx) {
    if (!mentionState) return;
    const agent = mentionState.matches[idx];
    if (!agent) return;

    const value = input.value;
    const before = value.slice(0, mentionState.start);
    const after  = value.slice(input.selectionStart);
    const insert = '@' + agent.name + ' ';
    input.value = before + insert + after;
    const newCaret = before.length + insert.length;
    input.setSelectionRange(newCaret, newCaret);

    hideMentionPopup();
    autoGrow();
    input.focus();
  }

  input.addEventListener('input', () => {
    autoGrow();
    const state = detectMention();
    if (state) {
      mentionState = state;
      showMentionPopup(state);
    } else {
      hideMentionPopup();
    }
  });

  input.addEventListener('keydown', (e) => {
    // Mention popup navigation
    if (mentionState && mentionState.matches.length > 0) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        mentionState.index = (mentionState.index + 1) % mentionState.matches.length;
        showMentionPopup(mentionState);
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        mentionState.index = (mentionState.index - 1 + mentionState.matches.length)
          % mentionState.matches.length;
        showMentionPopup(mentionState);
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        selectMention(mentionState.index);
        return;
      }
      if (e.key === 'Escape') {
        hideMentionPopup();
        return;
      }
    }

    // Normal send
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // Hide popup on blur (with slight delay so click registers)
  input.addEventListener('blur', () => {
    setTimeout(hideMentionPopup, 150);
  });

  // ---------------- State transitions ----------------
  function clearChat() {
    innerEl.innerHTML = '';
    history = [];
  }

  function startNewConversation() {
    currentConversation = null;
    topbarTitle.textContent = 'New chat';
    clearChat();
    renderEmpty();
    renderSidebarSlot();
    input.focus();
  }

  async function openConversation(conv) {
    currentConversation = conv;
    topbarTitle.textContent = conv.title || 'Chat';
    clearChat();

    const data = await apiLoad(conv.id);
    if (!data) { startNewConversation(); return; }

    if (!data.messages || data.messages.length === 0) {
      renderEmpty();
    } else {
      for (const m of data.messages) {
        addMessage(m.role, m.content, m.provider);
        history.push({ role: m.role, content: m.content });
      }
    }
    renderSidebarSlot();
  }

  // ---------------- Submit ----------------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    input.value = '';
    autoGrow();
    sendBtn.disabled = true;
    input.disabled = true;
    addTyping();

    try {
      const res = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          messages: history,
          conversationId: currentConversation ? currentConversation.id : null,
        }),
      });
      const data = await res.json().catch(() => ({}));
      removeTyping();

      if (!res.ok) {
        addMessage('ai', data.error || 'Something went wrong.');
        return;
      }

      addMessage('ai', data.reply, data.provider,
        data.agent ? data.agent.name : null);
      history.push({ role: 'assistant', content: data.reply });

      if (!currentConversation && data.conversationId) {
        conversationList = await apiList();
        const created = conversationList.find(c => c.id === data.conversationId);
        if (created) {
          currentConversation = created;
          topbarTitle.textContent = created.title || 'Chat';
        }
        renderSidebarSlot();
      } else if (currentConversation) {
        conversationList = await apiList();
        const still = conversationList.find(c => c.id === currentConversation.id);
        if (still) currentConversation = still;
        renderSidebarSlot();
      }
    } catch (err) {
      removeTyping();
      addMessage('ai', 'Cannot reach the server.');
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  });

  // ---------------- Boot ----------------
  (async function init() {
    const ok = await ensureLoggedIn();
    if (!ok) return;

    await loadAgents();
    conversationList = await apiList();
    renderSidebarSlot();

    if (conversationList.length > 0) {
      await openConversation(conversationList[0]);
    } else {
      startNewConversation();
    }
  })();
</script>
</body>
</html>
