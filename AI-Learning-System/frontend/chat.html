          '</div>' +
          '<div class="qa-widget__pill" data-role="counter">1 / ' + total + '</div>' +
        '</div>' +
        '<div class="qa-progress"><div class="qa-progress__fill" data-role="progress" style="width:' + (1 / total * 100) + '%"></div></div>' +
        '<div class="qa-body" data-role="body"></div>' +
        '<div class="qa-actions">' +
          '<div class="qa-actions__left">' +
            '<button type="button" class="qa-btn" data-role="prev"><i class="fa-solid fa-arrow-left"></i> Back</button>' +
          '</div>' +
          '<div class="qa-actions__right">' +
            '<button type="button" class="qa-btn qa-btn--primary" data-role="next">Next <i class="fa-solid fa-arrow-right"></i></button>' +
          '</div>' +
        '</div>' +
        '<div data-role="result-slot"></div>';

      container.innerHTML = html;

      var bodyEl     = container.querySelector('[data-role="body"]');
      var counterEl  = container.querySelector('[data-role="counter"]');
      var progressEl = container.querySelector('[data-role="progress"]');
      var prevBtn    = container.querySelector('[data-role="prev"]');
      var nextBtn    = container.querySelector('[data-role="next"]');
      var resultSlot = container.querySelector('[data-role="result-slot"]');

      function renderCurrent() {
        var q = set.questions[idx];

        counterEl.textContent = (idx + 1) + ' / ' + total;
        progressEl.style.width = ((idx + 1) / total * 100) + '%';
        prevBtn.disabled = idx === 0;

        var isLast = idx === total - 1;
        if (submitted) {
          nextBtn.innerHTML = isLast ? 'Done' : 'Next <i class="fa-solid fa-arrow-right"></i>';
          nextBtn.disabled = false;
        } else {
          nextBtn.innerHTML = isLast
            ? 'Submit <i class="fa-solid fa-check"></i>'
            : 'Next <i class="fa-solid fa-arrow-right"></i>';
          nextBtn.disabled = false;
        }

        bodyEl.innerHTML =
          '<div class="qa-qnum">Question ' + (idx + 1) + ' of ' + total + '</div>' +
          '<div class="qa-qtext qa-qtext--template" data-role="template"></div>' +
          '<div class="qa-feedback" data-role="feedback"></div>';

        var templateEl = bodyEl.querySelector('[data-role="template"]');
        var parts = String(q.template).split('___');
        if (parts.length < 2) {
          templateEl.textContent = q.template;
        } else {
          templateEl.appendChild(document.createTextNode(parts[0]));
          var inp = document.createElement('input');
          inp.type = 'text';
          inp.setAttribute('autocomplete', 'off');
          inp.setAttribute('autocapitalize', 'off');
          inp.setAttribute('spellcheck', 'false');
          inp.placeholder = 'answer';
          inp.value = answers[q.id] || '';

          if (submitted && graded) {
            var g = graded.find(function (x) { return x.questionId === q.id; });
            if (g) {
              inp.disabled = true;
              inp.classList.add(g.correct ? 'is-correct' : 'is-wrong');
            }
          } else {
            inp.addEventListener('input', function () { answers[q.id] = inp.value; });
          }

          templateEl.appendChild(inp);
          if (parts[1]) templateEl.appendChild(document.createTextNode(parts.slice(1).join('___')));

          if (!submitted) setTimeout(function () { inp.focus(); }, 60);
        }

        if (submitted && graded) {
          var g2 = graded.find(function (x) { return x.questionId === q.id; });
          if (g2) {
            var fb = bodyEl.querySelector('[data-role="feedback"]');
            fb.classList.add('is-visible');
            fb.classList.add(g2.correct ? 'qa-feedback--correct' : 'qa-feedback--wrong');
            var inner = '<strong>' + (g2.correct ? '✓ Correct' : '✗ Not quite') + '</strong>';
            if (!g2.correct) inner += '<div>Accepted: ' + esc((g2.acceptedAnswers || []).join(' / ')) + '</div>';
            if (g2.explanation) inner += '<div style="margin-top:6px">' + esc(g2.explanation) + '</div>';
            fb.innerHTML = inner;
          }
        }
      }

      prevBtn.addEventListener('click', function () {
        if (idx > 0) { idx--; renderCurrent(); }
      });

      nextBtn.addEventListener('click', async function () {
        if (submitted) {
          if (idx === total - 1) { scrollToBottom(); return; }
          idx++;
          renderCurrent();
          return;
        }

        if (idx < total - 1) {
          idx++;
          renderCurrent();
          return;
        }

        var missing = set.questions.filter(function (q) {
          return !String(answers[q.id] || '').trim();
        });
        if (missing.length) {
          alert('Please fill all blanks before submitting. ' + missing.length + ' left.');
          var firstMissingIdx = set.questions.findIndex(function (q) {
            return !String(answers[q.id] || '').trim();
          });
          idx = firstMissingIdx;
          renderCurrent();
          return;
        }

        nextBtn.disabled = true;
        nextBtn.textContent = 'Submitting…';

        var payload = set.questions.map(function (q) {
          return { questionId: q.id, answer: answers[q.id] || '' };
        });

        try {
          var res = await fetch('/api/tools/theory/' + set.id + '/attempt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ answers: payload }),
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            nextBtn.disabled = false;
            nextBtn.textContent = 'Try again';
            return;
          }

          submitted = true;
          graded = data.graded || [];

          resultSlot.innerHTML =
            '<div class="qa-result">' +
              '<div class="qa-result__score">' + data.attempt.score + ' / ' + data.attempt.total +
                '<small>Final score</small></div>' +
              '<button type="button" class="qa-btn qa-btn--primary" data-role="ask-ai">Ask AI about my result</button>' +
            '</div>';
          resultSlot.querySelector('[data-role="ask-ai"]').addEventListener('click', function () {
            var wrong = (data.graded || []).filter(function (g) { return !g.correct; });
            var summary = 'I just submitted the theory set "' + (set.title || '') + '". I scored ' +
                          data.attempt.score + ' / ' + data.attempt.total + '.';
            if (!wrong.length) summary += '\n\nI got everything right. What should I study next?';
            else {
              summary += '\n\nQuestions I missed:\n';
              wrong.forEach(function (w) {
                var q = set.questions.find(function (x) { return x.id === w.questionId; });
                if (q) summary += '• ' + q.template.replace('___', '[' + (w.userAnswer || 'blank') + ']') + '\n';
              });
              summary += '\nPlease help me understand what I got wrong.';
            }
            input.value = summary;
            autoGrow();
            form.requestSubmit();
          });

          idx = 0;
          renderCurrent();
          scrollToBottom();
        } catch (_) {
          nextBtn.disabled = false;
          nextBtn.textContent = 'Network error';
        }
      });

      renderCurrent();
    }

    /* ============================================================
       SKETCH
       ============================================================ */
    async function buildInlineSketch(tool) {
      var container = document.createElement('div');
      container.className = 'sketch-widget';
      var canvasId = 'sketch-canvas-' + Math.random().toString(36).slice(2, 10);
      var html =
        '<div class="sketch-widget__head">' +
          '<div class="sketch-widget__icon"><i class="fa-solid fa-pen-ruler"></i></div>' +
          '<div>' +
            '<div class="sketch-widget__title">' + esc(tool.title || 'Formula') + '</div>' +
            '<div class="sketch-widget__meta">' + esc(tool.kind || 'formula') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="sketch-widget__canvas" id="' + canvasId + '"></div>' +
        (tool.explanation ? '<div class="sketch-widget__explain">' + esc(tool.explanation) + '</div>' : '') +
        '<div class="sketch-widget__actions">' +
          '<button type="button" class="sketch-copy-btn" data-action="copy-unicode"><i class="fa-solid fa-copy"></i> Copy</button>' +
          '<button type="button" class="sketch-copy-btn" data-action="copy-latex"><i class="fa-solid fa-square-root-variable"></i> Copy LaTeX</button>' +
          '<button type="button" class="sketch-copy-btn" data-action="save-note"><i class="fa-solid fa-note-sticky"></i> Save to Notes</button>' +
        '</div>';
      container.innerHTML = html;

      var canvas = document.getElementById(canvasId);
      var latex = tool.latex || '';
      var unicodeText = tool.unicode || tool.plain || '';

      if (latex && window.renderMarkdown) {
        var wrapped = latex.indexOf('$') !== -1 ? latex : '$' + latex + '$';
        window.renderMarkdown(wrapped, canvas);
      } else {
        canvas.textContent = unicodeText || '—';
      }

      container.querySelectorAll('.sketch-copy-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var action = btn.getAttribute('data-action');
          if (action === 'copy-unicode') {
            navigator.clipboard.writeText(unicodeText).then(function () { flashBtn(btn, 'Copied'); });
          } else if (action === 'copy-latex') {
            navigator.clipboard.writeText(latex).then(function () { flashBtn(btn, 'Copied'); });
          } else if (action === 'save-note') {
            saveSketchToNotes(tool, btn);
          }
        });
      });

      return container;
    }

    function flashBtn(btn, text) {
      var original = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check"></i> ' + text;
      setTimeout(function () { btn.innerHTML = original; }, 1200);
    }

    async function saveSketchToNotes(tool, btn) {
      var title = prompt('Note title:', tool.topic ? 'Formula — ' + tool.topic : 'Saved formula');
      if (!title) return;
      var content = '## Formula\n\n' + (tool.latex || tool.unicode || tool.plain || '') +
                    (tool.explanation ? '\n\n_' + tool.explanation + '_' : '') +
                    '\n\n*Saved from Chat.*';
      try {
        var res = await fetch('/api/tools/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ title: title, content: content }),
        });
        if (res.ok) flashBtn(btn, 'Saved');
        else btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Failed';
      } catch (_) {
        btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Error';
      }
    }

    /* ============================================================
       EXAM — one question at a time with countdown
       ============================================================ */
    async function buildInteractiveExam(tool) {
      var examId = tool.examId || extractIdFromUrl(tool);
      if (!examId) return buildToolCard(tool);
      var container = document.createElement('div');
      container.className = 'qa-widget';
      container.innerHTML = '<div class="widget-loading">Loading exam…</div>';
      try {
        var res = await fetch('/api/tools/quiz/' + examId, { credentials: 'include' });
        if (!res.ok) { container.innerHTML = '<div class="widget-error">Could not load exam.</div>'; return container; }
        var data = await res.json();
        var exam = data.quiz;
        if (!exam || !exam.questions || !exam.questions.length) {
          container.innerHTML = '<div class="widget-error">Exam has no questions.</div>';
          return container;
        }
        if (!exam.id) exam.id = examId;
        renderExamWidget(container, exam);
      } catch (_) {
        container.innerHTML = '<div class="widget-error">Network error.</div>';
      }
      return container;
    }

    function renderExamWidget(container, exam) {
      var questions   = exam.questions || [];
      var total       = questions.length;
      var idx         = 0;
      var answers     = {};
      var submitted   = false;
      var graded      = null;
      var durationMin = exam.time_limit_seconds
        ? Math.max(1, Math.round(exam.time_limit_seconds / 60))
        : Math.max(5, total * 2);
      var durationSec = durationMin * 60;
      var remaining   = durationSec;
      var timerId     = null;

      function keyFor(q, i) { return String(q.id != null ? q.id : 'q' + i); }

      var html =
        '<div class="qa-widget__head qa-widget__head--exam">' +
          '<div class="qa-widget__icon"><i class="fa-solid fa-stopwatch"></i></div>' +
          '<div class="qa-widget__headtext">' +
            '<div class="qa-widget__title">' + esc(exam.title || 'Exam') + '</div>' +
            '<div class="qa-widget__meta">' + total + ' question' + (total === 1 ? '' : 's') +
              ' · ' + esc(exam.topic || 'general') + '</div>' +
          '</div>' +
          '<div class="exam-widget__timer" data-role="timer">' +
            '<i class="fa-regular fa-clock"></i><span>--:--</span>' +
          '</div>' +
        '</div>' +
        '<div class="qa-progress"><div class="qa-progress__fill" data-role="progress" style="width:' + (1 / total * 100) + '%"></div></div>' +
        '<div class="qa-body" data-role="body"></div>' +
        '<div class="qa-actions">' +
          '<div class="qa-actions__left">' +
            '<button type="button" class="qa-btn" data-role="prev"><i class="fa-solid fa-arrow-left"></i> Back</button>' +
          '</div>' +
          '<div class="qa-actions__right">' +
            '<button type="button" class="qa-btn qa-btn--primary" data-role="next">Next <i class="fa-solid fa-arrow-right"></i></button>' +
          '</div>' +
        '</div>' +
        '<div data-role="result-slot"></div>';

      container.innerHTML = html;

      var bodyEl     = container.querySelector('[data-role="body"]');
      var progressEl = container.querySelector('[data-role="progress"]');
      var prevBtn    = container.querySelector('[data-role="prev"]');
      var nextBtn    = container.querySelector('[data-role="next"]');
      var resultSlot = container.querySelector('[data-role="result-slot"]');
      var timerEl    = container.querySelector('[data-role="timer"]');
      var timerText  = timerEl.querySelector('span');

      function fmtTime(s) {
        var m = Math.floor(s / 60), sec = s % 60;
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }
      function paintTimer() {
        timerText.textContent = fmtTime(remaining);
        timerEl.classList.toggle('is-warning', remaining <= 60 && remaining > 30);
        timerEl.classList.toggle('is-danger',  remaining <= 30);
      }
      function startTimer() {
        paintTimer();
        timerId = setInterval(function () {
          remaining--;
          if (remaining < 0) remaining = 0;
          paintTimer();
          if (remaining <= 0) {
            clearInterval(timerId); timerId = null;
            if (!submitted) submitExam(true);
          }
        }, 1000);
      }

      function renderCurrent() {
        var q = questions[idx];
        var k = keyFor(q, idx);

        progressEl.style.width = ((idx + 1) / total * 100) + '%';
        prevBtn.disabled = idx === 0;

        var isLast = idx === total - 1;
        if (submitted) {
          nextBtn.innerHTML = isLast ? 'Done' : 'Next <i class="fa-solid fa-arrow-right"></i>';
        } else {
          nextBtn.innerHTML = isLast
            ? 'Submit <i class="fa-solid fa-check"></i>'
            : 'Next <i class="fa-solid fa-arrow-right"></i>';
        }

        var bodyHtml =
          '<div class="qa-qnum">Question ' + (idx + 1) + ' of ' + total + '</div>' +
          '<p class="qa-qtext">' + esc(q.question) + '</p>';

        if (q.options && q.options.length) {
          bodyHtml += '<div class="qa-opts" data-role="opts"></div>';
        } else {
          bodyHtml += '<textarea data-role="written" placeholder="Write your answer…" style="width:100%;min-height:120px;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;font-family:var(--font-body);font-size:0.94rem;color:var(--ink);resize:vertical;outline:none"></textarea>';
        }
        bodyHtml += '<div class="qa-feedback" data-role="feedback"></div>';

        bodyEl.innerHTML = bodyHtml;

        var optsEl = bodyEl.querySelector('[data-role="opts"]');
        if (optsEl) {
          (q.options || []).forEach(function (opt) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'qa-opt';
            b.setAttribute('data-label', opt.label);
            b.innerHTML =
              '<span class="qa-opt__label">' + esc(opt.label) + '</span>' +
              '<span class="qa-opt__text">' + esc(opt.text) + '</span>';

            if (submitted && graded) {
              var g = graded.find(function (x) { return String(x.questionId) === k; });
              if (g) {
                b.disabled = true;
                if (g.correct != null && String(opt.label) === String(g.correct)) b.classList.add('is-correct-answer');
                if (g.selected != null && String(opt.label) === String(g.selected) && !g.isCorrect) b.classList.add('is-wrong-answer');
              }
            } else {
              if (answers[k] === opt.label) b.classList.add('is-selected');
              b.addEventListener('click', function () {
                optsEl.querySelectorAll('.qa-opt').forEach(function (o) { o.classList.remove('is-selected'); });
                b.classList.add('is-selected');
                answers[k] = opt.label;
              });
            }
            optsEl.appendChild(b);
          });
        }

        var ta = bodyEl.querySelector('[data-role="written"]');
        if (ta) {
          ta.value = answers[k] || '';
          if (submitted) ta.disabled = true;
          else ta.addEventListener('input', function () { answers[k] = ta.value; });
        }

        if (submitted && graded) {
          var g2 = graded.find(function (x) { return String(x.questionId) === k; });
          if (g2) {
            var fb = bodyEl.querySelector('[data-role="feedback"]');
            fb.classList.add('is-visible');
            fb.classList.add(g2.isCorrect ? 'qa-feedback--correct' : 'qa-feedback--wrong');
            var inner = '<strong>' + (g2.isCorrect ? '✓ Correct' : '✗ Missed') + '</strong>';
            if (!g2.isCorrect && g2.correct != null) inner += '<div>Correct: <b>' + esc(g2.correct) + '</b></div>';
            if (q.explanation) inner += '<div style="margin-top:6px">' + esc(q.explanation) + '</div>';
            fb.innerHTML = inner;
          }
        }
      }

      prevBtn.addEventListener('click', function () {
        if (idx > 0) { idx--; renderCurrent(); }
      });

      nextBtn.addEventListener('click', async function () {
        if (submitted) {
          if (idx === total - 1) { scrollToBottom(); return; }
          idx++;
          renderCurrent();
          return;
        }

        if (idx < total - 1) {
          idx++;
          renderCurrent();
          return;
        }

        submitExam(false);
      });

      async function submitExam(auto) {
        if (submitted) return;
        submitted = true;
        if (timerId) { clearInterval(timerId); timerId = null; }
        nextBtn.disabled = true;
        nextBtn.textContent = 'Scoring…';

        var payload = questions.map(function (q, i) {
          var k = keyFor(q, i);
          return { questionId: k, selected: answers[k] != null ? answers[k] : null };
        });

        try {
          var res = await fetch('/api/tools/quiz/' + exam.id + '/attempt', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ answers: payload, autoSubmitted: !!auto }),
          });
          var data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'Scoring failed');

          graded = data.graded || [];
          var attempt = data.attempt || { score: 0, total: total };
          var pct = attempt.total ? Math.round((attempt.score / attempt.total) * 100) : 0;

          resultSlot.innerHTML =
            '<div class="qa-result">' +
              '<div class="qa-result__score">' + attempt.score + ' / ' + attempt.total +
                '<small>' + pct + '%</small></div>' +
              '<button type="button" class="qa-btn qa-btn--primary" data-role="ask-ai">Ask AI about my result</button>' +
            '</div>' +
            (auto ? '<div class="exam-widget__note">Time ran out — your exam was submitted automatically.</div>' : '');

          resultSlot.querySelector('[data-role="ask-ai"]').addEventListener('click', function () {
            var wrong = graded.filter(function (g) { return !g.isCorrect; });
            var summary = 'I just finished the exam "' + (exam.title || 'exam') + '" and scored ' +
              attempt.score + ' / ' + attempt.total + '.';
            if (!wrong.length) summary += '\n\nI got everything right. What should I study next?';
            else {
              summary += '\n\nQuestions I missed:\n';
              wrong.forEach(function (w) {
                var q = questions.find(function (x, i) { return keyFor(x, i) === String(w.questionId); });
                if (!q) return;
                summary += '• ' + q.question + '\n' +
                  '  I answered: ' + (w.selected || '(nothing)') + '\n' +
                  '  Correct: ' + (w.correct || '(see explanation)') + '\n';
              });
              summary += '\nPlease explain what I got wrong and how to fix it.';
            }
            input.value = summary;
            autoGrow();
            form.requestSubmit();
          });

          idx = 0;
          nextBtn.disabled = false;
          renderCurrent();
          scrollToBottom();
        } catch (err) {
          submitted = false;
          nextBtn.disabled = false;
          nextBtn.textContent = 'Try submitting again';
        }
      }

      renderCurrent();
      startTimer();
    }

          '<div class="viz-widget__icon"><i class="fa-solid fa-diagram-project"></i></div>' +

            '<div class="viz-widget__title">' + esc(tool.title || 'Diagram') + '</div>' +

    /* ============================================================
       STUDY PLAN
       ============================================================ */
    async function buildInlineStudyPlan(tool) {
      var planId = tool.planId || extractIdFromUrl(tool);
      if (!planId) return buildToolCard(tool);
      var container = document.createElement('div');
      container.className = 'plan-widget';
      container.innerHTML = '<div class="widget-loading">Loading study plan…</div>';
      try {
        var res = await fetch('/api/tools/studyplans/' + planId, { credentials: 'include' });
        if (!res.ok) { container.innerHTML = '<div class="widget-error">Could not load plan.</div>'; return container; }
        var data = await res.json();
        if (!data.plan || !data.plan.plan || !data.plan.plan.days) {
          container.innerHTML = '<div class="widget-error">Plan has no days.</div>';
          return container;
        }
        renderStudyPlanWidget(container, data.plan);
      } catch (_) {
        container.innerHTML = '<div class="widget-error">Network error.</div>';
      }
      return container;
    }

    function renderStudyPlanWidget(container, plan) {
      var days = plan.plan.days || [];
      var totalTasks = days.reduce(function (sum, d) { return sum + (d.tasks || []).length; }, 0);
      var storageKey = 'inline-plan-progress-' + plan.id;
      var progress = {};
      try { progress = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (_) {}

      var html =
        '<div class="plan-widget__head">' +
          '<div class="plan-widget__icon"><i class="fa-solid fa-calendar-days"></i></div>' +
          '<div>' +
            '<div class="plan-widget__title">' + esc(plan.title || 'Study Plan') + '</div>' +
            '<div class="plan-widget__meta">' + plan.duration_days + ' days · ' + esc(plan.topic || 'general') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="plan-widget__progress">' +
          '<div class="plan-widget__progress-bar"><div class="plan-widget__progress-fill" id="plan-fill-' + plan.id + '" style="width:0%"></div></div>' +
          '<span class="plan-widget__progress-label" id="plan-label-' + plan.id + '">0 / ' + totalTasks + '</span>' +
        '</div>' +
        '<div class="plan-widget__days">';

      days.forEach(function (d, dayIdx) {
        var tasksHtml = (d.tasks || []).map(function (task, taskIdx) {
          var key = dayIdx + ':' + taskIdx;
          var done = !!progress[key];
          return '<div class="plan-task' + (done ? ' is-done' : '') + '" data-key="' + key + '">' +
            '<div class="plan-task__check">' + (done ? '<i class="fa-solid fa-check" style="font-size:0.6rem"></i>' : '') + '</div>' +
            '<div class="plan-task__text">' + esc(task) + '</div>' +
          '</div>';
        }).join('');
        html += '<div class="plan-day' + (dayIdx === 0 ? ' is-open' : '') + '">' +
          '<div class="plan-day__head">' +
            '<div class="plan-day__num">' + (d.day || (dayIdx + 1)) + '</div>' +
            '<div class="plan-day__body">' +
              '<div class="plan-day__title">' + esc(d.title || ('Day ' + (dayIdx + 1))) + '</div>' +
              '<div class="plan-day__sub">' + (d.duration_minutes || 45) + ' min · ' + (d.tasks || []).length + ' tasks</div>' +
            '</div>' +
            '<i class="fa-solid fa-chevron-down plan-day__arrow"></i>' +
          '</div>' +
          '<div class="plan-day__tasks">' + tasksHtml + '</div>' +
        '</div>';
      });
      html += '</div>';
      container.innerHTML = html;

      function updateProgress() {
        var done = Object.keys(progress).filter(function (k) { return progress[k]; }).length;
        var pct = totalTasks ? Math.round((done / totalTasks) * 100) : 0;
        var fill = document.getElementById('plan-fill-' + plan.id);
        var label = document.getElementById('plan-label-' + plan.id);
        if (fill) fill.style.width = pct + '%';
        if (label) label.textContent = done + ' / ' + totalTasks;
      }

      container.querySelectorAll('.plan-day__head').forEach(function (head) {
        head.addEventListener('click', function () {
          head.parentElement.classList.toggle('is-open');
        });
      });

      container.querySelectorAll('.plan-task').forEach(function (taskEl) {
        taskEl.addEventListener('click', function () {
          var key = taskEl.getAttribute('data-key');
          progress[key] = !progress[key];
          try { localStorage.setItem(storageKey, JSON.stringify(progress)); } catch (_) {}
          taskEl.classList.toggle('is-done', progress[key]);
          var check = taskEl.querySelector('.plan-task__check');
          check.innerHTML = progress[key] ? '<i class="fa-solid fa-check" style="font-size:0.6rem"></i>' : '';
          updateProgress();
        });
      });

      updateProgress();
    }

    /* ============================================================
       NOTE (inline creator)
       ============================================================ */
    function buildInlineNote(tool) {
      var container = document.createElement('div');
      container.className = 'note-widget';
      var inputId = 'note-title-' + Math.random().toString(36).slice(2, 8);
      container.innerHTML =
        '<div class="note-widget__head">' +
          '<div class="note-widget__icon"><i class="fa-solid fa-note-sticky"></i></div>' +
          '<div>' +
            '<div class="note-widget__title">New note</div>' +
            '<div class="note-widget__meta">' + esc(tool.topic || 'general') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="note-widget__body">' +
          '<input type="text" class="note-widget__input" id="' + inputId + '" placeholder="Note title…" style="min-height:0">' +
          '<textarea class="note-widget__input" placeholder="Write your note here…"></textarea>' +
          '<div class="note-widget__actions">' +
            '<button type="button" class="btn btn-ghost">Cancel</button>' +
            '<button type="button" class="btn btn-primary">Save note</button>' +
          '</div>' +
        '</div>';

      var titleInput = container.querySelector('input');
      var textArea = container.querySelector('textarea');
      var actionBtns = container.querySelectorAll('.note-widget__actions button');
      var cancelBtn = actionBtns[0];
      var saveBtn = actionBtns[1];

      if (tool.topic && tool.topic !== 'general knowledge') {
        titleInput.value = tool.topic.charAt(0).toUpperCase() + tool.topic.slice(1);
      }

      cancelBtn.addEventListener('click', function () {
        container.remove();
      });

      saveBtn.addEventListener('click', async function () {
        var title = titleInput.value.trim() || 'Untitled note';
        var content = textArea.value;
        if (!content.trim()) { alert('Write something before saving.'); return; }
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving…';
        try {
          var res = await fetch('/api/tools/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ title: title, content: content, subject: tool.topic || null }),
          });
          if (!res.ok) { alert('Could not save note.'); saveBtn.disabled = false; saveBtn.textContent = 'Save note'; return; }
          container.innerHTML =
            '<div class="note-widget__head">' +
              '<div class="note-widget__icon"><i class="fa-solid fa-check"></i></div>' +
              '<div>' +
                '<div class="note-widget__title">Note saved</div>' +
                '<div class="note-widget__meta">' + esc(title) + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="note-widget__body" style="text-align:center">' +
              '<a href="/lab/notes.html" class="btn btn-ghost">Open Notes</a>' +
            '</div>';
        } catch (_) {
          alert('Network error.');
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save note';
        }
      });

      return container;
    }

    /* ============================================================
       MISTAKES — inline widget
       ============================================================ */
    async function buildInlineMistakes(tool) {
      var container = document.createElement('div');
      container.className = 'mistakes-widget';
      container.innerHTML = '<div class="widget-loading">Loading your mistakes…</div>';

      try {
        var res = await fetch('/api/tools/mistakes', { credentials: 'include' });
        if (!res.ok) {
          container.innerHTML = '<div class="widget-error">Could not load mistakes.</div>';
          return container;
        }
        var data = await res.json();
        var groups = data.groups || [];

        var totalQ = groups.reduce(function (sum, g) { return sum + g.questions.length; }, 0);

        var html =
          '<div class="mistakes-widget__head">' +
            '<div class="mistakes-widget__icon"><i class="fa-solid fa-clipboard-list"></i></div>' +
            '<div>' +
              '<div class="mistakes-widget__title">Mistake Bank</div>' +
              '<div class="mistakes-widget__meta">' +
                (groups.length || 0) + ' topic' + (groups.length === 1 ? '' : 's') +
                ' · ' + totalQ + ' question' + (totalQ === 1 ? '' : 's') +
              '</div>' +
            '</div>' +
          '</div>';

        if (!groups.length) {
          container.innerHTML = html +
            '<div class="mistakes-empty">' +
              '<i class="fa-solid fa-circle-check"></i>' +
              '<h3 class="mistakes-empty__title">No mistakes on record</h3>' +
              '<p class="mistakes-empty__desc">Great work! Take a quiz and any wrong answers will appear here.</p>' +
            '</div>';
          return container;
        }

        html += '<div class="mistakes-widget__body">';

        groups.forEach(function (group, gi) {
          var qs = group.questions || [];
          html +=
            '<div class="mistakes-topic' + (gi === 0 ? ' is-open' : '') + '">' +
              '<div class="mistakes-topic__head">' +
                '<div class="mistakes-topic__count">' + qs.length + '</div>' +
                '<div class="mistakes-topic__body">' +
                  '<div class="mistakes-topic__name">' + esc(group.topic || 'Uncategorized') + '</div>' +
                  '<div class="mistakes-topic__sub">' +
                    (group.subject ? esc(group.subject) + ' · ' : '') +
                    qs.length + ' missed question' + (qs.length === 1 ? '' : 's') +
                  '</div>' +
                '</div>' +
                '<i class="fa-solid fa-chevron-down mistakes-topic__arrow" aria-hidden="true"></i>' +
              '</div>' +
              '<div class="mistakes-topic__questions">';

          qs.slice(0, 5).forEach(function (q) {
            var opts = Array.isArray(q.options) ? q.options : [];
            var correctLabel = q.correct;
            var correctText = '';
            if (Array.isArray(opts)) {
              var correctOpt = opts.find(function (o) { return o.label === correctLabel; });
              if (correctOpt) correctText = correctOpt.text;
            }

            var selectedLabel = q.selected;
            var selectedText = '';
            if (Array.isArray(opts) && selectedLabel) {
              var selOpt = opts.find(function (o) { return o.label === selectedLabel; });
              if (selOpt) selectedText = selOpt.text;
            }

            html +=
              '<div class="mistakes-q">' +
                '<p class="mistakes-q__text">' + esc(q.question) + '</p>' +
                '<div class="mistakes-q__row">' +
                  '<span class="mistakes-q__label">You chose</span>' +
                  '<span class="mistakes-q__wrong">' +
                    (selectedLabel ? selectedLabel + ' — ' + esc(selectedText) : '(nothing)') +
                  '</span>' +
                '</div>' +
                '<div class="mistakes-q__row">' +
                  '<span class="mistakes-q__label">Correct</span>' +
                  '<span class="mistakes-q__right">' +
                    correctLabel + ' — ' + esc(correctText) +
                  '</span>' +
                '</div>' +
                (q.explanation
                  ? '<div class="mistakes-q__explain">' + esc(q.explanation) + '</div>'
                  : '') +
              '</div>';
          });

          if (qs.length > 5) {
            html += '<p style="text-align:center;color:var(--slate);font-size:0.78rem;margin:8px 0 0">… and ' +
                    (qs.length - 5) + ' more</p>';
          }

          html +=
              '<button type="button" class="mistakes-practice-btn" data-topic="' + esc(group.topic || '') + '">' +
                '<i class="fa-solid fa-dumbbell" aria-hidden="true"></i>' +
                'Practice this topic' +
              '</button>' +
              '</div>' +
            '</div>';
        });

        html += '</div>';
        container.innerHTML = html;

        container.querySelectorAll('.mistakes-topic__head').forEach(function (head) {
          head.addEventListener('click', function () {
            head.parentElement.classList.toggle('is-open');
          });
        });

        container.querySelectorAll('.mistakes-practice-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var topic = btn.getAttribute('data-topic');
            if (!topic) return;
            input.value = 'Give me practice questions on "' + topic + '" — I keep getting these wrong.';
            autoGrow();
            form.requestSubmit();
          });
        });

      } catch (_) {
        container.innerHTML = '<div class="widget-error">Network error.</div>';
      }
      return container;
    }

    /* ============================================================
       addMessage
       ============================================================ */
    function addMessage(role, content, options) {

        else contentEl.textContent = content;

      body.appendChild(contentEl);

      var imageTools = [];
      var cardTools = [];
      var quizTools = [];
      var flashcardTools = [];
      var practiceTools = [];
      var vizTools = [];
      var planTools = [];
      var noteTools = [];
      var theoryTools = [];
      var sketchTools = [];
      var examTools = [];
      var mistakesTools = [];

          else if (t.type === 'flashcards') flashcardTools.push(t);

          else if (t.type === 'studyplan' && t.planId) planTools.push(t);
          else if (t.type === 'notes') noteTools.push(t);
          else if (t.type === 'theory') theoryTools.push(t);
          else if (t.type === 'sketch') sketchTools.push(t);
          else if (t.type === 'exam') examTools.push(t);
          else if (t.type === 'mistakes') mistakesTools.push(t);

        mistakesTools.forEach(function (t) {
          buildInlineMistakes(t).then(function (w) { msWrap.appendChild(w); scrollToBottom(); });

        vizTools.forEach(function (t) {
          buildInlineVisualization(t).then(function (w) { vzWrap.appendChild(w); scrollToBottom(); });

        plWrap.className = 'msg-tools';

        planTools.forEach(function (t) {
          buildInlineStudyPlan(t).then(function (w) { plWrap.appendChild(w); scrollToBottom(); });
        });

      var meta = document.createElement('div');

      if (libraryUsed) {
        var lBadge = document.createElement('span');
        lBadge.className = 'meta-badge meta-badge--library';
        lBadge.innerHTML = '<i class="fa-solid fa-book-open" aria-hidden="true"></i> used library';

      var panel = null;
      if (webSearch && webSearch.sources && webSearch.sources.length) {
        var sBadge = document.createElement('span');
        sBadge.className = 'meta-badge meta-badge--search';
        sBadge.innerHTML = '<i class="fa-solid fa-globe" aria-hidden="true"></i> searched the web';
        meta.appendChild(sBadge);
        var toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'sources-toggle';
        toggleBtn.innerHTML = webSearch.sources.length + ' source' + (webSearch.sources.length === 1 ? '' : 's') + ' <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>';
        meta.appendChild(toggleBtn);
        panel = document.createElement('div');
        panel.className = 'sources-panel';
        var label = document.createElement('div');
        label.className = 'sources-panel__label';
        label.textContent = 'Sources used';
        panel.appendChild(label);
        webSearch.sources.forEach(function (src, i) {
          var item = document.createElement('div');
          item.className = 'source-item';
          var num = document.createElement('div');
          num.className = 'source-item__num';
          num.textContent = String(i + 1);
          var sBody = document.createElement('div');
          sBody.className = 'source-item__body';
          var t = document.createElement('div');
          t.className = 'source-item__title';
          var a = document.createElement('a');
          a.href = src.url || '#'; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = src.title || '(untitled)';
          t.appendChild(a);
          var u = document.createElement('p');
          u.className = 'source-item__url';
          u.textContent = src.url || '';
          sBody.appendChild(t); sBody.appendChild(u);
          item.appendChild(num); item.appendChild(sBody);
          panel.appendChild(item);
        });
        toggleBtn.addEventListener('click', function () {
          panel.classList.toggle('is-visible');
          toggleBtn.classList.toggle('is-open');
        });
      }
      if (meta.children.length) body.appendChild(meta);
      if (panel) body.appendChild(panel);

      row.appendChild(avatar);
      row.appendChild(body);
      innerEl.appendChild(row);
      scrollToBottom();
      return contentEl;
    }

    function addTyping() {
      var row = document.createElement('div');
      row.className = 'msg-row msg-row--ai';
      row.id = 'typing-row';
      row.innerHTML = '<div class="msg-avatar"><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i></div>' +
        '<div class="msg-body"><div class="msg-content"><span class="typing"><span></span><span></span><span></span></span></div></div>';
      innerEl.appendChild(row);
      scrollToBottom();
    }
    function removeTyping() {
      var el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    function scrollToBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }
    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }

    function buildMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) return pop;
      pop = document.createElement('div');
      pop.id = 'mention-popup';
      document.body.appendChild(pop);
      return pop;
    }
    function positionMentionPopup(pop, textarea) {
      var rect = textarea.getBoundingClientRect();
      pop.style.left = rect.left + 'px';
      pop.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
      pop.style.top = 'auto';
    }
    function detectMention() {
      var value = input.value;
      var caret = input.selectionStart;
      var upToCaret = value.slice(0, caret);
      var match = upToCaret.match(/@([A-Za-z][A-Za-z0-9_]*)?$/);
      if (!match) return null;
      var query = (match[1] || '').toLowerCase();
      var start = caret - match[0].length;
      var matches = agents.filter(function (a) { return !query || a.name.toLowerCase().indexOf(query) === 0; });
      if (!matches.length) return null;
      return { start: start, query: query, matches: matches, index: 0 };
    }
    function showMentionPopup(state) {
      var pop = buildMentionPopup();
      positionMentionPopup(pop, input);
      pop.innerHTML = state.matches.map(function (a, i) {
        var active = i === state.index ? 'background:var(--blush);' : '';
        var initial = (a.name || '?').charAt(0).toUpperCase();
        return '<div class="mention-item" data-index="' + i + '" style="' + active + '">' +
          '<div class="mention-item__avatar">' + esc(initial) + '</div>' +
          '<div style="min-width:0">' +
            '<div style="font-weight:600;color:var(--navy)">@' + esc(a.name) + '</div>' +
            '<div style="font-size:0.75rem;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' +
              esc(a.description || a.subject || 'Custom AI') + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      pop.style.display = 'block';
      pop.querySelectorAll('.mention-item').forEach(function (el) {
        el.addEventListener('mousedown', function (e) { e.preventDefault(); selectMention(parseInt(el.getAttribute('data-index'), 10)); });
      });
    }
    function hideMentionPopup() {
      var pop = document.getElementById('mention-popup');
      if (pop) pop.style.display = 'none';
      mentionState = null;
    }
    function selectMention(idx) {
      if (!mentionState) return;
      var agent = mentionState.matches[idx];
      if (!agent) return;
      var value = input.value;
      var before = value.slice(0, mentionState.start);
      var after = value.slice(input.selectionStart);
      var insert = '@' + agent.name + ' ';
      input.value = before + insert + after;
      var newCaret = before.length + insert.length;
      input.setSelectionRange(newCaret, newCaret);
      hideMentionPopup();
      autoGrow(); input.focus();
    }

    function renderAttachStrip() {
      if (!stagedAttachments.length) {
        attachStrip.classList.remove('is-visible');
        attachStrip.innerHTML = '';
        return;
      }
      attachStrip.classList.add('is-visible');
      attachStrip.innerHTML = stagedAttachments.map(function (a) {
        var statusCls = 'attach-chip__status';
        if (a.status === 'ready') statusCls += ' attach-chip__status--ready';
        if (a.status === 'failed') statusCls += ' attach-chip__status--failed';
        var statusLabel = a.status === 'ready' ? 'ready' : a.status === 'failed' ? 'failed' : 'reading…';
        return '<div class="attach-chip" data-id="' + a.id + '">' +
          '<div class="attach-chip__icon"><i class="fa-solid fa-file-lines"></i></div>' +
          '<span class="attach-chip__name">' + esc(a.name) + '</span>' +
          '<span class="' + statusCls + '">' + statusLabel + '</span>' +
          '<button class="attach-chip__remove" data-id="' + a.id + '" type="button" title="Remove">' +
            '<i class="fa-solid fa-xmark"></i>' +
          '</button>' +
        '</div>';
      }).join('');
      attachStrip.querySelectorAll('.attach-chip__remove').forEach(function (btn) {
        btn.addEventListener('click', function () { removeAttachment(btn.getAttribute('data-id')); });
      });
    }

    async function uploadFile(file) {
      var form = new FormData();
      form.append('file', file);
      try {
        var res = await fetch('/api/chat/attachments', { method: 'POST', credentials: 'include', body: form });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { alert(data.error || 'Upload failed.'); return null; }
        return data.attachment;
      } catch (_) { alert('Cannot reach the server.'); return null; }
    }

    async function addFiles(files) {
      for (var i = 0; i < files.length; i++) {
        var att = await uploadFile(files[i]);
        if (!att) continue;
        stagedAttachments.push({ id: att.id, name: att.original_name, status: att.extraction_status || 'pending' });
        renderAttachStrip();
        pollAttachment(att.id);
      }
    }

    async function pollAttachment(id) {
      for (var i = 0; i < 30; i++) {
        await new Promise(function (r) { setTimeout(r, 2000); });
        try {
          var res = await fetch('/api/chat/attachments/' + id, { credentials: 'include' });
          if (!res.ok) return;
          var data = await res.json();
          var staged = stagedAttachments.find(function (a) { return a.id === id; });
          if (!staged) return;
          staged.status = data.extraction_status;
          renderAttachStrip();
          if (data.extraction_status === 'ready' || data.extraction_status === 'failed') return;
        } catch (_) { return; }
      }
    }

    async function removeAttachment(id) {
      try { await fetch('/api/chat/attachments/' + id, { method: 'DELETE', credentials: 'include' }); } catch (_) {}
      stagedAttachments = stagedAttachments.filter(function (a) { return a.id !== id; });
      renderAttachStrip();
    }

    attachBtn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function (e) {
      if (e.target.files && e.target.files.length) addFiles(Array.from(e.target.files));
      fileInput.value = '';
    });

    var dragCounter = 0;
    document.addEventListener('dragenter', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.types) return;
      if (e.dataTransfer.types.indexOf('Files') === -1) return;
      e.preventDefault();
      dragCounter++;
      if (dragCounter === 1) dragOverlay.classList.add('is-visible');
    });
    document.addEventListener('dragover', function (e) {
      if (e.dataTransfer && e.dataTransfer.types.indexOf('Files') !== -1) e.preventDefault();
    });
    document.addEventListener('dragleave', function () {
      dragCounter--;
      if (dragCounter <= 0) { dragCounter = 0; dragOverlay.classList.remove('is-visible'); }
    });
    document.addEventListener('drop', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      dragCounter = 0;
      dragOverlay.classList.remove('is-visible');
      addFiles(Array.from(e.dataTransfer.files));
    });

    function setMicState(state) {
      if (state === 'recording') {
        micBtn.classList.add('is-recording');
        micIcon.className = 'fa-solid fa-stop';
        micBtn.title = 'Stop recording';
        micBtn.disabled = false;
        recBanner.classList.add('is-visible');
      } else if (state === 'transcribing') {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-spinner fa-spin';
        micBtn.title = 'Transcribing…';
        micBtn.disabled = true;
        recBanner.classList.remove('is-visible');
      } else {
        micBtn.classList.remove('is-recording');
        micIcon.className = 'fa-solid fa-microphone';
        micBtn.title = 'Voice input';
        micBtn.disabled = false;
        recBanner.classList.remove('is-visible');
      }
    }
    function pickMimeType() {
      var opts = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
      if (!window.MediaRecorder) return null;
      for (var i = 0; i < opts.length; i++) if (MediaRecorder.isTypeSupported(opts[i])) return opts[i];
      return '';
    }
    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Your browser does not support microphone access.'); return; }
      try { mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (err) { alert('Could not access the microphone: ' + err.message); return; }
      var mimeType = pickMimeType();
      try {
        mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType: mimeType }) : new MediaRecorder(mediaStream);
      } catch (err) { stopStream(); alert('Could not start recording.'); return; }
      audioChunks = [];
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) audioChunks.push(e.data); };
      mediaRecorder.onstop = onRecordingStop;
      mediaRecorder.start();
      recordingStart = Date.now();
      updateRecordingTime();
      recordingTimer = setInterval(updateRecordingTime, 1000);
      setMicState('recording');
    }
    function updateRecordingTime() {
      var s = Math.floor((Date.now() - recordingStart) / 1000);
      var m = Math.floor(s / 60);
      var sec = s - m * 60;
      recTime.textContent = m + ':' + (sec < 10 ? '0' : '') + sec;
      if (s >= 120) stopRecording();
    }
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    }
    function stopStream() {
      if (mediaStream) { mediaStream.getTracks().forEach(function (t) { t.stop(); }); mediaStream = null; }
    }
    async function onRecordingStop() {
      stopStream();
      if (Date.now() - recordingStart < 500) { setMicState('idle'); return; }
      var mimeType = mediaRecorder.mimeType || 'audio/webm';
      var blob = new Blob(audioChunks, { type: mimeType });
      audioChunks = [];
      if (blob.size < 1000) { setMicState('idle'); alert('Recording was too short.'); return; }
      await sendAudio(blob);
    }
    async function sendAudio(blob) {
      setMicState('transcribing');
      var form = new FormData();
      form.append('audio', blob, 'recording.webm');
      try {
        var res = await fetch('/api/voice/transcribe', { method: 'POST', credentials: 'include', body: form });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) { alert(data.error || 'Could not transcribe.'); setMicState('idle'); return; }
        var existing = input.value;
        var spacer = existing && !/\s$/.test(existing) ? ' ' : '';
        input.value = existing + spacer + data.text;
        autoGrow(); input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      } catch (_) { alert('Could not reach the server.'); }
      finally { setMicState('idle'); }
    }

    function clearChat() { innerEl.innerHTML = ''; history = []; }

    function startNewConversation() {
      currentConversation = null;
      clearChat();
      renderEmpty();
      renderSidebarSlot();
      input.focus();
    }

    async function openConversation(conv) {
      currentConversation = conv;
      clearChat();
      var data = await apiLoad(conv.id);
      if (!data) { startNewConversation(); return; }
      if (!data.messages || !data.messages.length) {
        renderEmpty();
      } else {
        for (var i = 0; i < data.messages.length; i++) {
          var m = data.messages[i];
          var media = m.media || null;
          addMessage(m.role, m.content, {
            provider: m.provider,
            images: (media && media.images) ? media.images : null,
            tools: (media && media.tools) ? media.tools : null,
            webSearch: (media && media.webSearch) ? media.webSearch : null,
          });
          history.push({ role: m.role, content: m.content });
        }
      }
      renderSidebarSlot();
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text && !stagedAttachments.length) return;

      var attachedNow = stagedAttachments.slice();
      addMessage('user', text || '(attached file)', {
        attachments: attachedNow.map(function (a) { return { name: a.name }; }),
      });
      history.push({ role: 'user', content: text || '(see attached file)' });

      var attachmentIds = stagedAttachments.map(function (a) { return a.id; });
      stagedAttachments = [];
      renderAttachStrip();

      input.value = '';
      autoGrow();
      sendBtn.disabled = true;
      input.disabled = true;
      addTyping();

      try {
        var res = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            messages: history,
            conversationId: currentConversation ? currentConversation.id : null,
            attachmentIds: attachmentIds,
          }),
        });
        var data = await res.json().catch(function () { return {}; });
        removeTyping();
        if (!res.ok) { addMessage('ai', data.error || 'Something went wrong.'); return; }
        addMessage('ai', data.reply, {
          provider: data.provider,
          agentName: data.agent ? data.agent.name : null,
          webSearch: data.webSearch || null,
          libraryUsed: !!data.libraryUsed,
          images: data.images || null,
          tools: data.tools || null,
        });
        history.push({ role: 'assistant', content: data.reply });

        if (!currentConversation && data.conversationId) {
          conversationList = await apiList();
          var created = conversationList.find(function (c) { return c.id === data.conversationId; });
          if (created) currentConversation = created;
          renderSidebarSlot();
        } else if (currentConversation) {
          conversationList = await apiList();
          var still = conversationList.find(function (c) { return c.id === currentConversation.id; });
          if (still) currentConversation = still;
          renderSidebarSlot();
        }
      } catch (err) {
        removeTyping();
        addMessage('ai', 'Cannot reach the server.');
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('input', function () {
      autoGrow();
      var state = detectMention();
      if (state) { mentionState = state; showMentionPopup(state); }
      else { hideMentionPopup(); }
    });

    input.addEventListener('keydown', function (e) {
      if (mentionState && mentionState.matches.length > 0) {
        if (e.key === 'ArrowDown') { e.preventDefault(); mentionState.index = (mentionState.index + 1) % mentionState.matches.length; showMentionPopup(mentionState); return; }
        if (e.key === 'ArrowUp')   { e.preventDefault(); mentionState.index = (mentionState.index - 1 + mentionState.matches.length) % mentionState.matches.length; showMentionPopup(mentionState); return; }
        if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); selectMention(mentionState.index); return; }
        if (e.key === 'Escape') { hideMentionPopup(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    input.addEventListener('blur', function () { setTimeout(hideMentionPopup, 150); });

    micBtn.addEventListener('click', function () {
      if (micBtn.disabled) return;
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
      else startRecording();
    });

    document.getElementById('modal-cancel').addEventListener('click', closeDeleteModal);
    document.getElementById('modal-delete').addEventListener('click', function (e) {
      if (e.target.id === 'modal-delete') closeDeleteModal();
    });
    document.getElementById('modal-confirm').addEventListener('click', async function () {
      if (!pendingDeleteId) return;
      var id = pendingDeleteId;
      closeDeleteModal();
      var ok = await apiDelete(id);
      if (!ok) return;
      conversationList = conversationList.filter(function (c) { return c.id !== id; });
      if (currentConversation && currentConversation.id === id) {
        if (conversationList.length > 0) await openConversation(conversationList[0]);
        else startNewConversation();
      } else renderSidebarSlot();
    });

    (async function init() {
      var ok = await ensureLoggedIn();
      if (!ok) return;
      await loadAgents();
      conversationList = await apiList();
      renderSidebarSlot();
      if (conversationList.length > 0) {
        await openConversation(conversationList[0]);
      } else {
        startNewConversation();
      }
    })();
  })();
</script>
</body>
</html>
