<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualization — Studying Lab</title>
<link rel="stylesheet" href="../assets/shell.css">
<style>
  .page-inner, .viz-inner, .fc-inner, .pr-inner, .sp-inner, .qh-inner, .exam-inner { max-width: 1440px; }
  .viz-inner { max-width: 1440px; }
  .setup-card { padding: 28px; }
  .setup-field { margin-bottom: 18px; }
  .setup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .setup-actions { display: flex; justify-content: flex-end; margin-top: 8px; }

  .desc-input {
    width: 100%;
    resize: vertical;
    min-height: 62px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 0.92rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    color: var(--ink);
  }
  .desc-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,149,46,0.12);
  }

  .generating { text-align: center; padding: 60px 20px; }
  .generating__spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--blush-deep);
    border-top-color: var(--red);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .generating__text { font-family: var(--font-head); color: var(--navy); font-size: 1.1rem; margin: 0; }

  .viz-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .viz-title { font-family: var(--font-head); font-size: 1.3rem; font-weight: 600; color: var(--navy); margin: 0; }
  .viz-kind { font-family: var(--font-ui); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; background: var(--gold); color: var(--navy); padding: 4px 10px; border-radius: 999px; font-weight: 600; }

  .viz-canvas {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    min-height: 240px;
    overflow-x: auto;
    display: grid;
    place-items: center;
    margin-bottom: 16px;
  }
  .viz-canvas svg { max-width: 100%; height: auto; }

  .viz-explanation {
    background: #EEF3FB;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--navy);
    margin-bottom: 20px;
  }

  .viz-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

  .viz-error {
    background: #FDECEC;
    color: var(--deep-red);
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 0.9rem;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .photo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; width: 100%; }
  .photo-cell { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--blush); }
  .photo-cell img { width: 100%; height: 160px; object-fit: cover; display: block; transition: transform 300ms var(--ease-out); }
  .photo-cell:hover img { transform: scale(1.05); }
  .photo-cell__credit {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    color: var(--white);
    font-family: var(--font-ui); font-size: 0.6rem;
    padding: 20px 8px 5px; letter-spacing: 0.04em;
    pointer-events: none;
  }
  .photo-cell__download {
    position: absolute; top: 8px; right: 8px;
    width: 34px; height: 34px;
    border-radius: 9px;
    background: rgba(17,16,74,0.75);
    color: var(--white);
    border: none; cursor: pointer;
    display: grid; place-items: center;
    font-size: 0.85rem; opacity: 0;
    transition: opacity var(--transition), background var(--transition), transform 120ms var(--ease);
    z-index: 3;
    backdrop-filter: blur(6px);
  }
  .photo-cell:hover .photo-cell__download { opacity: 1; }
  .photo-cell__download:hover { background: var(--red); transform: scale(1.08); }
  .photo-cell__download:active { transform: scale(0.95); }

  @media (max-width: 860px) {
    .setup-row { grid-template-columns: 1fr; }
    .viz-canvas { padding: 20px 12px; }
  }
  @media (max-width: 640px) {
    .photo-cell__download { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="page">
      <div class="page-scroll">
        <div class="page-inner viz-inner">

          <header class="page-header">
            <div>
              <h1 class="page-header__title">Visualization</h1>
              <p class="page-header__sub">Turn any topic into a diagram, a real photo, or an AI-generated illustration.</p>
            </div>
          </header>

          <div id="stage-setup">
            <div class="card setup-card">
              <div class="setup-field">
                <label class="label" for="topic">Topic or process</label>
                <input class="input" type="text" id="topic"
                       placeholder="e.g. Mitosis, Water cycle, Photosynthesis, Newton's laws">
              </div>
              <div class="setup-field">
                <label class="label" for="kind">Visualization type</label>
                <select class="input" id="kind">
                  <option value="">Auto (AI chooses)</option>
                  <option value="flowchart">Flowchart</option>
                  <option value="sequence">Sequence</option>
                  <option value="mindmap">Mind map</option>
                  <option value="class">Class diagram</option>
                  <option value="state">State diagram</option>
                  <option value="timeline">Timeline</option>
                  <option value="__generate__">🎨 AI-generated image</option>
                  <option value="__search__">📷 Real photos from the web</option>
                </select>
              </div>
              <div class="setup-field">
                <label class="label" for="description">Note for the AI (optional)</label>
                <textarea class="desc-input" id="description" rows="2"
                          placeholder="e.g. Keep it simple and focus on the stages only — I'm confused about the order"></textarea>
                <p style="font-size:0.76rem;color:var(--slate);margin:6px 0 0">
                  This guides the diagram. It is not saved.
                </p>
              </div>
              <div class="setup-actions">
                <button class="btn btn-primary" id="gen-btn" type="button">
                  <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
                  Generate
                </button>
              </div>
            </div>
          </div>

          <div id="stage-generating" style="display:none">
            <div class="card generating">
              <div class="generating__spinner"></div>
              <p class="generating__text">Working on it…</p>
            </div>
          </div>

          <div id="stage-result" style="display:none">
            <div class="viz-header">
              <h2 class="viz-title" id="viz-title">—</h2>
              <span class="viz-kind" id="viz-kind">flowchart</span>
            </div>

            <div class="viz-error" id="viz-error" style="display:none"></div>

            <div class="viz-canvas" id="viz-canvas"></div>

            <div class="viz-explanation" id="viz-explanation" style="display:none"></div>

            <div class="viz-actions">
              <button class="btn btn-ghost" id="new-btn" type="button">
                <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
                New
              </button>
              <button class="btn btn-ghost" id="copy-btn" type="button">
                <i class="fa-solid fa-code" aria-hidden="true"></i>
                Copy Mermaid code
              </button>
              <button class="btn btn-primary" id="download-btn" type="button">
                <i class="fa-solid fa-download" aria-hidden="true"></i>
                Download
              </button>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="../assets/shell.js"></script>
<script>
  (function () {
    'use strict';

    var stages = {
      setup:      document.getElementById('stage-setup'),
      generating: document.getElementById('stage-generating'),
      result:     document.getElementById('stage-result'),
    };

    function showStage(name) {
      Object.keys(stages).forEach(function (k) {
        stages[k].style.display = (k === name) ? '' : 'none';
      });
    }

    var current = null;

    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        themeVariables: {
          primaryColor: '#FBEFEF',
          primaryTextColor: '#1E1D3D',
          primaryBorderColor: '#11104A',
          lineColor: '#5B5A6B',
          fontFamily: 'Work Sans, sans-serif',
          fontSize: '14px',
        },
        securityLevel: 'strict',
      });
    }

    function toast(msg, isError) {
      var t = document.createElement('div');
      t.className = 'toast' + (isError ? ' toast--error' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 2400);
    }

    async function guard() {
      var res = await fetch('/api/auth/me', { credentials: 'include' });
      if (res.status === 401) { window.location.href = '../index.html'; return false; }
      return true;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function setHeader(title, kindLabel) {
      document.getElementById('viz-title').textContent = title;
      document.getElementById('viz-kind').textContent = kindLabel;
    }

    function resetCanvas() {
      var canvas = document.getElementById('viz-canvas');
      canvas.innerHTML = '';
      canvas.style.display = 'grid';
      document.getElementById('viz-error').style.display = 'none';
      var expl = document.getElementById('viz-explanation');
      expl.style.display = 'none';
      expl.textContent = '';
    }

    function triggerDownload(blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadImageFromUrl(url, baseName) {
      var name = String(baseName || 'image')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 40) || 'image';
      var ext = (url.split('.').pop() || 'jpg').split('?')[0].toLowerCase();
      if (ext.length > 5 || !/^[a-z]+$/.test(ext)) ext = 'jpg';

      fetch(url, { credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('fetch failed');
          return r.blob();
        })
        .then(function (blob) {
          triggerDownload(blob, name + '.' + ext);
          toast('Downloading…');
        })
        .catch(function () {
          window.open(url, '_blank', 'noopener');
        });
    }

    async function generate() {
      var topic = document.getElementById('topic').value.trim();
      if (!topic) { toast('Please enter a topic.', true); return; }
      var kind = document.getElementById('kind').value || null;
      var description = document.getElementById('description').value.trim() || null;

      showStage('generating');
      document.querySelector('.generating__text').textContent = 'Working on it…';

      if (kind === '__generate__') {
        document.querySelector('.generating__text').textContent = 'Drawing your image…';
        try {
          var r = await fetch('/api/tools/imagegen/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ prompt: topic, model: 'flux', width: 1024, height: 1024 }),
          });
          var d = await r.json().catch(function () { return {}; });
          if (!r.ok) {
            toast(d.error || 'Could not generate image.', true);
            showStage('setup');
            return;
          }
          current = { kind: 'generated-image', title: topic, imageUrl: d.image.url };
          renderGeneratedImage(current);
          showStage('result');
        } catch (_) {
          toast('Cannot reach the server.', true);
          showStage('setup');
        }
        return;
      }

      if (kind === '__search__') {
        document.querySelector('.generating__text').textContent = 'Searching for photos…';
        try {
          var r2 = await fetch('/api/tools/imagesearch/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ query: topic, count: 12 }),
          });
          var d2 = await r2.json().catch(function () { return {}; });
          if (!r2.ok) {
            toast(d2.error || 'Could not search images.', true);
            showStage('setup');
            return;
          }
          current = { kind: 'search-results', title: topic, images: d2.images };
          renderSearchResults(current);
          showStage('result');
        } catch (_) {
          toast('Cannot reach the server.', true);
          showStage('setup');
        }
        return;
      }

      document.querySelector('.generating__text').textContent = 'Generating your diagram…';
      try {
        var res = await fetch('/api/tools/visualization/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ topic: topic, kind: kind, description: description }),
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          toast(data.error || 'Could not generate.', true);
          showStage('setup');
          return;
        }
        current = data.visualization;
        await renderMermaid(current);
        showStage('result');
      } catch (_) {
        toast('Cannot reach the server.', true);
        showStage('setup');
      }
    }

    async function renderMermaid(viz) {
      resetCanvas();
      setHeader(viz.title || 'Diagram', viz.kind || 'flowchart');

      var expl = document.getElementById('viz-explanation');
      if (viz.explanation) {
        expl.textContent = viz.explanation;
        expl.style.display = '';
      }

      var canvas = document.getElementById('viz-canvas');
      canvas.innerHTML = '<div style="color:var(--slate);font-size:0.9rem">Rendering…</div>';

      try {
        var id = 'viz-' + Date.now();
        var result = await window.mermaid.render(id, viz.mermaid);
        canvas.innerHTML = result.svg;
      } catch (err) {
        canvas.innerHTML = '';
        var errBox = document.getElementById('viz-error');
        errBox.style.display = '';
        errBox.innerHTML =
          '<strong>Could not render this diagram.</strong><br>' +
          'The AI produced invalid Mermaid syntax.<br><br>' +
          '<pre style="background:#fff;padding:10px;border-radius:8px;overflow-x:auto;font-size:0.78rem;margin:0">' +
          escapeHtml(viz.mermaid) + '</pre>';
      }
    }

    function renderGeneratedImage(v) {
      resetCanvas();
      setHeader(v.title, 'AI image');
      var canvas = document.getElementById('viz-canvas');
      canvas.style.display = 'block';
      canvas.innerHTML = '<img src="' + v.imageUrl + '" alt="' + escapeHtml(v.title) + '" ' +
        'style="max-width:100%;border-radius:16px;box-shadow:var(--shadow-lg);display:block;margin:0 auto">';
    }

    function renderSearchResults(v) {
      resetCanvas();
      setHeader(v.title, 'photos');
      var canvas = document.getElementById('viz-canvas');
      canvas.style.display = 'block';

      if (!v.images || !v.images.length) {
        canvas.innerHTML = '<div style="color:var(--slate);padding:20px;text-align:center">No photos found. Try a different topic.</div>';
        return;
      }

      canvas.innerHTML = '<div class="photo-grid">' + v.images.map(function (img, idx) {
        var credit = img.author
          ? '<div class="photo-cell__credit">Photo by ' + escapeHtml(img.author) + ' · Pexels</div>'
          : '';
        return (
          '<div class="photo-cell" data-idx="' + idx + '">' +
            '<a href="' + img.url + '" target="_blank" rel="noopener noreferrer" style="display:block">' +
              '<img src="' + img.thumb + '" alt="' + escapeHtml(img.alt || '') + '" loading="lazy">' +
            '</a>' +
            '<button class="photo-cell__download" data-idx="' + idx + '" type="button" title="Download photo" aria-label="Download photo">' +
              '<i class="fa-solid fa-download" aria-hidden="true"></i>' +
            '</button>' +
            credit +
          '</div>'
        );
      }).join('') + '</div>';

      canvas.querySelectorAll('.photo-cell__download').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          var idx = parseInt(btn.getAttribute('data-idx'), 10);
          var img = v.images[idx];
          if (!img) return;
          downloadImageFromUrl(img.url, img.alt || img.author || 'photo');
        });
      });
    }

    function copyCode() {
      if (!current || !current.mermaid) { toast('Nothing to copy.', true); return; }
      navigator.clipboard.writeText(current.mermaid).then(function () {
        toast('Mermaid code copied.');
      }).catch(function () {
        toast('Copy failed.', true);
      });
    }

    function downloadCurrent() {
      if (!current) { toast('Nothing to download.', true); return; }

      var svg = document.querySelector('#viz-canvas svg');
      if (svg) {
        var data = new XMLSerializer().serializeToString(svg);
        var blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
        triggerDownload(blob, (current.title || 'diagram').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.svg');
        toast('Downloading diagram…');
        return;
      }

      if (current.kind === 'generated-image' && current.imageUrl) {
        downloadImageFromUrl(current.imageUrl, current.title || 'image');
        return;
      }

      if (current.kind === 'search-results' && current.images && current.images.length) {
        toast('Downloading ' + current.images.length + ' photos…');
        current.images.forEach(function (img, i) {
          setTimeout(function () {
            downloadImageFromUrl(img.url, (current.title || 'photo') + '-' + (i + 1));
          }, i * 300);
        });
        return;
      }

      toast('Nothing to download.', true);
    }

    document.getElementById('gen-btn').addEventListener('click', generate);
    document.getElementById('new-btn').addEventListener('click', function () {
      current = null;
      showStage('setup');
    });
    document.getElementById('copy-btn').addEventListener('click', copyCode);
    document.getElementById('download-btn').addEventListener('click', downloadCurrent);

    document.getElementById('topic').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); generate(); }
    });

    (async function init() {
      if (!(await guard())) return;
      showStage('setup');
      document.getElementById('topic').focus();
    })();
  })();
</script>
</body>
</html>
