<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics — Admin</title>
<link rel="stylesheet" href="../assets/shell.css">
<style>
  .an-page { max-width: 1100px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .stat-card__value {
    font-family: var(--font-head);
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--navy);
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-card__label {
    font-family: var(--font-ui);
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate);
  }

  .chart-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .chart-title {
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--navy);
    margin: 0 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .chart-title small {
    font-family: var(--font-ui);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--slate);
    font-weight: 400;
  }

  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 180px;
    padding-bottom: 24px;
    position: relative;
    border-bottom: 1px solid var(--border);
  }
  .bar-wrap {
    flex: 1;
    min-width: 4px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    position: relative;
    cursor: pointer;
  }
  .bar {
    width: 100%;
    background: linear-gradient(to top, var(--navy), var(--soft-navy));
    border-radius: 3px 3px 0 0;
    min-height: 2px;
    transition: background var(--transition);
  }
  .bar-wrap:hover .bar {
    background: linear-gradient(to top, var(--red), var(--deep-red));
  }
  .bar-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%) rotate(-45deg);
    transform-origin: center;
    font-family: var(--font-ui);
    font-size: 0.6rem;
    color: var(--slate);
    white-space: nowrap;
    opacity: 0.7;
  }
  .bar-tooltip {
    position: absolute;
    top: -32px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy);
    color: var(--white);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-family: var(--font-ui);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition);
    white-space: nowrap;
  }
  .bar-wrap:hover .bar-tooltip { opacity: 1; }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 780px) { .two-col { grid-template-columns: 1fr; } }

  .row-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .row-item:last-child { border-bottom: none; }
  .row-item__rank {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--blush-deep);
    color: var(--navy);
    display: grid; place-items: center;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.72rem;
    flex-shrink: 0;
  }
  .row-item__body { flex: 1; min-width: 0; }
  .row-item__title {
    font-weight: 500;
    color: var(--ink);
    font-size: 0.9rem;
    margin: 0 0 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-item__sub {
    font-size: 0.75rem;
    color: var(--slate);
    margin: 0;
  }
  .row-item__value {
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--navy);
    flex-shrink: 0;
  }

  .provider-bar {
    height: 8px;
    background: var(--blush-deep);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .provider-bar__fill {
    height: 100%;
    background: var(--red);
    border-radius: 4px;
  }

  .activity-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 0.85rem;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    margin-top: 7px;
    flex-shrink: 0;
  }
  .activity-dot--assistant { background: var(--gold); }
  .activity-body { flex: 1; min-width: 0; }
  .activity-title {
    color: var(--ink);
    margin: 0 0 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .activity-meta {
    font-size: 0.72rem;
    color: var(--slate);
    font-family: var(--font-ui);
  }

  .empty-state-small {
    padding: 32px;
    text-align: center;
    color: var(--slate);
    font-size: 0.88rem;
  }
</style>
</head>
<body>
  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="page">
      <div class="page-scroll">
        <div class="page-inner an-page">

          <header class="page-header">
            <div>
              <h1 class="page-header__title">Analytics</h1>
              <p class="page-header__sub">
                How the platform is being used. Data is live.
              </p>
            </div>
            <button class="btn btn-ghost" id="refresh-btn" type="button">
              <i class="fa-solid fa-rotate" aria-hidden="true"></i> Refresh
            </button>
          </header>

          <section class="stat-grid" id="summary">
            <div class="stat-card"><div class="stat-card__value" id="t-users">—</div><div class="stat-card__label">Users</div></div>
            <div class="stat-card"><div class="stat-card__value" id="t-convs">—</div><div class="stat-card__label">Conversations</div></div>
            <div class="stat-card"><div class="stat-card__value" id="t-msgs">—</div><div class="stat-card__label">Messages</div></div>
            <div class="stat-card"><div class="stat-card__value" id="t-quiz">—</div><div class="stat-card__label">Quiz attempts</div></div>
            <div class="stat-card"><div class="stat-card__value" id="t-cards">—</div><div class="stat-card__label">Flashcard reviews</div></div>
            <div class="stat-card"><div class="stat-card__value" id="t-docs">—</div><div class="stat-card__label">Documents</div></div>
            <div class="stat-card"><div class="stat-card__value" id="t-chunks">—</div><div class="stat-card__label">Chunks</div></div>
            <div class="stat-card"><div class="stat-card__value" id="t-agents">—</div><div class="stat-card__label">Custom AIs</div></div>
          </section>

          <div class="chart-card">
            <h3 class="chart-title">Messages per day <small>last 30 days</small></h3>
            <div class="bar-chart" id="msg-chart">
              <div class="empty-state-small">Loading…</div>
            </div>
          </div>

          <div class="two-col">
            <div class="chart-card">
              <h3 class="chart-title">Provider usage</h3>
              <div id="providers-list">
                <div class="empty-state-small">Loading…</div>
              </div>
            </div>

            <div class="chart-card">
              <h3 class="chart-title">Top quiz topics</h3>
              <div id="topics-list">
                <div class="empty-state-small">Loading…</div>
              </div>
            </div>
          </div>

          <div class="chart-card">
            <h3 class="chart-title">Recent activity</h3>
            <div id="activity-list">
              <div class="empty-state-small">Loading…</div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

<script src="../assets/shell.js"></script>
<script>
  (function () {
    'use strict';

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function fmtTime(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }

    async function guard() {
      var res = await fetch('/api/auth/me', { credentials: 'include' });
      if (res.status === 401) { window.location.href = '../index.html'; return false; }
      var data = await res.json();
      if (!data.user || data.user.role !== 'admin') {
        window.location.href = '../chat.html';
        return false;
      }
      return true;
    }

    async function loadSummary() {
      try {
        var res = await fetch('/api/admin/analytics/summary', { credentials: 'include' });
        if (!res.ok) return;
        var s = await res.json();
        document.getElementById('t-users').textContent  = s.users ?? 0;
        document.getElementById('t-convs').textContent  = s.conversations ?? 0;
        document.getElementById('t-msgs').textContent   = s.messages ?? 0;
        document.getElementById('t-quiz').textContent   = s.quiz_attempts ?? 0;
        document.getElementById('t-cards').textContent  = s.flashcard_reviews ?? 0;
        document.getElementById('t-docs').textContent   = s.documents ?? 0;
        document.getElementById('t-chunks').textContent = s.chunks ?? 0;
        document.getElementById('t-agents').textContent = s.agents ?? 0;
      } catch (_) {}
    }

    async function loadMessageChart() {
      var chart = document.getElementById('msg-chart');
      try {
        var res = await fetch('/api/admin/analytics/messages-by-day?days=30',
          { credentials: 'include' });
        if (!res.ok) { chart.innerHTML = '<div class="empty-state-small">Could not load.</div>'; return; }
        var d = await res.json();
        var data = d.data || [];

        if (!data.length) {
          chart.innerHTML = '<div class="empty-state-small">No messages in the last 30 days.</div>';
          return;
        }

        // Fill in missing days with 0
        var map = {};
        for (var row of data) map[row.day] = row.count;
        var today = new Date();
        var series = [];
        for (var i = 29; i >= 0; i--) {
          var day = new Date(today.getTime() - i * 86400000);
          var key = day.toISOString().slice(0, 10);
          series.push({ day: key, count: map[key] || 0 });
        }

        var max = Math.max(1, ...series.map(function (s) { return s.count; }));
        chart.innerHTML = series.map(function (s) {
          var pct = Math.max(2, Math.round((s.count / max) * 100));
          var label = s.day.slice(5);   // MM-DD
          return (
            '<div class="bar-wrap">' +
              '<div class="bar-tooltip">' + s.count + ' on ' + s.day + '</div>' +
              '<div class="bar" style="height:' + pct + '%"></div>' +
              '<div class="bar-label">' + label + '</div>' +
            '</div>'
          );
        }).join('');
      } catch (_) {
        chart.innerHTML = '<div class="empty-state-small">Error loading chart.</div>';
      }
    }

    async function loadProviders() {
      var list = document.getElementById('providers-list');
      try {
        var res = await fetch('/api/admin/analytics/providers', { credentials: 'include' });
        if (!res.ok) return;
        var d = await res.json();
        var providers = d.providers || [];

        if (!providers.length) {
          list.innerHTML = '<div class="empty-state-small">No AI responses recorded yet.</div>';
          return;
        }

        var total = providers.reduce(function (a, p) { return a + p.count; }, 0);
        list.innerHTML = providers.map(function (p) {
          var pct = total ? Math.round((p.count / total) * 100) : 0;
          return (
            '<div class="row-item">' +
              '<div class="row-item__body">' +
                '<div class="row-item__title">' + esc(p.provider) + '</div>' +
                '<div class="provider-bar"><div class="provider-bar__fill" style="width:' + pct + '%"></div></div>' +
              '</div>' +
              '<div class="row-item__value">' + p.count + ' (' + pct + '%)</div>' +
            '</div>'
          );
        }).join('');
      } catch (_) {
        list.innerHTML = '<div class="empty-state-small">Error loading.</div>';
      }
    }

    async function loadTopics() {
      var list = document.getElementById('topics-list');
      try {
        var res = await fetch('/api/admin/analytics/topics', { credentials: 'include' });
        if (!res.ok) return;
        var d = await res.json();
        var topics = d.topics || [];

        if (!topics.length) {
          list.innerHTML = '<div class="empty-state-small">No quizzes taken yet.</div>';
          return;
        }

        list.innerHTML = topics.map(function (t, i) {
          return (
            '<div class="row-item">' +
              '<div class="row-item__rank">' + (i + 1) + '</div>' +
              '<div class="row-item__body">' +
                '<div class="row-item__title">' + esc(t.topic) + '</div>' +
                '<div class="row-item__sub">' + t.quiz_count + ' quizzes · ' + t.attempt_count + ' attempts</div>' +
              '</div>' +
              '<div class="row-item__value">' + t.quiz_count + '</div>' +
            '</div>'
          );
        }).join('');
      } catch (_) {
        list.innerHTML = '<div class="empty-state-small">Error loading.</div>';
      }
    }

    async function loadActivity() {
      var list = document.getElementById('activity-list');
      try {
        var res = await fetch('/api/admin/analytics/recent?limit=15', { credentials: 'include' });
        if (!res.ok) return;
        var d = await res.json();
        var activity = d.activity || [];

        if (!activity.length) {
          list.innerHTML = '<div class="empty-state-small">No activity yet.</div>';
          return;
        }

        list.innerHTML = activity.map(function (a) {
          var dotCls = a.role === 'assistant' ? 'activity-dot activity-dot--assistant' : 'activity-dot';
          var who = a.user_name || a.user_email || 'unknown';
          var title = a.conversation_title || 'Untitled';
          return (
            '<div class="activity-item">' +
              '<div class="' + dotCls + '"></div>' +
              '<div class="activity-body">' +
                '<div class="activity-title">' + esc(title) + '</div>' +
                '<div class="activity-meta">' + esc(who) + ' · ' + a.role +
                  (a.provider ? ' via ' + esc(a.provider) : '') +
                  ' · ' + fmtDate(a.created_at) + ' ' + fmtTime(a.created_at) + '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      } catch (_) {
        list.innerHTML = '<div class="empty-state-small">Error loading.</div>';
      }
    }

    async function loadAll() {
      await Promise.all([
        loadSummary(),
        loadMessageChart(),
        loadProviders(),
        loadTopics(),
        loadActivity(),
      ]);
    }

    document.getElementById('refresh-btn').addEventListener('click', loadAll);

    (async function init() {
      if (!(await guard())) return;
      await loadAll();
    })();
  })();
</script>
</body>
</html>
