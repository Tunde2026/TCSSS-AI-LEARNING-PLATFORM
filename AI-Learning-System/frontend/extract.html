<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extract Text from Image — AI Learning Platform</title>
<link rel="icon" type="image/png" href="/uploads/branding/logo.png">
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<style>
  .ex-hero { background: linear-gradient(135deg, #11104A, #201F6B 50%, #3D1F5C); color: #fff; border-radius: 20px; padding: 32px 28px; margin-bottom: 22px; text-align: center; box-shadow: 0 16px 40px rgba(17,16,74,0.28); }
  .ex-hero__title { font-family: var(--font-head); font-size: 1.7rem; margin: 0 0 8px; font-weight: 600; letter-spacing: -0.02em; }
  .ex-hero__sub { font-size: 0.94rem; color: rgba(255,255,255,0.85); margin: 0 0 22px; }
  .ex-drop {
    border: 3px dashed rgba(255,255,255,0.35); border-radius: 16px;
    padding: 40px 20px; cursor: pointer; transition: all 220ms ease;
    background: rgba(255,255,255,0.06);
  }
  .ex-drop:hover, .ex-drop.is-drag { border-color: var(--gold); background: rgba(255,255,255,0.12); }
  .ex-drop__icon { font-size: 2.4rem; color: var(--gold); margin-bottom: 10px; display: block; }
  .ex-drop__text { font-size: 1rem; font-weight: 600; }
  .ex-drop__hint { font-size: 0.82rem; opacity: 0.7; margin-top: 6px; }
  .ex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .ex-grid { grid-template-columns: 1fr; } }
  .ex-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; }
  .ex-card__head { padding: 14px 18px; background: var(--blush); font-family: var(--font-ui); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .ex-card__head i { color: var(--gold); }
  .ex-card__body { padding: 18px; }
  .ex-preview { max-width: 100%; max-height: 460px; border-radius: 10px; box-shadow: 0 6px 18px rgba(17,16,74,0.14); display: block; margin: 0 auto; }
  .ex-text { font-family: var(--font-body); font-size: 0.94rem; line-height: 1.7; color: var(--ink); white-space: pre-wrap; word-wrap: break-word; min-height: 200px; padding: 14px; background: var(--blush); border-radius: 10px; }
  .ex-text:empty::before { content: 'Extracted text will appear here…'; color: var(--slate); opacity: 0.7; }
  .ex-actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .ex-btn { padding: 10px 18px; border-radius: 999px; border: none; font-family: var(--font-body); font-size: 0.86rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform 120ms ease, background 200ms ease; text-decoration: none; }
  .ex-btn--primary { background: linear-gradient(135deg, var(--red), var(--deep-red)); color: #fff; }
  .ex-btn--primary:hover:not(:disabled) { transform: translateY(-1px); }
  .ex-btn--ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--border); }
  .ex-btn--ghost:hover:not(:disabled) { background: var(--blush); }
  .ex-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .ex-status { padding: 12px 16px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .ex-status--info    { background: #EEF3FB; color: var(--navy); }
  .ex-status--success { background: #EAF7EE; color: #2F8F4A; }
  .ex-status--error   { background: #FDECEC; color: var(--deep-red); }
  .ex-status.is-hidden { display: none; }
</style>
</head>
<body>
  <div class="app">
    <div id="sidebar-mount"></div>
    <main class="page">
      <div class="page-scroll">
        <div class="page-inner" style="max-width: 1200px">

          <section class="ex-hero">
            <h1 class="ex-hero__title">Extract text from an image</h1>
            <p class="ex-hero__sub">Upload a photo of a textbook page, handwritten notes, or a diagram. The AI reads it and gives you the text.</p>
            <div class="ex-drop" id="drop" role="button" tabindex="0">
              <i class="fa-solid fa-cloud-arrow-up ex-drop__icon"></i>
              <div class="ex-drop__text">Drop an image here or click to choose</div>
              <div class="ex-drop__hint">JPG · PNG · WEBP · HEIC — up to 20 MB</div>
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none">
          </section>

          <div id="status" class="ex-status is-hidden"></div>

          <div class="ex-grid" id="grid" style="display:none">
            <div class="ex-card">
              <div class="ex-card__head"><i class="fa-solid fa-image"></i> Your image</div>
              <div class="ex-card__body">
                <img class="ex-preview" id="preview" alt="Uploaded">
              </div>
            </div>
            <div class="ex-card">
              <div class="ex-card__head"><i class="fa-solid fa-file-lines"></i> Extracted text</div>
              <div class="ex-card__body">
                <div class="ex-text" id="extracted"></div>
                <div class="ex-actions">
                  <button class="ex-btn ex-btn--primary" id="extract-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Extract text
                  </button>
                  <button class="ex-btn ex-btn--ghost" id="copy-btn" disabled>
                    <i class="fa-solid fa-copy"></i> Copy
                  </button>
                  <button class="ex-btn ex-btn--ghost" id="save-note-btn" disabled>
                    <i class="fa-solid fa-note-sticky"></i> Save as note
                  </button>
                  <button class="ex-btn ex-btn--ghost" id="reset-btn">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                  </button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var drop      = document.getElementById('drop');
  var fileInput = document.getElementById('file-input');
  var grid      = document.getElementById('grid');
  var preview   = document.getElementById('preview');
  var extracted = document.getElementById('extracted');
  var statusEl  = document.getElementById('status');
  var extractBtn= document.getElementById('extract-btn');
  var copyBtn   = document.getElementById('copy-btn');
  var saveBtn   = document.getElementById('save-note-btn');
  var resetBtn  = document.getElementById('reset-btn');

  var currentAttachmentId = null;
  var currentImageName = '';

  function showStatus(kind, msg) {
    statusEl.className = 'ex-status ex-status--' + kind;
    statusEl.innerHTML = '<i class="fa-solid ' +
      (kind === 'success' ? 'fa-circle-check' : kind === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info') +
      '"></i> ' + msg;
  }
  function hideStatus() { statusEl.className = 'ex-status is-hidden'; }

  function reset() {
    currentAttachmentId = null;
    currentImageName = '';
    preview.src = '';
    extracted.textContent = '';
    grid.style.display = 'none';
    copyBtn.disabled = true;
    saveBtn.disabled = true;
    extractBtn.disabled = false;
    extractBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Extract text';
    hideStatus();
  }

  async function uploadImage(file) {
    showStatus('info', 'Uploading…');
    var form = new FormData();
    form.append('file', file);
    try {
      var res = await fetch('/api/chat/attachments', {
        method: 'POST', credentials: 'include', body: form,
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        showStatus('error', data.error || 'Upload failed');
        return;
      }
      currentAttachmentId = data.attachment.id;
      currentImageName = data.attachment.original_name || 'image';

      // Show preview
      preview.src = URL.createObjectURL(file);
      grid.style.display = 'grid';
      hideStatus();
    } catch (err) {
      showStatus('error', 'Could not reach the server.');
    }
  }

  async function extractText() {
    if (!currentAttachmentId) return;
    extractBtn.disabled = true;
    extractBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Reading…';
    showStatus('info', 'Reading text from your image. This can take 10–30 seconds.');

    try {
      var res = await fetch('/api/chat/extract/' + currentAttachmentId, {
        method: 'POST', credentials: 'include',
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        if (data.code === 'ALL_VISION_PROVIDERS_FAILED' || res.status === 503) {
          showStatus('error',
            'Reading service is unavailable. Add OpenAI credits, or install a local model with: <code>ollama pull llava:7b</code>');
        } else {
          showStatus('error', data.error || 'Extraction failed.');
        }
        extractBtn.disabled = false;
        extractBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Try again';
        return;
      }
      extracted.textContent = data.text || '(no text found)';
      copyBtn.disabled = false;
      saveBtn.disabled = false;
      extractBtn.disabled = false;
      extractBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Re-extract';
      showStatus('success', 'Done — ' + (data.provider || 'AI') + ' read ' + data.text.length + ' characters.');
    } catch (err) {
      showStatus('error', 'Network error. Please try again.');
      extractBtn.disabled = false;
      extractBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Try again';
    }
  }

  async function saveNote() {
    var text = extracted.textContent.trim();
    if (!text) return;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';
    try {
      var res = await fetch('/api/tools/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          title: 'Extracted: ' + (currentImageName || 'image'),
          content: text,
          subject: null,
        }),
      });
      if (!res.ok) throw new Error('failed');
      saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Saved';
      showStatus('success', 'Saved to your notes.');
      setTimeout(function () {
        saveBtn.innerHTML = '<i class="fa-solid fa-note-sticky"></i> Save as note';
        saveBtn.disabled = false;
      }, 2200);
    } catch (_) {
      saveBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> Failed';
      setTimeout(function () {
        saveBtn.innerHTML = '<i class="fa-solid fa-note-sticky"></i> Save as note';
        saveBtn.disabled = false;
      }, 2200);
    }
  }

  function copyText() {
    var text = extracted.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(function () {
      copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
      setTimeout(function () {
        copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy';
      }, 1600);
    });
  }

  /* ---------- Wire up ---------- */
  drop.addEventListener('click', function () { fileInput.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  ['dragenter', 'dragover'].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault(); e.stopPropagation(); drop.classList.add('is-drag');
    });
  });
  ['dragleave', 'drop'].forEach(function (evt) {
    drop.addEventListener(evt, function (e) {
      e.preventDefault(); e.stopPropagation(); drop.classList.remove('is-drag');
    });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
      var f = e.dataTransfer.files[0];
      if (f.type && f.type.indexOf('image/') === 0) uploadImage(f);
      else showStatus('error', 'Please drop an image file.');
    }
  });

  fileInput.addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) uploadImage(e.target.files[0]);
    fileInput.value = '';
  });

  extractBtn.addEventListener('click', extractText);
  copyBtn.addEventListener('click', copyText);
  saveBtn.addEventListener('click', saveNote);
  resetBtn.addEventListener('click', reset);

})();
</script>
</body>
</html>
