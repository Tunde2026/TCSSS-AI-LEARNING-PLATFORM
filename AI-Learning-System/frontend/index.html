<link rel="stylesheet" href="assets/shell.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 20% 0%, rgba(201,149,46,0.10), transparent 55%),
      var(--blush);
  }
  .auth-card { width: 100%; max-width: 440px; }
  .auth-brand { text-align: center; margin-bottom: 22px; }

  /* ---------- Centered circular profile image ---------- */
  .auth-brand__mark {
    width: 88px;
    height: 88px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--navy), var(--soft-navy));
    color: rgba(255, 255, 255, 0.55);
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 4px var(--white),
      0 0 0 6px var(--gold),
      0 10px 28px rgba(17, 16, 74, 0.22);
    transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 260ms ease;
  }
  .auth-brand__mark:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 0 4px var(--white),
      0 0 0 6px var(--gold),
      0 14px 34px rgba(17, 16, 74, 0.3);
  }
  .auth-brand__mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: var(--white);
  }
  .auth-brand__mark.is-fallback {
    background: linear-gradient(135deg, var(--blush), var(--blush-deep));
  }
  .auth-brand__mark.is-fallback img {
    object-fit: contain;
    padding: 22px;
    background: transparent;
  }

  .auth-brand__title {
    font-family: var(--font-head);
    font-size: 1.35rem;
    color: var(--navy);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .auth-brand__sub {
    font-size: 0.85rem;
    color: var(--slate);
    margin-top: 4px;
  }

  .auth-tabs {
    display: flex; gap: 4px;
    background: var(--blush-deep);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .auth-tab {
    flex: 1;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 8px 12px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--slate);
    cursor: pointer;
    transition: background var(--transition), color var(--transition);
  }
  .auth-tab.is-active {
    background: var(--white);
    color: var(--navy);
    box-shadow: var(--shadow-sm);
  }

  .field { margin-bottom: 14px; }
  .field-hint { font-size: 0.75rem; color: var(--slate); margin-top: 4px; }

  /* ---------- Password field with show/hide toggle ---------- */
  .input-wrap {
    position: relative;
    display: block;
  }
  .input-wrap .input {
    padding-right: 46px;
  }
  .input-toggle {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--slate);
    cursor: pointer;
    display: grid;
    place-items: center;
    border-radius: 9px;
    padding: 0;
    transition: background var(--transition), color var(--transition);
    -webkit-tap-highlight-color: transparent;
  }
  .input-toggle:hover { background: var(--blush); color: var(--navy); }
  .input-toggle:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
    color: var(--navy);
  }
  .input-toggle:active { transform: translateY(-50%) scale(0.94); }
  .input-toggle svg { width: 18px; height: 18px; display: block; }
  .input-toggle .icon-eye-off { display: none; }
  .input-toggle.is-visible .icon-eye     { display: none; }
  .input-toggle.is-visible .icon-eye-off { display: block; }

  .auth-actions {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 20px;
  }
  .auth-actions .forgot { font-size: 0.85rem; color: var(--slate); }

  .auth-alert {
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 0.9rem;
    margin-bottom: 14px;
    display: none;
    line-height: 1.5;
  }
  .auth-alert.is-visible { display: block; }
  .auth-alert--error { background: #FDECEC; color: var(--deep-red); }
  .auth-alert--info  { background: #EEF3FB; color: var(--navy); }
  .auth-alert--warn  { background: #FBF3E1; color: #8A5A00; }

  .auth-alert__title {
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
    font-size: 0.95rem;
  }
  .auth-alert__reason {
    display: block;
    margin-top: 8px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.06);
    border-radius: 6px;
    font-size: 0.85rem;
    font-style: italic;
  }
  .auth-alert__action {
    display: inline-block;
    margin-top: 8px;
    font-weight: 600;
    color: var(--red);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
  }

  .auth-foot {
    text-align: center; margin-top: 22px;
    font-size: 0.82rem; color: var(--slate);
  }
  .auth-foot a { color: var(--slate); }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .auth-brand__mark { width: 76px; height: 76px; }
    .auth-brand__title { font-size: 1.2rem; }
  }
</style>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <!-- Centered circular profile image — fixed for now, admin-managed later -->
        <div class="auth-brand__mark" id="brand-mark">
          <img id="brand-img"
               src="/uploads/branding/logo.png"
               alt="TCSSS profile"
               onerror="window.__handleBrandFallback && window.__handleBrandFallback(this);">
        </div>
        <h1 class="auth-brand__title" id="brand-title">AI Learning Platform</h1>
        <div class="auth-brand__sub" id="brand-sub">Sign in to continue</div>
      </div>

      <div class="card">
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab is-active" id="tab-login"  role="tab" aria-selected="true">Sign in</button>
          <button class="auth-tab"           id="tab-signup" role="tab" aria-selected="false">Create account</button>
        </div>

        <div class="auth-alert" id="alert" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label class="label" for="login-email">Email</label>
            <input class="input" type="email" id="login-email" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="label" for="login-password">Password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="login-password" autocomplete="current-password" required>
              <button type="button" class="input-toggle" data-target="login-password"
                      aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="auth-actions">
            <a href="#" class="forgot">Forgot password?</a>
            <button class="btn btn-primary" type="submit" id="login-submit">Sign in</button>
          </div>
        </form>

        <form id="signup-form" class="hidden" novalidate>
          <div class="field">
            <label class="label" for="signup-name">Full name</label>
            <input class="input" type="text" id="signup-name" autocomplete="name" required>
          </div>
          <div class="field">
            <label class="label" for="signup-email">Email</label>
            <input class="input" type="email" id="signup-email" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="label" for="signup-password">Password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="signup-password"
                     autocomplete="new-password" minlength="8" required>
              <button type="button" class="input-toggle" data-target="signup-password"
                      aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <div class="field-hint">At least 8 characters.</div>
          </div>
          <div class="field">
            <label class="label" for="signup-confirm">Confirm password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="signup-confirm" autocomplete="new-password" required>
              <button type="button" class="input-toggle" data-target="signup-confirm"
                      aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="auth-actions" style="justify-content:flex-end">
            <button class="btn btn-primary" type="submit" id="signup-submit">Create account</button>
          </div>
        </form>
      </div>

      <div class="auth-foot">
        <a href="https://gideon-olukanni.github.io/TCSSS/" target="_blank" rel="noopener noreferrer">
          Official School Website &#8599;
        </a>
      </div>
    </div>
  </main>

<script>
  // ---- Element refs ----
  const tabLogin   = document.getElementById('tab-login');
  const tabSignup  = document.getElementById('tab-signup');
  const loginForm  = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const brandSub   = document.getElementById('brand-sub');
  const brandTitle = document.getElementById('brand-title');
  const brandMark  = document.getElementById('brand-mark');
  const brandImg   = document.getElementById('brand-img');
  const alertEl    = document.getElementById('alert');

  // ---- Fixed fallback profile image (inline SVG avatar) ----
  // Used when /uploads/branding/logo.png is missing or fails to load.
  // Admin page will replace this later with real profile management.
  const FALLBACK_AVATAR =
    "data:image/svg+xml;utf8," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#5B5A6B">' +
        '<path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5z"/>' +
        '<path d="M12 14c-3.34 0-10 1.67-10 5v3h20v-3c0-3.33-6.66-5-10-5z"/>' +
      '</svg>'
    );

  window.__handleBrandFallback = function (imgEl) {
    // Prevent infinite loop if the fallback itself somehow fails.
    if (imgEl.dataset.fallbackApplied === '1') return;
    imgEl.dataset.fallbackApplied = '1';
    imgEl.src = FALLBACK_AVATAR;
    brandMark.classList.add('is-fallback');
  };

  // ---- Password show / hide toggles ----
  function resetAllToggles() {
    document.querySelectorAll('.input-toggle').forEach(function (btn) {
      btn.classList.remove('is-visible');
      btn.setAttribute('aria-pressed', 'false');
      btn.setAttribute('aria-label', 'Show password');
      btn.setAttribute('title', 'Show password');
      var target = document.getElementById(btn.getAttribute('data-target'));
      if (target) target.type = 'password';
    });
  }

  document.querySelectorAll('.input-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = document.getElementById(btn.getAttribute('data-target'));
      if (!target) return;

      var showing = target.type === 'text';
      target.type = showing ? 'password' : 'text';
      btn.classList.toggle('is-visible', !showing);
      btn.setAttribute('aria-pressed', String(!showing));
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      btn.setAttribute('title', showing ? 'Show password' : 'Hide password');

      target.focus();
      var len = target.value.length;
      try { target.setSelectionRange(len, len); } catch (_) {}
    });

    // Keep input focus when clicking the toggle.
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  // ---- Load branding (platform name + profile image) ----
  (async function loadBranding() {
    try {
      const res = await fetch('/api/platform/info');
      if (!res.ok) return;
      const data = await res.json();

      if (data.name) brandTitle.textContent = data.name;

      // If the backend returns a URL, use it; otherwise keep the fixed default.
      // Admin page will overwrite the value returned here later.
      if (data.logoUrl) {
        brandImg.dataset.fallbackApplied = '';
        brandMark.classList.remove('is-fallback');
        brandImg.src = data.logoUrl;
      }
    } catch (_) {
      // Network failure — fallback image stays in place.
    }
  })();

  // ---- Alert helpers ----
  function clearAlert() {
    alertEl.className = 'auth-alert';
    alertEl.innerHTML = '';
  }
  function showError(msg) {
    alertEl.className = 'auth-alert auth-alert--error is-visible';
    alertEl.textContent = msg;
  }
  function showInfo(msg) {
    alertEl.className = 'auth-alert auth-alert--info is-visible';
    alertEl.textContent = msg;
  }
  function showInfoWithAction(msg, actionLabel, onClick) {
    alertEl.className = 'auth-alert auth-alert--info is-visible';
    alertEl.innerHTML = '';
    alertEl.appendChild(document.createTextNode(msg + ' '));
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'auth-alert__action';
    btn.textContent = actionLabel;
    btn.addEventListener('click', onClick);
    alertEl.appendChild(btn);
  }

  // Special: suspended account with reason
  function showSuspended(reason, suspendedAt) {
    alertEl.className = 'auth-alert auth-alert--warn is-visible';
    alertEl.innerHTML = '';

    const title = document.createElement('span');
    title.className = 'auth-alert__title';
    title.textContent = 'Your account is suspended';
    alertEl.appendChild(title);

    const body = document.createElement('span');
    body.textContent = 'You are not able to sign in at the moment. If you believe this is a mistake, contact your school administrator.';
    alertEl.appendChild(body);

    if (reason) {
      const r = document.createElement('span');
      r.className = 'auth-alert__reason';
      r.textContent = 'Reason: ' + reason;
      alertEl.appendChild(r);
    }

    if (suspendedAt) {
      const t = document.createElement('span');
      t.style.cssText = 'display:block;margin-top:6px;font-size:0.78rem;opacity:0.8';
      t.textContent = 'Suspended on ' + new Date(suspendedAt).toLocaleDateString();
      alertEl.appendChild(t);
    }

    const footer = document.createElement('span');
    footer.style.cssText = 'display:block;margin-top:10px;font-size:0.82rem;font-weight:500';
    footer.textContent = 'Please try again later.';
    alertEl.appendChild(footer);
  }

  // ---- Tab switching ----
  function switchMode(mode) {
    clearAlert();
    const isLogin = mode === 'login';

    tabLogin.classList.toggle('is-active', isLogin);
    tabSignup.classList.toggle('is-active', !isLogin);
    tabLogin.setAttribute('aria-selected', isLogin);
    tabSignup.setAttribute('aria-selected', !isLogin);

    loginForm.classList.toggle('hidden', !isLogin);
    signupForm.classList.toggle('hidden', isLogin);
    brandSub.textContent = isLogin ? 'Sign in to continue' : 'Create your account';

    loginForm.reset();
    signupForm.reset();
    resetAllToggles();

    setTimeout(() => {
      document.getElementById(isLogin ? 'login-email' : 'signup-name').focus();
    }, 0);
  }

  tabLogin.addEventListener('click',  () => switchMode('login'));
  tabSignup.addEventListener('click', () => switchMode('signup'));

  // ---- LOGIN submit ----
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert();

    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const submit   = document.getElementById('login-submit');

    if (!email || !password) { showError('Please enter both email and password.'); return; }

    submit.disabled = true;
    submit.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) { window.location.href = 'chat.html'; return; }

      if (res.status === 403 && data.code === 'SUSPENDED') {
        showSuspended(data.reason, data.suspendedAt);
        return;
      }

      if (res.status === 404 || data.code === 'NO_ACCOUNT') {
        const typedEmail = email;
        showInfoWithAction('No account found with that email.', 'Create one now', () => {
          switchMode('signup');
          document.getElementById('signup-email').value = typedEmail;
        });
        return;
      }

      if (res.status === 401 || data.code === 'BAD_CREDENTIALS') {
        showError('Incorrect password. Please try again.');
        return;
      }

      showError(data.error || 'Sign in failed. Please try again.');
    } catch (err) {
      showError('Cannot reach the server. Please try again.');
    } finally {
      submit.disabled = false;
      submit.textContent = 'Sign in';
    }
  });

  // ---- SIGNUP submit ----
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert();

    const name     = document.getElementById('signup-name').value.trim();
    const email    = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm  = document.getElementById('signup-confirm').value;
    const submit   = document.getElementById('signup-submit');

    if (!name || !email || !password || !confirm) { showError('Please fill in every field.'); return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
    if (password !== confirm) { showError('Passwords do not match.'); return; }

    submit.disabled = true;
    submit.textContent = 'Creating account…';

    try {
      const res = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ name, email, password }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) { window.location.href = 'chat.html'; return; }

      if (res.status === 409 || data.code === 'EMAIL_TAKEN') {
        const typedEmail = email;
        showInfoWithAction('An account with that email already exists.', 'Sign in instead', () => {
          switchMode('login');
          document.getElementById('login-email').value = typedEmail;
        });
        return;
      }
      showError(data.error || 'Could not create your account.');
    } catch (err) {
      showError('Cannot reach the server. Please try again.');
    } finally {
      submit.disabled = false;
      submit.textContent = 'Create account';
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('login-email').focus();
  });
</script>
</body>
</html>
