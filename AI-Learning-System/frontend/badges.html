<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achievements — AI Learning Platform</title>
<link rel="icon" type="image/png" href="/uploads/branding/logo.png">
<link rel="stylesheet" href="assets/shell.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<style>
  main.page .page-scroll { padding: 14px 18px 40px !important; }
  main.page .page-inner { max-width: 1280px !important; width: 100% !important; padding: 0 !important; margin: 0 auto !important; }
  @media (max-width: 900px) { main.page .page-scroll { padding: 10px 12px 28px !important; } }

  /* ---------- HERO ---------- */
  .bd-hero {
    position: relative; overflow: hidden;
    border-radius: 20px;
    padding: 28px 26px 24px;
    margin-bottom: 20px;
    color: #fff;
    background: linear-gradient(135deg, #11104A 0%, #201F6B 40%, #3D1F5C 70%, #11104A 100%);
    background-size: 300% 300%;
    animation: heroPan 18s ease infinite;
    box-shadow: 0 16px 40px rgba(17,16,74,0.28);
  }
  @keyframes heroPan { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .bd-hero::after {
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 15% 12%, rgba(201,149,46,0.22), transparent 45%),
                radial-gradient(circle at 85% 88%, rgba(230,17,30,0.16), transparent 45%);
    pointer-events:none;
  }
  .bd-hero > * { position: relative; z-index: 1; }
  .bd-hero__eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
    font-family: var(--font-ui); font-size: 0.6rem;
    letter-spacing: 0.13em; text-transform: uppercase; font-weight: 700;
    color: #fff !important;
    margin-bottom: 12px;
  }
  .bd-hero__eyebrow i { color: #FFD97D !important; }
  .bd-hero__title {
    font-family: var(--font-head); font-weight: 600;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    color: #ffffff !important;
    margin: 0 0 6px; letter-spacing: -0.02em;
  }
  .bd-hero__sub {
    font-size: 0.92rem; line-height: 1.55;
    color: rgba(255,255,255,0.88) !important;
    max-width: 620px; margin: 0 0 18px;
  }

  .bd-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 760px) { .bd-stats { grid-template-columns: repeat(2, 1fr); } }
  .bd-stat {
    padding: 12px 12px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .bd-stat__icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center;
    font-size: 1rem; flex-shrink: 0;
    background: rgba(201,149,46,0.24); color: #FFD97D;
  }
  .bd-stat--fire .bd-stat__icon { background: rgba(230,17,30,0.30); color: #FFE0E2; }
  .bd-stat--progress .bd-stat__icon { background: rgba(110,107,229,0.28); color: #DAD8FF; }
  .bd-stat--time .bd-stat__icon { background: rgba(47,143,74,0.30); color: #C7E9D1; }
  .bd-stat__num {
    font-family: var(--font-head); font-size: 1.3rem; font-weight: 700;
    line-height: 1; color: #fff !important; letter-spacing: -0.02em;
    margin-bottom: 3px;
  }
  .bd-stat__num small {
    font-size: 0.72rem; font-family: var(--font-body); font-weight: 500;
    color: rgba(255,255,255,0.75) !important; margin-left: 3px;
  }
  .bd-stat__label {
    font-family: var(--font-ui); font-size: 0.56rem;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.78) !important; font-weight: 600;
  }

  /* ---------- TABS ---------- */
  .bd-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 4px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    margin-bottom: 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bd-tabs::-webkit-scrollbar { display: none; }
  .bd-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 999px;
    border: none;
    background: transparent;
    font-family: var(--font-body); font-size: 0.82rem; font-weight: 600;
    color: var(--slate); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 150ms, color 150ms;
  }
  .bd-tab:hover { background: var(--blush); color: var(--navy); }
  .bd-tab.is-active { background: var(--navy); color: #fff; }
  .bd-tab__count {
    font-family: var(--font-ui); font-size: 0.6rem;
    padding: 1px 7px; border-radius: 999px;
    background: var(--blush-deep); color: var(--navy); font-weight: 700;
  }
  .bd-tab.is-active .bd-tab__count { background: rgba(255,255,255,0.24); color: #fff; }

  /* ---------- GRID ---------- */
  .bd-section { margin-bottom: 28px; }
  .bd-section__head {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 10px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .bd-section__title {
    font-family: var(--font-head); font-size: 1.15rem; font-weight: 600;
    color: var(--navy); margin: 0; letter-spacing: -0.01em;
  }
  .bd-section__count {
    margin-left: auto;
    font-family: var(--font-ui); font-size: 0.62rem;
    padding: 3px 10px; border-radius: 999px;
    background: var(--blush); color: var(--slate); font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
  }

  .bd-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  @media (max-width: 540px) {
    .bd-grid { grid-template-columns: 1fr; }
  }

  .bd-card {
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
    transition: border-color 260ms, transform 320ms cubic-bezier(0.16,1,0.3,1), box-shadow 320ms;
  }
  .bd-card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 12px 26px rgba(17,16,74,0.10); }
  .bd-card--locked { opacity: 0.85; }
  .bd-card--locked:hover { opacity: 1; }
  .bd-card--earned { background: linear-gradient(155deg, #FFFFFF, #FBF3E1); }

  .bd-card__icon {
    width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center;
    font-size: 1.15rem;
    flex-shrink: 0;
    transition: transform 320ms;
  }
  .bd-card:hover .bd-card__icon { transform: scale(1.06) rotate(-4deg); }
  .bd-card__icon--navy   { background: linear-gradient(155deg, #ECEBF5, #DAD8EA); color: var(--navy); }
  .bd-card__icon--gold   { background: linear-gradient(155deg, #FBF3E1, #F4E2B8); color: #9E7524; }
  .bd-card__icon--red    { background: linear-gradient(155deg, #FDECEC, #F8D4D4); color: var(--deep-red); }
  .bd-card__icon--green  { background: linear-gradient(155deg, #EAF7EE, #C9E8D2); color: #2F8F4A; }
  .bd-card--locked .bd-card__icon { filter: grayscale(0.7); opacity: 0.7; }

  .bd-card__body { flex: 1; min-width: 0; }
  .bd-card__name {
    font-family: var(--font-head); font-size: 1rem;
    color: var(--navy); margin: 0 0 4px; font-weight: 600;
    line-height: 1.3;
  }
  .bd-card__desc {
    font-size: 0.82rem; color: var(--slate);
    line-height: 1.5; margin: 0;
  }

  /* Progress bar for in-progress badges */
  .bd-card__progress {
    display: flex; align-items: center; gap: 8px;
    margin-top: 4px;
  }
  .bd-card__progress-bar {
    flex: 1; height: 6px;
    background: var(--blush-deep);
    border-radius: 4px; overflow: hidden;
  }
  .bd-card__progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    border-radius: 4px;
    transition: width 400ms cubic-bezier(0.16,1,0.3,1);
  }
  .bd-card__progress-text {
    font-family: var(--font-ui); font-size: 0.62rem;
    color: var(--slate); font-weight: 700; letter-spacing: 0.04em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Footer */
  .bd-card__footer {
    display: flex; align-items: center; gap: 8px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-soft);
    font-family: var(--font-ui); font-size: 0.6rem;
    color: var(--slate); letter-spacing: 0.04em;
    flex-wrap: wrap;
  }
  .bd-card__badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; font-size: 0.56rem;
  }
  .bd-card__badge--earned { background: #EAF7EE; color: #2F8F4A; }
  .bd-card__badge--reset { background: var(--blush); color: var(--slate); }

  .bd-reset-btn {
    margin-left: auto;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--navy);
    font-family: var(--font-body); font-size: 0.72rem; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background 150ms, border-color 150ms;
  }
  .bd-reset-btn:hover { background: var(--blush); border-color: var(--navy); }

  /* NEW badge ribbon */
  .bd-card--new::before {
    content: 'NEW';
    position: absolute; top: 10px; right: 10px;
    background: linear-gradient(135deg, var(--red), var(--deep-red));
    color: #fff;
    padding: 3px 9px; border-radius: 999px;
    font-family: var(--font-ui); font-size: 0.52rem;
    letter-spacing: 0.1em; font-weight: 700;
    box-shadow: 0 3px 10px rgba(230,17,30,0.32);
  }

  /* Empty state */
  .bd-empty {
    padding: 50px 24px; text-align: center;
    background: var(--white); border: 1.5px dashed var(--border);
    border-radius: 14px; color: var(--slate);
  }
  .bd-empty i { font-size: 2rem; color: var(--gold); display: block; margin-bottom: 12px; }
  .bd-empty__title { font-family: var(--font-head); font-size: 1.05rem; color: var(--navy); margin: 0 0 6px; }

  /* History table */
  .bd-history { background: var(--white); border: 1.5px solid var(--border); border-radius: 14px; overflow: hidden; }
  .bd-history__row {
    display: grid; grid-template-columns: 40px 1fr 120px 120px;
    gap: 12px; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 0.88rem;
  }
  .bd-history__row:last-child { border-bottom: none; }
  .bd-history__row--head {
    background: var(--blush);
    font-family: var(--font-ui); font-size: 0.62rem;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--slate); font-weight: 700;
  }
  .bd-history__icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(155deg, #FBF3E1, #F4E2B8);
    color: #9E7524;
    display: grid; place-items: center;
    font-size: 0.92rem;
  }
  .bd-history__name { font-weight: 600; color: var(--navy); }
  .bd-history__time, .bd-history__duration {
    font-family: var(--font-ui); font-size: 0.72rem; color: var(--slate);
  }
  @media (max-width: 640px) {
    .bd-history__row { grid-template-columns: 40px 1fr; gap: 8px; padding: 10px 12px; font-size: 0.82rem; }
    .bd-history__row--head > :nth-child(3),
    .bd-history__row--head > :nth-child(4),
    .bd-history__row > :nth-child(3),
    .bd-history__row > :nth-child(4) { display: none; }
  }

  /* Toast */
  .bd-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff;
    padding: 12px 22px; border-radius: 999px;
    font-size: 0.88rem; z-index: 500;
    box-shadow: 0 12px 32px rgba(17,16,74,0.35);
    animation: bdToastIn 240ms cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes bdToastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .bd-toast--error { background: var(--deep-red); }
  .bd-toast--success { background: #2F8F4A; }

  /* Reveal */
  .bd-reveal {
    opacity: 0; transform: translateY(12px);
    transition: opacity 500ms cubic-bezier(0.16,1,0.3,1),
                transform 500ms cubic-bezier(0.16,1,0.3,1);
    transition-delay: calc(var(--i, 0) * 40ms);
  }
  .bd-reveal.is-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .bd-reveal { opacity: 1; transform: none; transition: none; } }
</style>
</head>
<body>
  <div class="app">
    <div id="sidebar-mount"></div>
    <main class="page">
      <div class="page-scroll">
        <div class="page-inner">

          <!-- ============ HERO ============ -->
          <section class="bd-hero">
            <div class="bd-hero__eyebrow">
              <i class="fa-solid fa-trophy"></i> Your achievements
            </div>
            <h1 class="bd-hero__title">Your learning journey, one badge at a time</h1>
            <p class="bd-hero__sub">
              Every message, quiz, flashcard, and day you show up earns progress.
              See what you've unlocked — and what's waiting next.
            </p>

            <div class="bd-stats">
              <div class="bd-stat bd-stat--fire">
                <div class="bd-stat__icon"><i class="fa-solid fa-fire"></i></div>
                <div>
                  <div class="bd-stat__num" id="stat-streak">0<small>days</small></div>
                  <div class="bd-stat__label">Current streak</div>
                </div>
              </div>
              <div class="bd-stat">
                <div class="bd-stat__icon"><i class="fa-solid fa-medal"></i></div>
                <div>
                  <div class="bd-stat__num" id="stat-longest">0<small>days</small></div>
                  <div class="bd-stat__label">Longest streak</div>
                </div>
              </div>
              <div class="bd-stat bd-stat--progress">
                <div class="bd-stat__icon"><i class="fa-solid fa-circle-check"></i></div>
                <div>
                  <div class="bd-stat__num" id="stat-earned">0<small>/ 0</small></div>
                  <div class="bd-stat__label">Badges earned</div>
                </div>
              </div>
              <div class="bd-stat bd-stat--time">
                <div class="bd-stat__icon"><i class="fa-solid fa-clock"></i></div>
                <div>
                  <div class="bd-stat__num" id="stat-duration">—</div>
                  <div class="bd-stat__label">Avg. time</div>
                </div>
              </div>
            </div>
          </section>

          <!-- ============ TABS ============ -->
          <div class="bd-tabs" id="tabs">
            <button class="bd-tab is-active" data-tab="all">
              <i class="fa-solid fa-layer-group"></i> All badges
              <span class="bd-tab__count" id="cnt-all">—</span>
            </button>
            <button class="bd-tab" data-tab="earned">
              <i class="fa-solid fa-trophy"></i> Earned
              <span class="bd-tab__count" id="cnt-earned">—</span>
            </button>
            <button class="bd-tab" data-tab="progress">
              <i class="fa-solid fa-hourglass-half"></i> In progress
              <span class="bd-tab__count" id="cnt-progress">—</span>
            </button>
            <button class="bd-tab" data-tab="history">
              <i class="fa-solid fa-clock-rotate-left"></i> History
              <span class="bd-tab__count" id="cnt-history">—</span>
            </button>
          </div>

          <!-- ============ CONTENT ============ -->
          <div id="content">
            <div class="bd-empty">
              <i class="fa-solid fa-spinner fa-spin"></i>
              <p class="bd-empty__title">Loading your achievements…</p>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

<script src="assets/shell.js"></script>
<script>
(function () {
  'use strict';

  var CATEGORY_ORDER = [
    { key: 'start',     title: 'Getting started',        icon: 'fa-seedling' },
    { key: 'streak',    title: 'Streaks',                icon: 'fa-fire' },
    { key: 'quiz',      title: 'Quizzes',                icon: 'fa-circle-question' },
    { key: 'flashcard', title: 'Flashcards',             icon: 'fa-clone' },
    { key: 'volume',    title: 'Question volume',        icon: 'fa-comment-dots' },
    { key: 'time',      title: 'Time invested',          icon: 'fa-clock' },
    { key: 'explore',   title: 'Exploration',            icon: 'fa-compass' },
    { key: 'subject',   title: 'Subject masters',        icon: 'fa-shapes' },
    { key: 'identity',  title: 'Identity',               icon: 'fa-circle-check' },
    { key: 'other',     title: 'More',                   icon: 'fa-star' },
  ];

  var data = {
    catalog: [],
    user: null,
    earned: {},
    progress: {},
    history: [],
  };
  var activeTab = 'all';
  var currentUser = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function toast(msg, kind) {
    var t = document.createElement('div');
    t.className = 'bd-toast' + (kind ? ' bd-toast--' + kind : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function humanDuration(sec) {
    if (sec == null) return '';
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + 's';
    var m = Math.floor(sec / 60);
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    m = m % 60;
    if (h < 24) return h + 'h ' + m + 'm';
    var d = Math.floor(h / 24);
    h = h % 24;
    return d + 'd ' + h + 'h';
  }
  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (_) { return ''; }
  }

  async function guard() {
    var res = await fetch('/api/auth/me', { credentials: 'include' });
    if (res.status === 401) { window.location.href = 'index.html'; return false; }
    var d = await res.json();
    currentUser = d.user;
    return true;
  }

  async function load() {
    try {
      var [meRes, catRes, histRes] = await Promise.all([
        fetch('/api/badges/me', { credentials: 'include' }),
        fetch('/api/badges/catalog', { credentials: 'include' }),
        fetch('/api/badges/history?limit=50', { credentials: 'include' }),
      ]);
      if (!meRes.ok) throw new Error('me failed');
      var meData = await meRes.json();
      var catData = catRes.ok ? await catRes.json() : { badges: [] };
      var histData = histRes.ok ? await histRes.json() : { history: [] };

      data.user = meData.user || {};
      data.catalog = catData.badges || [];
      data.history = histData.history || [];

      // Build earned map from user's badges
      data.earned = {};
      (meData.badges || []).forEach(function (b) {
        if (b.earned) data.earned[b.key] = b;
      });
      data.progress = meData.progress || {};

      // Stats
      var s = meData.streak || {};
      document.getElementById('stat-streak').innerHTML = (s.current || 0) + '<small>day' + (s.current === 1 ? '' : 's') + '</small>';
      document.getElementById('stat-longest').innerHTML = (s.longest || 0) + '<small>days</small>';

      var earnedCount = Object.keys(data.earned).length;
      document.getElementById('stat-earned').innerHTML = earnedCount + '<small>/ ' + data.catalog.length + '</small>';

      // Average duration of earned badges that have it
      var durations = Object.values(data.earned).filter(function (b) { return b.duration_seconds; }).map(function (b) { return b.duration_seconds; });
      if (durations.length) {
        var avg = durations.reduce(function (a, b) { return a + b; }, 0) / durations.length;
        document.getElementById('stat-duration').innerHTML = humanDuration(avg);
      } else {
        document.getElementById('stat-duration').innerHTML = '—';
      }

      // Counts
      document.getElementById('cnt-all').textContent = data.catalog.length;
      document.getElementById('cnt-earned').textContent = earnedCount;
      document.getElementById('cnt-progress').textContent = Object.keys(data.progress).length;
      document.getElementById('cnt-history').textContent = data.history.length;

      render();
    } catch (err) {
      console.error('[badges] load error:', err);
      document.getElementById('content').innerHTML =
        '<div class="bd-empty"><i class="fa-solid fa-triangle-exclamation"></i>' +
        '<p class="bd-empty__title">Could not load your achievements</p>' +
        '<p style="margin:6px 0 0;font-size:0.85rem">Please refresh the page.</p></div>';
    }
  }

  function renderCard(badge, earned, progress, idx) {
    var isEarned = !!earned;
    var prog = progress || null;
    var cls = 'bd-card bd-reveal' +
      (isEarned ? ' bd-card--earned' : ' bd-card--locked');

    var footer = '';
    if (isEarned) {
      var earnedDate = fmtDate(earned.earned_at);
      var duration = earned.duration_seconds ? humanDuration(earned.duration_seconds) : null;
      footer =
        '<div class="bd-card__footer">' +
          '<span class="bd-card__badge bd-card__badge--earned"><i class="fa-solid fa-circle-check"></i> Earned</span>' +
          '<span style="opacity:0.7">' + esc(earnedDate) + '</span>' +
          (duration ? '<span style="opacity:0.7">· ' + esc(duration) + '</span>' : '') +
          (earned.reset_count > 0 ? '<span class="bd-card__badge bd-card__badge--reset">×' + earned.reset_count + '</span>' : '') +
          '<button type="button" class="bd-reset-btn" data-reset="' + esc(badge.key) + '" title="Reset and try again">' +
            '<i class="fa-solid fa-rotate"></i> Retry' +
          '</button>' +
        '</div>';
    } else if (prog) {
      var pct = Math.min(100, Math.round((prog.current / prog.target) * 100));
      footer =
        '<div class="bd-card__progress">' +
          '<div class="bd-card__progress-bar"><div class="bd-card__progress-fill" style="width:' + pct + '%"></div></div>' +
          '<span class="bd-card__progress-text">' + prog.current + ' / ' + prog.target + '</span>' +
        '</div>' +
        '<div class="bd-card__footer" style="border-top:none;padding-top:4px">' +
          '<span class="bd-card__badge bd-card__badge--reset"><i class="fa-solid fa-hourglass-half"></i> In progress</span>' +
        '</div>';
    } else {
      footer =
        '<div class="bd-card__footer">' +
          '<span class="bd-card__badge bd-card__badge--reset"><i class="fa-solid fa-lock"></i> Locked</span>' +
          '<span style="opacity:0.7">Keep going</span>' +
        '</div>';
    }

    return '<article class="' + cls + '" style="--i:' + idx + '">' +
      '<div class="bd-card__icon bd-card__icon--' + esc(badge.color || 'navy') + '">' +
        '<i class="fa-solid ' + esc(badge.icon || 'fa-medal') + '"></i>' +
      '</div>' +
      '<div class="bd-card__body">' +
        '<h3 class="bd-card__name">' + esc(badge.name) + '</h3>' +
        '<p class="bd-card__desc">' + esc(badge.desc) + '</p>' +
      '</div>' +
      footer +
    '</article>';
  }

  function groupByCategory(badges) {
    var groups = {};
    CATEGORY_ORDER.forEach(function (c) { groups[c.key] = []; });
    badges.forEach(function (b) {
      var cat = b.category || 'other';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(b);
    });
    return groups;
  }

  function render() {
    var el = document.getElementById('content');

    if (activeTab === 'history') {
      renderHistory(el);
      return;
    }

    var toShow = data.catalog.filter(function (b) {
      if (b.secret && !data.earned[b.key]) return false;
      if (activeTab === 'earned') return !!data.earned[b.key];
      if (activeTab === 'progress') return !data.earned[b.key] && data.progress[b.key];
      return true;
    });

    if (!toShow.length) {
      var msg = activeTab === 'earned'
        ? 'No badges earned yet. Start studying and they\'ll show up here.'
        : activeTab === 'progress'
          ? 'No badges in progress right now. Try a quiz, chat, or review some flashcards.'
          : 'No badges available yet.';
      el.innerHTML =
        '<div class="bd-empty"><i class="fa-solid fa-trophy"></i>' +
        '<p class="bd-empty__title">' + esc(msg) + '</p></div>';
      return;
    }

    // Group
    var grouped = groupByCategory(toShow);
    var html = '';
    CATEGORY_ORDER.forEach(function (cat) {
      var list = grouped[cat.key] || [];
      if (!list.length) return;

      var earnedInCat = list.filter(function (b) { return data.earned[b.key]; }).length;
      html += '<section class="bd-section">' +
        '<div class="bd-section__head">' +
          '<h2 class="bd-section__title"><i class="fa-solid ' + cat.icon + '" style="color:var(--gold);margin-right:6px"></i>' + esc(cat.title) + '</h2>' +
          '<span class="bd-section__count">' + earnedInCat + ' / ' + list.length + '</span>' +
        '</div>' +
        '<div class="bd-grid">' +
          list.map(function (b, i) {
            return renderCard(b, data.earned[b.key], data.progress[b.key], i);
          }).join('') +
        '</div>' +
      '</section>';
    });

    el.innerHTML = html;

    // Reset buttons
    el.querySelectorAll('[data-reset]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-reset');
        confirmReset(key);
      });
    });

    // Reveal animation
    requestAnimationFrame(function () {
      el.querySelectorAll('.bd-reveal').forEach(function (node) {
        node.classList.add('is-visible');
      });
    });
  }

  async function confirmReset(badgeKey) {
    var badge = data.catalog.find(function (b) { return b.key === badgeKey; });
    if (!badge) return;
    var label = badge.name;
    if (!confirm('Reset "' + label + '"?\n\nYou will start from zero. Your completion history is kept — this only resets the current badge.')) return;

    try {
      var res = await fetch('/api/badges/' + encodeURIComponent(badgeKey) + '/reset', {
        method: 'POST',
        credentials: 'include',
      });
      var body = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        toast(body.error || 'Could not reset badge.', 'error');
        return;
      }
      toast('Reset. Start earning it again!', 'success');
      await load();
    } catch (err) {
      toast('Network error.', 'error');
    }
  }

  function renderHistory(el) {
    if (!data.history.length) {
      el.innerHTML =
        '<div class="bd-empty"><i class="fa-solid fa-clock-rotate-left"></i>' +
        '<p class="bd-empty__title">No completions yet</p>' +
        '<p style="margin:6px 0 0;font-size:0.85rem">Every time you earn a badge, it appears here forever.</p></div>';
      return;
    }

    var rows = data.history.map(function (h) {
      return '<div class="bd-history__row">' +
        '<div class="bd-history__icon"><i class="fa-solid ' + esc(h.icon || 'fa-medal') + '"></i></div>' +
        '<div class="bd-history__name">' + esc(h.name) + '</div>' +
        '<div class="bd-history__time">' + fmtDate(h.completed_at) + '</div>' +
        '<div class="bd-history__duration">' + (h.duration_seconds ? humanDuration(h.duration_seconds) : '—') + '</div>' +
      '</div>';
    }).join('');

    el.innerHTML =
      '<div class="bd-history">' +
        '<div class="bd-history__row bd-history__row--head">' +
          '<div></div><div>Badge</div><div>Completed</div><div>Took</div>' +
        '</div>' +
        rows +
      '</div>';
  }

  // Tabs
  document.querySelectorAll('.bd-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.bd-tab').forEach(function (t) { t.classList.remove('is-active'); });
      tab.classList.add('is-active');
      activeTab = tab.getAttribute('data-tab');
      render();
    });
  });

  (async function init() {
    if (!(await guard())) return;
    await load();
  })();
})();
</script>
</body>
</html>
