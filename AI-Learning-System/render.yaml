services:
  - type: web
    name: ai-learning-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OLLAMA_URL
        value: http://localhost:11434/v1
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: GROQ_KEY_1
        sync: false
      - key: GROQ_KEY_2
        sync: false
      - key: CEREBRAS_KEY_1
        sync: false
      - key: GOOGLE_KEY_1
        sync: false
      - key: NVIDIA_KEY_1
        sync: false
      - key: OPENROUTER_KEY_1
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: base
